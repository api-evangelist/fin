openapi: 3.2.0
info:
  title: Fin Webhooks API
  version: 1.0.0
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: fin-openapi.yml, fin-webhooks-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sandbox.api.fin.com
  description: Sandbox server
- url: https://api.fin.com
  description: Production server
tags:
- name: Webhooks
paths: {}
webhooks:
  customer.created:
    post:
      summary: Customer Created
      description: This webhook event is triggered when a customer is successfully created. The event supports both `INDIVIDUAL` and `BUSINESS` customer types. For business customers, the payload includes associated parties with their ownership percentages and verification status.
      x-mint:
        metadata:
          title: customer.created
        content: "<Note>\n  **Security:** All webhook requests include HMAC signatures for verification. \n  Learn how to [verify webhook signatures](/guides/webhooks/verifying-webhooks) to ensure requests are authentic.\n</Note>\n"
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreatedWebhook'
            examples:
              individualCreated:
                summary: Individual Customer Created
                value:
                  event:
                    id: 60bef15c-4e30-4eb4-bc4d-aa697a7e0857
                    event_reference_id: c3309534-1517-4d15-b244-be8f943c3823
                    type: customer.created
                    created_at: '2025-11-30T07:40:06.853938Z'
                    sandbox_mode: true
                  data:
                    country_of_residence: USA
                    created_at: '2025-11-30T07:40:06Z'
                    customer_id: c3309534-1517-4d15-b244-be8f943c3823
                    customer_status: INCOMPLETE
                    email: john.doe@email.com
                    first_name: John
                    last_name: Doe
                    phone: '+12597751234'
                    tos_policies_url: 25764ef6-0f4f-4846-b7c6-9df0598358e9
                    type: INDIVIDUAL
                    updated_at: '2025-11-30T07:40:07Z'
                    verification_type: RELIANCE
              businessCreated:
                summary: Business Customer Created
                value:
                  event:
                    id: d2a592e4-5703-46aa-b1ac-fa1fa6359abf
                    event_reference_id: b222b827-3ac7-4d20-bfd0-ebedc44435f7
                    type: customer.created
                    created_at: '2025-11-30T08:01:03.819938Z'
                    sandbox_mode: true
