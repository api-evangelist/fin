        customer_status:
          type: string
          description: 'V1 statuses: INCOMPLETE, QUEUED, REVIEWING, APPROVED, ASSOCIATED_PARTIES_REMAINING, ON_HOLD, REINITIATE, REJECTED. V2 statuses: INCOMPLETE, PROCESSING, REVIEWING, APPROVED, ASSOCIATED_PARTIES_REMAINING, IN_COMPLIANCE, ACTION_REQUIRED, REJECTED. QUEUED (V1) → PROCESSING (V2). ON_HOLD (V1) → IN_COMPLIANCE (V2). REINITIATE (V1) → ACTION_REQUIRED (V2).'
          enum:
          - INCOMPLETE
          - QUEUED
          - PROCESSING
          - REVIEWING
          - APPROVED
          - ASSOCIATED_PARTIES_REMAINING
          - ON_HOLD
          - IN_COMPLIANCE
          - REINITIATE
          - ACTION_REQUIRED
          - REJECTED
          example: INCOMPLETE
        business_name:
          type: string
          example: Fin.com
        email:
          type: string
          format: email
          example: m@tech.com
        phone:
          type: string
          example: '+8801529876543'
        country_of_incorporation:
          type: string
          example: BGD
        verification_type:
          type: string
          enum:
          - RELIANCE
          - STANDARD
          example: RELIANCE
        tos_policies_url:
          type: string
        associated_parties:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
                format: email
              type:
                type: string
                enum:
                - INDIVIDUAL
              ownership_percent:
                type: number
                example: 52
              verification:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - INITIATED
                    - REVIEWING
                    - APPROVED
                    - REJECTED
                  updated_at:
                    type: string
                    format: date-time
                  reason:
                    type: object
                    properties:
                      for_customer:
                        type: string
                        nullable: true
                      for_developer:
                        type: string
                        nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEventEnvelope:
      type: object
      required:
      - id
      - event_reference_id
      - type
      - created_at
      - sandbox_mode
      properties:
        id:
          type: string
          format: uuid
          example: 60bef15c-4e30-4eb4-bc4d-aa697a7e0857
        event_reference_id:
          type: string
          format: uuid
          example: c3309534-1517-4d15-b244-be8f943c3823
        type:
          type: string
          enum:
          - customer.created
          - customer.status
          - customer.rfi
          - transaction.status
          - virtual_account.created
          - virtual_account.created.v2
          - virtual_account.status
          - virtual_account.status.v2
          - beneficiary.created
          - beneficiary.status
          - beneficiary.liquidation.deposit
          - batch.transaction.item.status
          example: customer.created
        created_at:
          type: string
          format: date-time
          example: '2025-11-30T07:40:06.853938Z'
        sandbox_mode:
          type: boolean
          example: true
    VirtualAccountV2StatusWebhookData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: ed96d65a-5fb1-49f2-8715-0c6aa32220ca
        rfi:
          type: object
          nullable: true
          example: null
        status:
          type: string
          enum:
          - PROCESSING
          - IN_COMPLIANCE
          - REQUEST_FOR_INFORMATION
          - ACTIVE
          - INACTIVE
          - DECLINED
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          example: '2026-03-17T14:27:49.073891Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-03-17T14:42:55.788231316Z'
        customer_id:
          type: string
          format: uuid
          example: c3088a8d-50de-48cf-a137-8d46815394f8
        destination:
          type: object
          properties:
            address:
              type: string
              example: '0x7f1568190e318da16a9ef5a46cba19d5b97d9b29'
            currency:
              type: string
              example: USDC
            destination_chain:
              type: string
              example: POLYGON
        developer_fee_fixed:
          type: number
          example: 0.22
        deposit_instructions:
          type: object
          nullable: true
          properties:
            currency:
              type: string
              example: USD
            bank_code:
              type: object
              properties:
                code:
                  type: string
                  example: SSBAUS32
                type:
                  type: string
                  example: SWIFT
            bank_name:
              type: string
              example: SSB Bank
            account_type:
              type: string
              example: BankSwift
            bank_address:
              type: string
              nullable: true
              example: null
            bank_country:
              type: string
              example: USA
            payment_rails:
              type: array
              items:
                type: string
              example:
              - ACH
            bank_account_number:
              type: string
              example: '235464829825'
            bank_routing_number:
              type: string
              example: ''
        developer_fee_percent:
          type: number
          example: 0
