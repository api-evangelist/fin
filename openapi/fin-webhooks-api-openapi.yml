components:
  schemas:
    IndividualCustomerData:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          example: c3309534-1517-4d15-b244-be8f943c3823
        type:
          type: string
          enum:
          - INDIVIDUAL
        customer_status:
          type: string
          description: 'V1 statuses: INCOMPLETE, QUEUED, REVIEWING, APPROVED, ON_HOLD, REINITIATE, REJECTED. V2 statuses: INCOMPLETE, PROCESSING, REVIEWING, APPROVED, ACTION_REQUIRED, REJECTED. QUEUED (V1) → PROCESSING (V2). ON_HOLD (V1) → IN_COMPLIANCE (V2). REINITIATE (V1) → ACTION_REQUIRED (V2).'
          enum:
          - INCOMPLETE
          - QUEUED
          - PROCESSING
          - REVIEWING
          - APPROVED
          - ON_HOLD
          - IN_COMPLIANCE
          - REINITIATE
          - ACTION_REQUIRED
          - REJECTED
          example: INCOMPLETE
        email:
          type: string
          format: email
          example: john.doe@email.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        phone:
          type: string
          example: '+12597751234'
        country_of_residence:
          type: string
          example: USA
        verification_type:
          type: string
          enum:
          - RELIANCE
          - STANDARD
          example: STANDARD
        tos_policies_url:
          type: string
          example: 25764ef6-0f4f-4846-b7c6-9df0598358e9
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BeneficiaryWebhookData:
      type: object
      properties:
        beneficiary_id:
          type: string
          format: uuid
          example: e8fccaeb-fb9d-4fae-846e-ea7c97c70b31
        customer_id:
          type: string
          format: uuid
          example: ecbd3a73-3bcb-40ae-be06-0e71f9b27c2f
        type:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
          example: INDIVIDUAL
        active:
          type: boolean
          example: true
        status:
          type: string
          enum:
          - PROCESSING
          - ACTIVE
          - INACTIVE
          - REJECTED
          example: ACTIVE
    VirtualAccountWebhookData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 900f750d-6868-457e-a777-1a35566a6b5f
        customer_id:
          type: string
          format: uuid
          example: a41a6d76-4545-47ab-93d1-696a3221d39c
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
          example: ACTIVE
        deposit_instructions:
          type: object
          properties:
            bank_account_number:
              type: string
              example: '900937198167'
            bank_routing_number:
              type: string
              example: '101019644'
            bank_name:
              type: string
              example: Bank of Nowhere
            bank_address:
              type: string
              example: 1800 North Pole St., Orlando, FL 32801
            bank_beneficiary_name:
              type: string
              example: Fin.com
            bank_beneficiary_address:
              type: string
              example: 250 Innovation Way, Houston, TX 77002, US
            currency:
              type: string
              example: USD
            payment_rails:
              type: array
              items:
                type: string
                enum:
                - ACH
                - FEDWIRE
                - WIRE
              example:
              - ACH
              - FEDWIRE
        destination:
          type: object
          properties:
            address:
              type: string
              example: '0x1d1f9801d6d98e49438cda3a3b8e0c9f5e6f8c44'
            currency:
              type: string
              example: USDC
            destination_chain:
              type: string
              example: POLYGON
        developer_fee_percent:
          type: number
          example: 0.5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BusinessCustomerData:
