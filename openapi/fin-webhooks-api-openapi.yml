components:
  schemas:
    IndividualCustomerData:
      type: object
      description: Individual customer data in webhook payload
      required:
      - customer_id
      - type
      - customer_status
      - email
      - first_name
      - last_name
      - phone
      - country_of_residence
      - verification_type
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: c3309534-1517-4d15-b244-be8f943c3823
        type:
          type: string
          enum:
          - INDIVIDUAL
          description: Customer type
        customer_status:
          type: string
          description: Current status of the customer
          enum:
          - INCOMPLETE
          - REVIEWING
          - APPROVED
          - ON_HOLD
          - REJECTED
          example: INCOMPLETE
        email:
          type: string
          format: email
          description: Customer email address
          example: john.doe@email.com
        first_name:
          type: string
          description: Customer's first name
          example: John
        last_name:
          type: string
          description: Customer's last name
          example: Doe
        phone:
          type: string
          description: Customer's phone number
          example: '+12597751234'
        country_of_residence:
          type: string
          description: Customer's country of residence (ISO 3166-1 alpha-3 code)
          example: USA
        verification_type:
          type: string
          enum:
          - RELIANCE
          - STANDARD
          description: Type of verification process
          example: RELIANCE
        tos_policies_url:
          type: string
          description: URL for terms of service policies
          example: 25764ef6-0f4f-4846-b7c6-9df0598358e9
        created_at:
          type: string
          format: date-time
          description: Timestamp when the customer was created
          example: '2025-11-30T07:40:06Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the customer was last updated
          example: '2025-11-30T07:40:07Z'
    BeneficiaryWebhookData:
      type: object
      description: Beneficiary data in webhook payload
      required:
      - beneficiary_id
      - customer_id
      - type
      - active
      properties:
        beneficiary_id:
          type: string
          format: uuid
          description: Unique identifier for the beneficiary
          example: 4d715f20-f704-45e0-af56-19ade318e852
        customer_id:
