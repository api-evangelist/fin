  # VIRTUAL ACCOUNTS
  "/v1/customers/virtual-account":
    post:
      summary: Create Virtual Account
      description: Create a virtual bank account for a customer to convert USD deposits to USDC on Polygon
      tags:
        - Virtual Accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - destination_currency
                - destination_chain
                - source_rail
                - source_currency
                - destination_wallet_address
                - developer_fee_percentage
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Unique identifier for the customer
                  example: "5a6f47f7-7326-409f-a4da-90e409133fb8"
                destination_currency:
                  type: string
                  enum:
                    - USDC
                  default: USDC
                  description: Destination cryptocurrency
                destination_chain:
                  type: string
                  enum:
                    - POLYGON
                  default: POLYGON
                  description: Blockchain network for destination
                source_rail:
                  type: string
                  description: Payment rail for deposits
                  example: "ACH"
                source_currency:
                  type: string
                  description: Source currency code
                  example: "USD"
                destination_wallet_address:
                  type: string
                  description: Destination wallet address in hexadecimal format (0x...)
                  example: "0x7f1568190e318da16a9ef5a46cba19d5b97d9b29"
                developer_fee_percentage:
                  type: number
                  description: Developer fee percentage
                  example: 1.5
            examples:
              New Example:
                summary: New Example
                value:
                  customer_id: "5a6f47f7-7326-409f-a4da-90e409133fb8"
                  destination_currency: "USDC"
                  destination_chain: "POLYGON"
                  source_rail: "ACH"
                  source_currency: "USD"
                  destination_wallet_address: "0x7f1568190e318da16a9ef5a46cba19d5b97d9b29"
                  developer_fee_percentage: 1.5
      responses:
        '200':
          description: Virtual account created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - developer_fee_percent
                      - customer_id
                      - created_at
                      - updated_at
                      - deposit_instructions
                      - destination
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier for the virtual account
                        example: "eb99dce4-d26d-442a-9873-47336e9936ca"
                      status:
                        type: string
                        description: Status of the virtual account
                        example: "ACTIVE"
                      developer_fee_percent:
                        type: number
                        description: The developer fee percentage set when creating the virtual account
                        example: 1.5
                      customer_id:
                        type: string
                        format: uuid
                        description: Customer identifier
                        example: "5a6f47f7-7326-409f-a4da-90e409133fb8"
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when the account was created in ISO 8601 format
                        example: "2025-12-17T10:57:19.113092Z"
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when the account was last updated in ISO 8601 format
                        example: "2025-12-17T10:57:19.113092Z"
                      deposit_instructions:
                        type: object
                        required:
                          - currency
                          - bank_name
                          - bank_address
                          - bank_routing_number
                          - bank_account_number
                          - bank_beneficiary_name
                          - bank_beneficiary_address
                          - payment_rails
                        properties:
                          currency:
                            type: string
                            example: "USD"
                          bank_name:
                            type: string
                            example: "Bank of Nowhere"
                          bank_address:
                            type: string
                            example: "1800 North Pole St., Orlando, FL 32801"
                          bank_routing_number:
                            type: string
                            example: "101019644"
                          bank_account_number:
                            type: string
                            example: "900801702004"
                          bank_beneficiary_name:
                            type: string
                            example: "Stageusa Testva"
                          bank_beneficiary_address:
                            type: string
                            example: "1200 Pennsylvania Avenue NW, Georgia, GA 20500, US"
                          payment_rails:
                            type: array
                            items:
                              type: string
                            example: ["ACH", "FEDWIRE"]
                      destination:
                        type: object
                        required:
                          - currency
                          - destination_chain
                          - address
                        properties:
                          currency:
                            type: string
                            enum:
                              - USDC
                            default: USDC
                            description: Destination cryptocurrency
                          destination_chain:
                            type: string
                            enum:
                              - POLYGON
                            default: POLYGON
                            description: Blockchain network
                          address:
                            type: string
                            description: The destination wallet address in hexadecimal format (0x...)
                            example: "0x7f1568190e318da16a9ef5a46cba19d5b97d9b29"
              examples:
