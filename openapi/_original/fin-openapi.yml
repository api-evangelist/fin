        current_time:
          type: string
          format: date-time
          description: Current server timestamp
          example: "2025-12-21 10:34:45+00"
    CreateIndividualCustomerInput:
      type: object
      required:
        - verification_type
        - basic_info
        - address
        - financial_profile
      properties:
        verification_type:
          type: string
          enum:
            - STANDARD
            - RELIANCE
          description: Type of verification to perform
          example: STANDARD
        basic_info:
          type: object
          required:
            - first_name
            - last_name
            - dob
            - email
            - phone
            - country_of_residence
            - nationality
            - tin
          properties:
            first_name:
              type: string
              description: Customer's first name
              example: "John"
            last_name:
              type: string
              description: Customer's last name
              example: "Doe"
            dob:
              type: string
              format: date
              description: Date of birth in YYYY-MM-DD format
              example: "1990-01-15"
            email:
              type: string
              format: email
              description: Customer's email address
              example: "john.doe@example.com"
            phone:
              type: string
              description: Phone number according to residence country
              example: "+1234567890"
            country_of_residence:
              $ref: '#/components/schemas/CountryCode'
            nationality:
              $ref: '#/components/schemas/CountryCode'
            tin:
              type: string
              description: Tax Identification Number. Must be SSN format for USA; for all other countries, the relevant document number format is acceptable.
              example: "123-45-6789"
        address:
          type: object
          required:
            - street
            - city
            - state
            - postal_code
            - country
          properties:
            street:
              type: string
              description: Street address
              example: "123 Main St"
            city:
              type: string
              description: City name
              example: "New York"
            state:
              type: string
              description: State or province subdivision code from the catalogue API (/v1/countries/{country_code}/subdivisions)
              example: "US-NY"
            postal_code:
              type: string
              description: Postal or ZIP code
              example: "10001"
            country:
              $ref: '#/components/schemas/CountryCode'
        financial_profile:
          type: object
          required:
            - occupation_id
            - source_of_fund_id
            - purpose_id
            - monthly_volume_usd
          properties:
            occupation_id:
              type: integer
              description: Unique identifier for occupation retrieved from the catalogue API (/v1/occupations)
              example: 1
            source_of_fund_id:
              type: integer
              description: Unique identifier for source of funds retrieved from the catalogue API (/v1/source-of-funds?type=INDIVIDUAL)
              example: 1
            purpose_id:
              type: integer
              description: Unique identifier for account purpose retrieved from the catalogue API (/v1/purposes?type=INDIVIDUAL)
              example: 1
            monthly_volume_usd:
              type: integer
              description: Expected monthly transaction volume in USD (not cents)
              example: 5000
        meta_data:
          type: object
          additionalProperties: true
          description: Additional custom metadata as key-value pairs
          example:
            customer_reference: "REF-12345"
            internal_notes: "VIP customer"
    ProofOfIdentity:
      type: object
      required:
        - type
        - number
        - country
        - issue_date
        - expiry_date
        - files
      properties:
        type:
          type: string
          enum:
            - PASSPORT
            - NATIONAL_ID
            - DRIVERS_LICENSE
          description: Type of identity document
          example: "PASSPORT"
        number:
          type: string
          description: Document number
          example: "A12345678"
        country:
          $ref: '#/components/schemas/CountryCode'
        issue_date:
          type: string
          format: date
          description: Document issue date in YYYY-MM-DD format
          example: "2020-01-15"
        expiry_date:
          type: string
          format: date
          description: Document expiry date in YYYY-MM-DD format
          example: "2030-01-15"
        files:
          type: array
          description: Array of document file URIs with sides
          items:
            type: object
            required:
              - uri
            additionalProperties: false
            properties:
              side:
                type: string
                enum:
                  - FRONT
                  - BACK
                description: Side of the document (optional for passport, required for other document types)
                example: "FRONT"
              uri:
                type: string
                description: The URI received from the upload document endpoint
                example: "/AbAcQ4hn_0652746727637.pdf"
    ProofOfAddress:
      type: object
      required:
        - type
        - country
        - files
      properties:
        type:
          type: string
          enum:
            - PASSPORT
            - NATIONAL_ID
            - DRIVERS_LICENSE
            - RESIDENCE_PERMIT
            - UTILITY_BILL
            - GOVERNMENT_LETTER
            - BANK_STATEMENT
            - COMPANY_DOC
          description: Type of address proof document
          example: "UTILITY_BILL"
        country:
          $ref: '#/components/schemas/CountryCode'
        files:
          type: array
          description: Array of document file URIs (no sides needed)
          items:
            type: object
            required:
              - uri
            additionalProperties: false
            properties:
              uri:
                type: string
                description: The URI received from the upload document endpoint
                example: "/AbAcQ4hn_0652746727638.pdf"
    AttachDocumentForIndividualCustomerInput:
      type: object
      required:
        - customer_id
        - proof_of_identity
        - proof_of_address
        - tos_policies_value
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
        proof_of_identity:
          $ref: '#/components/schemas/ProofOfIdentity'
        proof_of_address:
          $ref: '#/components/schemas/ProofOfAddress'
        tos_policies_value:
          type: string
          description: Terms of Service policies value parsed from the tos_policies_url query parameter returned from the Create Individual Customer endpoint. Providing this signifies that the user was shown the policies and have accepted the terms.
          example: "e9414388-fbdf-4407-b5c2-bc39eae3645b"
    AttachDocumentToAssociatedPartyInput:
      type: object
      required:
        - customer_id
        - associated_party_attachments
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
        associated_party_attachments:
          type: array
          description: Array of document attachments for associated parties
          items:
            type: object
            required:
              - associated_party_id
              - proof_of_identity
              - proof_of_address
            properties:
              associated_party_id:
                type: string
                format: uuid
                description: Unique identifier for the associated party
                example: "a7c3b4e2-d8f1-4a5c-9e7d-2f6b8c3a1e9f"
              proof_of_identity:
                $ref: '#/components/schemas/ProofOfIdentity'
              proof_of_address:
                $ref: '#/components/schemas/ProofOfAddress'
    AttachDocumentsToBusinessCustomerInput:
      type: object
      required:
        - customer_id
        - ownership_structure
        - company_details
        - legal_presence
        - tos_policies_value
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
        ownership_structure:
          type: array
          description: Array of ownership structure documents
          items:
            type: object
            required:
              - type
              - files
            properties:
              type:
                type: string
                enum:
                  - SHAREHOLDER_REGISTRY
                description: Type of ownership structure document
                example: "SHAREHOLDER_REGISTRY"
              files:
                type: array
                description: Array of document file URIs
                items:
                  type: object
                  required:
                    - uri
                  properties:
                    uri:
                      type: string
                      description: The URI received from the upload document endpoint
                      example: "/AbAcQ4hn_0652746727639.pdf"
        company_details:
          type: array
          description: Array of company detail documents
          items:
            type: object
            required:
              - type
              - files
            properties:
              type:
                type: string
                enum:
                  - CERT_OF_INCORPORATION
                  - MEMORANDUM_OF_ASSOCIATION
                description: Type of company detail document
                example: "CERT_OF_INCORPORATION"
              files:
                type: array
                description: Array of document file URIs
                items:
                  type: object
                  required:
                    - uri
                  properties:
                    uri:
                      type: string
                      description: The URI received from the upload document endpoint
                      example: "/AbAcQ4hn_0652746727640.pdf"
        legal_presence:
          type: array
          description: Array of legal presence documents
          items:
            type: object
            required:
              - type
              - files
            properties:
              type:
                type: string
                enum:
                  - PROOF_OF_ADDRESS
                description: Type of legal presence document
                example: "PROOF_OF_ADDRESS"
              files:
                type: array
                description: Array of document file URIs
                items:
                  type: object
                  required:
                    - uri
                  properties:
                    uri:
                      type: string
                      description: The URI received from the upload document endpoint
                      example: "/AbAcQ4hn_0652746727641.pdf"
        tos_policies_value:
          type: string
          description: Terms of Service policies value parsed from the tos_policies_url query parameter returned from the Create Business Customer endpoint. Providing this signifies that the user was shown the policies and have accepted the terms.
          example: "e9414388-fbdf-4407-b5c2-bc39eae3645b"
    
    # Webhook Schemas
    WebhookEvent:
      type: object
      description: Common structure for all webhook events
      required:
        - event
        - data
      properties:
        event:
          type: object
          required:
            - id
            - event_reference_id
            - type
            - created_at
            - sandbox_mode
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for the webhook event
              example: "60bef15c-4e30-4eb4-bc4d-aa697a7e0857"
            event_reference_id:
              type: string
              format: uuid
              description: Reference ID of the entity that triggered the event
              example: "c3309534-1517-4d15-b244-be8f943c3823"
            type:
              type: string
              description: Type of webhook event
              enum:
                - customer.created
                - customer.status
                - transaction.status
                - virtual_account.created
                - virtual_account.status
                - beneficiary.created
                - beneficiary.status
              example: "customer.created"
            created_at:
              type: string
              format: date-time
              description: Timestamp when the event was created
              example: "2025-11-30T07:40:06.853938Z"
            sandbox_mode:
              type: boolean
              description: Indicates if the event was triggered in sandbox mode
              example: true
        data:
          type: object
          description: Event-specific payload data
    
    CustomerCreatedWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a customer is successfully created
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/IndividualCustomerData'
                - $ref: '#/components/schemas/BusinessCustomerData'
    
    IndividualCustomerData:
      type: object
      description: Individual customer data in webhook payload
      required:
        - customer_id
        - type
        - customer_status
        - email
        - first_name
        - last_name
        - phone
        - country_of_residence
        - verification_type
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: "c3309534-1517-4d15-b244-be8f943c3823"
        type:
          type: string
          enum: [INDIVIDUAL]
          description: Customer type
        customer_status:
          type: string
          description: Current status of the customer
          enum:
            - INCOMPLETE
            - REVIEWING
            - APPROVED
            - ON_HOLD
            - REJECTED
          example: "INCOMPLETE"
        email:
          type: string
          format: email
          description: Customer email address
          example: "john.doe@email.com"
        first_name:
          type: string
          description: Customer's first name
          example: "John"
        last_name:
          type: string
          description: Customer's last name
          example: "Doe"
        phone:
          type: string
          description: Customer's phone number
          example: "+12597751234"
        country_of_residence:
          type: string
          description: Customer's country of residence (ISO 3166-1 alpha-3 code)
          example: "USA"
        verification_type:
          type: string
          enum:
            - RELIANCE
            - STANDARD
          description: Type of verification process
          example: "RELIANCE"
        tos_policies_url:
          type: string
          description: URL for terms of service policies
          example: "25764ef6-0f4f-4846-b7c6-9df0598358e9"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the customer was created
          example: "2025-11-30T07:40:06Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the customer was last updated
          example: "2025-11-30T07:40:07Z"
    
    BusinessCustomerData:
      type: object
      description: Business customer data in webhook payload
      required:
        - customer_id
        - type
        - customer_status
        - business_name
        - email
        - phone
        - country_of_incorporation
        - verification_type
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: "b222b827-3ac7-4d20-bfd0-ebedc44435f7"
        type:
          type: string
          enum: [BUSINESS]
          description: Customer type
        customer_status:
          type: string
          description: Current status of the customer
          enum:
            - INCOMPLETE
            - REVIEWING
            - APPROVED
            - ASSOCIATED_PARTIES_REMAINING
            - ON_HOLD
            - REJECTED
          example: "INCOMPLETE"
        business_name:
          type: string
          description: Name of the business
          example: "Acme Corp"
        email:
          type: string
          format: email
          description: Business email address
          example: "contact@acmecorp.com"
        phone:
          type: string
          description: Business phone number
          example: "+12125550123"
        country_of_incorporation:
          type: string
          description: Country where the business is incorporated (ISO 3166-1 alpha-3 code)
          example: "USA"
        verification_type:
          type: string
          enum:
            - RELIANCE
            - STANDARD
          description: Type of verification process
          example: "RELIANCE"
        tos_policies_url:
          type: string
          description: URL for terms of service policies
          example: "7e5bdf95-8dea-44d1-8810-987befbe2594"
        associated_parties:
          type: array
          description: List of associated parties (owners, directors, etc.)
          items:
            $ref: '#/components/schemas/AssociatedPartyWebhook'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the customer was created
          example: "2025-11-30T08:01:03Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the customer was last updated
          example: "2025-11-30T08:01:03.797370576Z"
    
    AssociatedPartyWebhook:
      type: object
      description: Associated party information in webhook payload
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the associated party
          example: "07365877-f98f-4efa-acef-b15932fc3415"
        email:
          type: string
          format: email
          description: Email address of the associated party
          example: "john.doe@email.com"
        type:
          type: string
          enum: [INDIVIDUAL]
          description: Type of associated party
        ownership_percent:
          type: number
          description: Ownership percentage in the business
          example: 52
        verification:
          type: object
          description: Verification status of the associated party
          properties:
            status:
              type: string
              enum:
                - INITIATED
                - REVIEWING
                - APPROVED
                - REJECTED
              description: Verification status
              example: "INITIATED"
            updated_at:
              type: string
              format: date-time
              description: Timestamp when verification was last updated
              example: "2025-11-30T08:01:02.824452053Z"
            reason:
              type: object
              description: Reasons for verification status
              properties:
                for_customer:
                  type: string
                  nullable: true
                  description: Customer-facing reason
                for_developer:
                  type: string
                  nullable: true
                  description: Developer-facing reason
    
    CustomerStatusWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a customer's status changes during verification
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/IndividualCustomerData'
                - $ref: '#/components/schemas/BusinessCustomerData'
    
    TransactionStatusWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a transaction's status changes
          properties:
            data:
              $ref: '#/components/schemas/TransactionWebhookData'
    
    TransactionWebhookData:
      type: object
      description: Transaction data in webhook payload
      required:
        - id
        - status
        - beneficiary_id
        - from_amount
        - from_currency
        - transaction_type
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the transaction
          example: "ca9a04d8-4e68-4557-b9c6-3881e9d6b26d"
        status:
          type: string
          description: Current status of the transaction
          enum:
            - FUNDS_RECEIVED
            - PROCESSING
            - COMPLETED
            - FAILED
            - CANCELLED
          example: "FUNDS_RECEIVED"
        beneficiary_id:
          type: string
          format: uuid
          description: Identifier for the beneficiary
          example: "47fcb2ca-9ed2-4188-a154-c83a04d9d34d"
        from_amount:
          type: number
          description: Amount being sent
          example: 6
        from_currency:
          type: string
          description: Currency of the amount being sent
          example: "USDC"
        payout_amount:
          type: number
          description: Amount to be paid out to beneficiary
          example: 5.55595028
        payout_currency:
          type: string
          description: Currency of the payout
          example: "CAD"
        processing_amount:
          type: number
          description: Amount after fees deducted
          example: 4.2164
        fx_rate:
          type: number
          description: Foreign exchange rate applied
          example: 1.3177
        developer_fee:
          type: number
          description: Total developer fee charged
          example: 1.7836
        developer_fee_fixed:
          type: number
          description: Fixed portion of developer fee
          example: 1.75
        developer_fee_percentage:
          type: number
          description: Percentage portion of developer fee
          example: 0.56
        hash:
          type: string
          description: Blockchain transaction hash
          example: "0x3a282c0d2364632bdf9224eadf06b463190795bce24e46d3235e44d22f953461"
        transaction_ref_id:
          type: string
          description: Reference ID for the transaction
          example: "c494ac07-becd-4840-9"
        transaction_type:
          type: string
          enum:
            - DEBIT
            - CREDIT
          description: Type of transaction
          example: "DEBIT"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the transaction was created
          example: "2025-12-01T09:14:34.623187982Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the transaction was last updated
          example: "2025-12-01T09:14:34.623187982Z"
    
    VirtualAccountCreatedWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a new virtual account is created
          properties:
            data:
              $ref: '#/components/schemas/VirtualAccountWebhookData'
    
    VirtualAccountStatusWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a virtual account's status changes
          properties:
            data:
              $ref: '#/components/schemas/VirtualAccountWebhookData'
    
    VirtualAccountWebhookData:
      type: object
      description: Virtual account data in webhook payload
      required:
        - id
        - customer_id
        - status
        - deposit_instructions
        - destination
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the virtual account
          example: "900f750d-6868-457e-a777-1a35566a6b5f"
        customer_id:
          type: string
          format: uuid
          description: Identifier for the customer who owns the virtual account
          example: "a41a6d76-4545-47ab-93d1-696a3221d39c"
        status:
          type: string
          description: Current status of the virtual account
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
          example: "ACTIVE"
        deposit_instructions:
          type: object
          description: Banking details for depositing funds
          required:
            - bank_account_number
            - bank_routing_number
            - bank_name
            - bank_address
            - bank_beneficiary_name
            - bank_beneficiary_address
            - currency
            - payment_rails
          properties:
            bank_account_number:
              type: string
              description: Bank account number for deposits
              example: "900937198167"
            bank_routing_number:
              type: string
              description: Bank routing number
              example: "101019644"
            bank_name:
              type: string
              description: Name of the bank
              example: "Bank of Nowhere"
            bank_address:
              type: string
              description: Physical address of the bank
              example: "1800 North Pole St., Orlando, FL 32801"
            bank_beneficiary_name:
              type: string
              description: Beneficiary name on the account
              example: "Acme Corp"
            bank_beneficiary_address:
              type: string
              description: Address of the beneficiary
              example: "250 Innovation Way, Houston, TX 77002, US"
            currency:
              type: string
              description: Currency for deposits
              example: "USD"
            payment_rails:
              type: array
              description: Supported payment methods
              items:
                type: string
                enum:
                  - ACH
                  - FEDWIRE
                  - WIRE
              example: ["ACH", "FEDWIRE"]
        destination:
          type: object
          description: Destination blockchain address for converted funds
          required:
            - address
            - currency
            - destination_chain
          properties:
            address:
              type: string
              description: Blockchain wallet address
              example: "0x1d1f9801d6d98e49438cda3a3b8e0c9f5e6f8c44"
            currency:
              type: string
              description: Cryptocurrency to receive
              example: "USDC"
            destination_chain:
              type: string
              description: Blockchain network
              example: "POLYGON"
        developer_fee_percent:
          type: number
          description: Developer fee percentage
          example: 0.5
        created_at:
          type: string
          format: date-time
          description: Timestamp when the virtual account was created
          example: "2025-12-10T08:11:25.216572Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the virtual account was last updated
          example: "2025-12-10T08:11:25.216572Z"
    
    BeneficiaryCreatedWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a new beneficiary is created
          properties:
            data:
              $ref: '#/components/schemas/BeneficiaryWebhookData'
    
    BeneficiaryStatusWebhook:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          description: Webhook triggered when a beneficiary's status changes
          properties:
            data:
              $ref: '#/components/schemas/BeneficiaryWebhookData'
    
    BeneficiaryWebhookData:
      type: object
      description: Beneficiary data in webhook payload
      required:
        - beneficiary_id
        - customer_id
        - type
        - active
      properties:
        beneficiary_id:
          type: string
          format: uuid
          description: Unique identifier for the beneficiary
          example: "4d715f20-f704-45e0-af56-19ade318e852"
        customer_id:
          type: string
          format: uuid
          description: Identifier for the customer who owns the beneficiary
          example: "efb54adf-b7f4-4716-80e3-806e11f20b7b"
        type:
          type: string
          description: Type of beneficiary
          enum:
            - INDIVIDUAL
            - BUSINESS
          example: "INDIVIDUAL"
        active:
          type: boolean
          description: Whether the beneficiary is active
          example: true
  responses:
    AuthenticationError:
      description: Authentication failed due to invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: The error message
                example: "Authentication failed"
    ValidationError:
      description: Failed due to a formatting error.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                description: An error message describing what went wrong.
              errors:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
                    example: Appropriate client_secret required.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication. Obtain token from /v1/oauth/token endpoint

