                  summary: OK
                  value:
                    data:
                      id: "eb99dce4-d26d-442a-9873-47336e9936ca"
                      status: "ACTIVE"
                      developer_fee_percent: 1.5
                      customer_id: "5a6f47f7-7326-409f-a4da-90e409133fb8"
                      created_at: "2025-12-17T10:57:19.113092Z"
