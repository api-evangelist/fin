  transaction.status:
    post:
      summary: Transaction Status
      description: |
        This webhook event is triggered when a transaction's status changes. It provides real-time updates as transactions progress through different stages, including when funds are received, when processing begins, and if a transaction fails.
        
        Common status values include:
        - `FUNDS_RECEIVED` - Initial funds have been received from the sender
        - `PROCESSING` - Transaction is being processed
        - `COMPLETED` - Transaction has completed successfully
        - `FAILED` - Transaction has failed and will not complete
