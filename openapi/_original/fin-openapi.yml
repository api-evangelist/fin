  "/v1/beneficiaries/{beneficiary_id}/":
    get:
      summary: List Transactions for Beneficiary
      description: Retrieve paginated transaction history for a specific beneficiary
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: API version
          example: "v1"
        - name: beneficiary_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier for the beneficiary
        - name: per_page
          in: query
          required: false
          schema:
            type: string
            default: "2"
          description: Number of transactions per page (default 10)
        - name: current_page
          in: query
          required: false
          schema:
            type: string
            default: "1"
