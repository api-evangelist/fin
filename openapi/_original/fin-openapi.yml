openapi: 3.1.0
info:
  title: Fin.com API
  version: 1.0.0
  description: A simple API specification

servers:
  - url: https://sandbox.api.fin.com
    description: Sandbox server
  - url: https://api.fin.com
    description: Production server

tags:
  - name: Authentication
    description: A modified OAuth 2.0 Client Credential Flow

  - name: Customers
    description: Customer management and document upload operations

  - name: Balances
    description: Retrieve wallet balance information

  - name: Catalogue
    description: |
      A set of endpoint to retrieve contextual data to assemble requests
      to fin.com's API

  - name: Beneficiaries
    description: Manage beneficiary accounts for payments and transfers

  - name: Transactions
    description: Transaction history and management for beneficiaries

  - name: Virtual Accounts
    description: Create and manage virtual accounts for USD to USDC conversions

paths:
  # AUTHENTICATION
  "/v1/oauth/token":
    post:
      summary: Issue a Token
      description: Generate an access token using client credentials
      x-mint:
        content: |
          Grab your `client_id` and `client_secret` from the
          [API Keys](https://orchestration.fin.com/api-keys) section
          of the [Orchestration Dashboard](https://orchestration.fin.com/)

          <Note>
            The TTLs returned from this API are actually the time
            that the the token will expire; i.e. not validity in number of seconds
            since creation.
          </Note>

          <Note>
            The timestamps, i.e. TTLs returned from this endpoint are NOT
            in ISO 8601 format. Rather it is in the format 
            `YYYY-MM-DD HH:MM:SS+00`
          </Note>
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - client_secret
              properties:
                client_id:
                  type: string
                  description: Client ID
                client_secret:
                  type: string
                  description: Client Secret
                  format: password
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
  "/v1/oauth/refresh-token":
    post:
      summary: Refresh a Token
      description: Generate a new token pair based from a refresh token.
      x-mint:
        content: |
          Exchanges a `refresh_token` received from the [Issue Token](/api-reference/authentication/issue-a-token) endpoint for a new
          pair of `access_token` and `refresh_token`

          <Note>
            The TTLs returned from this API are actually the time
            that the the token will expire; i.e. not validity in number of seconds
            since creation.
          </Note>

          <Note>
            The timestamps, i.e. TTLs returned from this endpoint are NOT
            in ISO 8601 format. Rather it is in the format 
            `YYYY-MM-DD HH:MM:SS+00`
          </Note>
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: The refresh_token received from the `/v1/oauth/token` endpoint.

      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # CUSTOMERS
  "/v1/customers":
    get:
      summary: List Customers
      description: Retrieve a list of customers filtered by type
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: Filter customers by type
          required: true
          schema:
            type: string
            enum:
              - INDIVIDUAL
              - BUSINESS
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CurrentPageParam'
      responses:
        '200':
          description: List of customers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 1
                          total:
                            type: integer
                            description: Total number of items
                            example: 2
                      customers:
                        type: array
                        items:
                          oneOf:
                            - type: object
                              properties:
                                customer_id:
                                  type: string
                                  format: uuid
                                  description: Unique identifier for the customer
                                  example: "56c41b8e-e650-4f55-94f6-26a888a9b64d"
                                type:
                                  type: string
                                  enum: [INDIVIDUAL]
                                  description: Customer type
                                first_name:
                                  type: string
                                  description: Customer's first name
                                  example: "Omran"
                                last_name:
                                  type: string
                                  description: Customer's last name
                                  example: "Jamal"
                                email:
                                  type: string
                                  format: email
                                  description: Customer's email address
                                  example: "omran@omranjamal.me"
                                phone:
                                  type: string
                                  description: Customer's phone number
                                  example: "+14724480512"
                                country_of_residence:
                                  type: string
                                  description: Country of residence code
                                  example: "USA"
                                customer_status:
                                  type: string
                                  description: Current status of the customer
                                  example: "INCOMPLETE"
                                tos_policies_url:
                                  type: string
                                  format: uri
                                  description: URL for Terms of Service policies
                                  example: "https://orchestration.fin.com/orchestration-customer-tos?customer_id=56c41b8e-e650-4f55-94f6-26a888a9b64d&tos_policies_value=a93d34a1-fc39-48a1-afdb-fd5c4607c5df"
                                created_at:
                                  type: string
                                  format: date-time
                                  description: Timestamp when customer was created
                                  example: "2025-12-22T06:41:18Z"
                                updated_at:
                                  type: string
                                  format: date-time
                                  description: Timestamp when customer was last updated
                                  example: "2025-12-22T06:41:28Z"
                            - type: object
                              properties:
                                customer_id:
                                  type: string
                                  format: uuid
                                  description: Unique identifier for the customer
                                  example: "94e6b847-4e19-49e3-b3ab-ffa95872eda9"
                                type:
                                  type: string
                                  enum: [BUSINESS]
                                  description: Customer type
                                business_name:
                                  type: string
                                  description: Business name
                                  example: "Rocy Pte Ltd Business c2"
                                email:
                                  type: string
                                  format: email
                                  description: Business email address
                                  example: "rocy@jane.com"
                                phone:
                                  type: string
                                  description: Business phone number
                                  example: "+8801912200000"
                                country_of_incorporation:
                                  type: string
                                  description: Country of incorporation code
                                  example: "BGD"
                                customer_status:
                                  type: string
                                  description: Current status of the customer
                                  example: "INCOMPLETE"
                                tos_policies_url:
                                  type: string
                                  format: uri
                                  description: URL for Terms of Service policies
                                  example: "https://orchestration.fin.com/orchestration-customer-tos?customer_id=94e6b847-4e19-49e3-b3ab-ffa95872eda9&tos_policies_value=ecbbfdf0-2138-4877-8a7d-280b2ee02008"
                                created_at:
                                  type: string
                                  format: date-time
                                  description: Timestamp when customer was created
                                  example: "2025-12-24T07:55:42Z"
                                updated_at:
                                  type: string
                                  format: date-time
                                  description: Timestamp when customer was last updated
                                  example: "2025-12-24T07:55:43Z"
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/{customer_id}":
    get:
      summary: Get Customer Details
      description: Retrieve detailed information for a specific customer
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier for the customer
          example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
      responses:
        '200':
          description: Customer details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
                          customer_id:
                            type: string
                            format: uuid
                            description: Unique identifier for the customer
                            example: "56c41b8e-e650-4f55-94f6-26a888a9b64d"
                          type:
                            type: string
                            enum: [INDIVIDUAL]
                            description: Customer type
                          first_name:
                            type: string
                            description: Customer's first name
                            example: "Omran"
                          last_name:
                            type: string
                            description: Customer's last name
                            example: "Jamal"
                          email:
                            type: string
                            format: email
                            description: Customer's email address
                            example: "omran@omranjamal.me"
                          phone:
                            type: string
                            description: Customer's phone number
                            example: "+14724480512"
                          country_of_residence:
                            type: string
                            description: Country of residence code
                            example: "USA"
                          verification_type:
                            type: string
                            description: Type of verification
                            example: "STANDARD"
                          customer_status:
                            type: string
                            description: Current status of the customer
                            example: "INCOMPLETE"
                          tos_policies_url:
                            type: string
                            format: uri
                            description: URL for Terms of Service policies
                            example: "https://orchestration.fin.com/orchestration-customer-tos?customer_id=56c41b8e-e650-4f55-94f6-26a888a9b64d&tos_policies_value=a93d34a1-fc39-48a1-afdb-fd5c4607c5df"
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp when customer was created
                            example: "2025-12-22T06:41:18Z"
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp when customer was last updated
                            example: "2025-12-22T06:41:28Z"
                          capabilities:
                            type: object
                            properties:
                              on_ramp:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    currency:
                                      type: string
                                      description: Currency code
                                      example: "USD"
                                    status:
                                      type: boolean
                                      description: Whether the capability is enabled
                                      example: false
                                    methods:
                                      type: array
                                      items:
                                        type: string
                                      description: Available methods
                                      example: ["ACH", "FEDWIRE"]
                                    reason:
                                      type: object
                                      properties:
                                        for_customer:
                                          type: string
                                          nullable: true
                                          description: Reason message for customer
                                        for_developer:
                                          type: string
                                          nullable: true
                                          description: Reason message for developer
                              off_ramp:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    currency:
                                      type: string
                                      description: Currency code
                                      example: "USD"
                                    status:
                                      type: boolean
                                      description: Whether the capability is enabled
                                      example: false
                                    methods:
                                      type: array
                                      items:
                                        type: string
                                      description: Available methods
                                      example: ["ACH", "FEDWIRE", "ACH_SAME_DAY"]
                                    reason:
                                      type: object
                                      properties:
                                        for_customer:
                                          type: string
                                          nullable: true
                                          description: Reason message for customer
                                        for_developer:
                                          type: string
                                          nullable: true
                                          description: Reason message for developer
                                          example: "Complete verification"
                      - type: object
                        properties:
                          customer_id:
                            type: string
                            format: uuid
                            description: Unique identifier for the customer
                            example: "94e6b847-4e19-49e3-b3ab-ffa95872eda9"
                          type:
                            type: string
                            enum: [BUSINESS]
                            description: Customer type
                          business_name:
                            type: string
                            description: Business name
                            example: "Rocy Pte Ltd Business c2"
                          email:
                            type: string
                            format: email
                            description: Business email address
                            example: "rocy@jane.com"
                          phone:
                            type: string
                            description: Business phone number
                            example: "+8801912200000"
                          country_of_incorporation:
                            type: string
                            description: Country of incorporation code
                            example: "BGD"
                          verification_type:
                            type: string
                            description: Type of verification
                            example: "STANDARD"
                          customer_status:
                            type: string
                            description: Current status of the customer
                            example: "INCOMPLETE"
                          tos_policies_url:
                            type: string
                            format: uri
                            description: URL for Terms of Service policies
                            example: "https://orchestration.fin.com/orchestration-customer-tos?customer_id=94e6b847-4e19-49e3-b3ab-ffa95872eda9&tos_policies_value=ecbbfdf0-2138-4877-8a7d-280b2ee02008"
                          associated_parties:
                            type: array
                            description: Array of associated parties for the business
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                  description: Unique identifier for the associated party
                                  example: "42daffd3-09a0-4d48-8e73-2680a953d0e1"
                                type:
                                  type: string
                                  description: Type of associated party
                                  example: "INDIVIDUAL"
                                ownership_percent:
                                  type: number
                                  description: Ownership percentage
                                  example: 10
                                email:
                                  type: string
                                  format: email
                                  description: Associated party email
                                  example: "john.ubo.c1@jane.com"
                                verification:
                                  type: object
                                  properties:
                                    status:
                                      type: string
                                      description: Verification status
                                      example: "INITIATED"
                                    reason:
                                      type: object
                                      properties:
                                        for_customer:
                                          type: string
                                          nullable: true
                                          description: Reason message for customer
                                        for_developer:
                                          type: string
                                          nullable: true
                                          description: Reason message for developer
                                    updated_at:
                                      type: string
                                      format: date-time
                                      description: Timestamp when verification was last updated
                                      example: "2025-12-24T07:55:52Z"
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp when customer was created
                            example: "2025-12-24T07:55:42Z"
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp when customer was last updated
                            example: "2025-12-24T07:55:43Z"
                          capabilities:
                            type: object
                            properties:
                              on_ramp:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    currency:
                                      type: string
                                      description: Currency code
                                      example: "USD"
                                    status:
                                      type: boolean
                                      description: Whether the capability is enabled
                                      example: false
                                    methods:
                                      type: array
                                      items:
                                        type: string
                                      description: Available methods
                                      example: ["ACH", "FEDWIRE"]
                                    reason:
                                      type: object
                                      properties:
                                        for_customer:
                                          type: string
                                          nullable: true
                                          description: Reason message for customer
                                        for_developer:
                                          type: string
                                          nullable: true
                                          description: Reason message for developer
                              off_ramp:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    currency:
                                      type: string
                                      description: Currency code
                                      example: "USD"
                                    status:
                                      type: boolean
                                      description: Whether the capability is enabled
                                      example: false
                                    methods:
                                      type: array
                                      items:
                                        type: string
                                      description: Available methods
                                      example: ["ACH", "FEDWIRE", "ACH_SAME_DAY"]
                                    reason:
                                      type: object
                                      properties:
                                        for_customer:
                                          type: string
                                          nullable: true
                                          description: Reason message for customer
                                        for_developer:
                                          type: string
                                          nullable: true
                                          description: Reason message for developer
                                          example: "Complete verification"
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Customer not found"
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/individual":
    post:
      summary: Create Individual Customer
      description: Create a new individual customer with verification details
      x-mint:
        content: |
          <Note>
            Only English (Latin) characters are allowed as inputs for all fields.
          </Note>
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndividualCustomerInput'
      responses:
        '200':
          description: Individual customer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        description: Unique identifier for the created customer
                        example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
                      tos_policies_url:
                        type: string
                        format: uri
                        description: URL for customer to accept Terms of Service policies
                        example: "https://orchestration.fin.com/orchestration-customer-tos?customer_id=55bd6b4e-c20a-4cc8-9535-91d5557a67d9&tos_policies_value=e9414388-fbdf-4407-b5c2-bc39eae3645b"
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/upload":
    post:
      summary: Upload Document
      description: Upload customer documents using multipart/form-data. Files can be uploaded with arbitrary field names (e.g., file1, file2, file3, etc.)
      x-mint:
        content: |
          ## Allowed File Types

          - `PDF`
          - `JPG` / `JPEG`
          - `PNG`

          <Note>
            Files should be uploaded as separate form fields with arbitrary names.
            You can use any field name for files (e.g., `file1`, `file2`, `document1`, etc.).
          </Note>
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Unique identifier for the customer
                  example: "659fd1e8-b7db-4276-8c0f-33b354fe68ef"
                file1:
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
                file_foo:
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
                file_bar:
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
                "[what_ever_you_want]":
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            type: string
                            description: File URI (useful for document attachment), keyed by the form field name used in upload
                          example:
                            file1: "/AbAcQ4hn_0652746727637.pdf"
                        description: Array of uploaded file information with field names as keys and server paths as values
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/individual/attach":
    post:
      summary: Attach Documents to Individual Customer
      description: Attach proof of identity and proof of address documents to an existing individual customer
      x-mint:
        content: |
          <Note>
            Before calling this endpoint, upload documents using the `/v1/customers/upload` endpoint
            to obtain the URIs needed for the `files` arrays.
          </Note>
          
          <Note>
            The `tos_policies_value` should be parsed from the `tos_policies_url` query parameter
            returned from the Create Individual Customer endpoint.
          </Note>
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentForIndividualCustomerInput'
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        description: Unique identifier for the customer
                        example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/associated-parties/individual/attach":
    post:
      summary: Attach Document To Associated Party
      description: Attach proof of identity and proof of address documents to associated parties of an existing customer
      x-mint:
        content: |
          <Note>
            Before calling this endpoint, upload documents using the `/v1/customers/upload` endpoint
            to obtain the URIs needed for the `files` arrays.
          </Note>
          
          <Note>
            This endpoint allows attaching documents for multiple associated parties in a single request.
          </Note>
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentToAssociatedPartyInput'
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/business/attach":
    post:
      summary: Attach Documents to Business Customer
      description: Attach ownership structure, company details, and legal presence documents to an existing business customer
      x-mint:
        content: |
          <Note>
            Before calling this endpoint, upload documents using the `/v1/customers/upload` endpoint
            to obtain the URIs needed for the `files` arrays.
          </Note>
          
          <Note>
            The `tos_policies_value` should be parsed from the `tos_policies_url` query parameter
            returned from the Create Business Customer endpoint.
          </Note>
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentsToBusinessCustomerInput'
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  "/v1/customers/enable-preference":
    post:
      summary: Enable USD Features
      description: Enable USD features for an existing customer
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Unique identifier for the customer
                  example: "55bd6b4e-c20a-4cc8-9535-91d5557a67d9"
      responses:
        '200':
          description: USD features enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # BENEFICIARIES
  "/v1/beneficiaries/dynamic-required-fields":
    get:
      summary: List Required Information For Beneficiaries
      description: Retrieve dynamic list of required fields and validation rules for creating a beneficiary based on country, currency, and payment method
      tags:
        - Beneficiaries
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Customer ID of a verified customer
          example: "5a6f47f7-7326-409f-a4da-90e409133fb8"
        - name: beneficiary_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - INDIVIDUAL
              - BUSINESS
          description: Beneficiary type
        - name: country_code
          in: query
          required: true
          schema:
            type: string
          description: ISO Alpha-3 country code of any supported country from the 'Get countries' list
          example: "USA"
        - name: currency_code
          in: query
          required: true
          schema:
            type: string
          description: Currency code of the supported country
          example: "USD"
        - name: method
          in: query
          required: true
          schema:
            type: string
          description: Available method for a particular country (e.g., BANK, E_WALLET)
          example: "BANK"
        - name: method_id
          in: query
          required: true
          schema:
            type: string
          description: Available method ID of a particular country
          example: "1"
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
          description: (Optional) Required if method contains branches
          example: "100"
      responses:
        '200':
          description: Required fields retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        info:
                          type: string
                          description: Human-readable description of the field
                          example: "Customer ID of our system"
                        key:
                          type: string
                          description: Field key name
                          example: "customer_id"
                        validation_rule:
                          type: object
                          description: Validation rules for this field
                          properties:
                            type:
                              type: string
                              description: Data type for the field
                              enum:
                                - UUID
                                - TEXT
                                - NUMBER
                                - DECIMAL
                              example: "UUID"
                            max_length:
                              type: integer
                              description: Maximum length for text fields
                              example: 36
                            min_length:
                              type: integer
                              description: Minimum length for text fields
                              example: 36
                            min:
                              type: number
                              description: Minimum value for number/decimal fields
                              example: 0
                            allowed_values:
                              type: array
                              description: List of allowed values (for enum-like fields)
                              items:
                                type: string
                              example: ["POLYGON"]
              examples:
                OK:
                  summary: OK
                  value:
                    data:
                      - info: "Customer ID of our system"
                        key: "customer_id"
                        validation_rule:
                          max_length: 36
                          min_length: 36
                          type: "UUID"
                      - info: "Refund Wallet Address"
                        key: "refund_wallet_address"
                        validation_rule:
                          max_length: 42
                          min_length: 42
                          type: "TEXT"
                      - info: "Bank branch id"
                        key: "receiver_destination_branch_id"
                        validation_rule:
                          min: 1
                          type: "NUMBER"
                      - info: "Wallet ID"
                        key: "receiver_destination_account_number"
                        validation_rule:
                          max_length: 20
                          min_length: 1
                          type: "TEXT"
                      - info: "Name of the blockchain network (e.g., Ethereum, Polygon)"
                        key: "source_chain_name"
                        validation_rule:
                          allowed_values:
                            - "POLYGON"
                          type: "TEXT"
                      - info: "Payment Mode"
                        key: "receiver_destination_method"
                        validation_rule:
                          allowed_values:
                            - "BANK"
                            - "E_WALLET"
                          max_length: 50
                          type: "TEXT"
                      - info: "Enter Dev Fee (Fixed)"
                        key: "developer_fee_fixed"
                        validation_rule:
                          min: 0
                          type: "DECIMAL"
                      - info: "Can be a bank or e_wallet id"
                        key: "receiver_destination_method_id"
                        validation_rule:
                          min: 1
                          type: "NUMBER"
                      - info: "Id of the crypto token (e.g., USDC, USDT)"
                        key: "source_token_id"
                        validation_rule:
                          allowed_values:
                            - "USDC"
                            - "USDT"
                          type: "TEXT"
                      - info: "Receiver First Name"
                        key: "receiver_first_name"
                        validation_rule:
                          max_length: 100
                          min_length: 1
                          type: "TEXT"
                      - info: "Enter Dev Fee (Percentage)"
                        key: "developer_fee_percentage"
                        validation_rule:
                          min: 0
                          type: "DECIMAL"
                      - info: "Enter Beneficiary Type"
                        key: "beneficiary_type"
                        validation_rule:
                          allowed_values:
                            - "INDIVIDUAL"
                            - "BUSINESS"
                          type: "TEXT"
                      - info: "Receiver Country"
                        key: "receiver_country_code"
                        validation_rule:
                          max_length: 3
                          min_length: 3
                          type: "TEXT"
                      - info: "Purpose Of Remittance"
                        key: "purpose_of_remittance"
                        validation_rule:
                          max_length: 2
                          min_length: 2
                          type: "TEXT"
                      - info: "Receiver Last Name"
                        key: "receiver_last_name"
                        validation_rule:
                          max_length: 100
                          min_length: 1
                          type: "TEXT"
        '401':
          $ref: '#/components/responses/AuthenticationError'

