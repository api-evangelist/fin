  "/v2/beneficiaries":
    post:
      summary: Create Beneficiary
      description: Create a new beneficiary account for payments and transfers
      x-mint:
        content: |
          <Note>
            Beneficiary creation requires the customer to be in the `APPROVED` status.
            Ensure the customer has been approved before attempting to create beneficiaries.
          </Note>
      tags:
        - Beneficiaries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - country
                - currency
                - account_holder
                - bank_account
                - bank_routing
                - bank_address
                - account_holder_address
                - receiver_meta_data
                - developer_fee
                - deposit_instruction
                - refund_instruction
              properties:
                customer_id:
                  type: string
                  description: Unique identifier for the customer
                  example: "cust_123456"
                country:
                  type: string
                  description: 3 letter country code from catalog
                  example: "USA"
                currency:
                  type: string
                  description: 3 letter currency code
                  example: "USD"
                account_holder:
                  oneOf:
                    - type: object
                      required:
                        - type
                        - first_name
                        - last_name
                        - email
                        - phone
                      properties:
                        type:
                          type: string
                          enum: [INDIVIDUAL]
                          description: Account holder type
                        first_name:
                          type: string
                          description: First name of the individual
                          example: "John"
                        last_name:
                          type: string
                          description: Last name of the individual
                          example: "Doe"
                        email:
                          type: string
                          format: email
                          description: Email address
                          example: "john.doe@example.com"
                        phone:
                          type: string
                          description: Phone number
                          example: "+1234567890"
                    - type: object
                      required:
                        - type
                        - business_name
                        - email
                        - phone
                      properties:
                        type:
                          type: string
                          enum: [BUSINESS]
                          description: Account holder type
                        business_name:
                          type: string
                          description: Name of the business
                          example: "Acme Corp"
                        email:
                          type: string
                          format: email
                          description: Email address
                          example: "contact@acmecorp.com"
                        phone:
                          type: string
                          description: Phone number
                          example: "+1234567890"
                  discriminator:
                    propertyName: type
                    mapping:
                      INDIVIDUAL: '#/components/schemas/IndividualAccountHolder'
                      BUSINESS: '#/components/schemas/BusinessAccountHolder'
                bank_account:
                  type: object
                  required:
                    - bank_name
                    - number
                    - scheme
                    - type
                  properties:
                    bank_name:
                      type: string
                      description: Name of the bank
                      example: "Chase Bank"
                    number:
                      type: string
                      description: Bank account number
                      example: "1234567890"
                    scheme:
                      type: string
                      enum: [LOCAL, SWIFT]
                      description: Banking scheme
                    type:
                      type: string
                      enum: [CHECKING, SAVINGS, CURRENT]
                      description: Account type
                bank_routing:
                  type: array
                  description: Array of bank routing information
                  items:
                    type: object
                    required:
                      - scheme
                      - number
                    properties:
                      scheme:
                        type: string
                        enum: [ACH, BANK_CODE, BANK_IDENTIFIER, BRANCH_CODE, BRANCH_IDENTIFIER, BSB, IBAN, IFSC, SWIFT, TRANSIT_NUMBER, WIRE]
                        description: Routing scheme type
                      number:
                        type: string
                        description: Routing number
                        example: "021000021"
                bank_address:
                  type: object
                  required:
                    - street_line_1
                    - city
                    - state
                    - postcode
                    - country
                  properties:
                    street_line_1:
                      type: string
                      description: Street address line 1
                      example: "123 Bank Street"
                    street_line_2:
                      type: string
                      description: Street address line 2 (optional)
                      example: "Suite 100"
                    city:
                      type: string
                      description: City name
                      example: "New York"
                    state:
                      type: string
                      description: State code from catalog; must belong to the country
                      example: "US-NY"
                    postcode:
                      type: string
                      description: Postal code; must belong to the country and match the format of the country
                      example: "10001"
                    country:
                      type: string
                      description: 3 letter country code from catalog
                      example: "USA"
                account_holder_address:
                  type: object
                  required:
                    - street_line_1
                    - city
                    - state
                    - postcode
                    - country
                  properties:
                    street_line_1:
                      type: string
                      description: Street address line 1
                      example: "456 Main Street"
                    street_line_2:
                      type: string
                      description: Street address line 2 (optional)
                      example: "Apt 5B"
                    city:
                      type: string
                      description: City name
                      example: "Brooklyn"
                    state:
                      type: string
                      description: State code from catalog; must belong to the country
                      example: "US-NY"
                    postcode:
                      type: string
                      description: Postal code; must belong to the country and match the format of the country
                      example: "11201"
                    country:
                      type: string
                      description: 3 letter country code from catalog
                      example: "USA"
                receiver_meta_data:
                  type: object
                  required:
                    - transaction_purpose_id
                    - occupation_remarks
                    - relationship
                    - nationality
                    - govt_id_issuance_date
                    - govt_id_number
                    - govt_id_expiry_date
                  properties:
                    transaction_purpose_id:
                      type: integer
                      description: Transaction purpose ID from catalog
                      example: 1
                    transaction_purpose_remarks:
                      type: string
                      description: Additional remarks for transaction purpose (optional)
                      example: "Monthly salary payment"
                    occupation_id:
                      type: integer
                      description: Occupation ID from catalog. Only required for individual beneficiaries, not for businesses.
                      example: 5
                    occupation_remarks:
                      type: string
                      description: Additional remarks for occupation
                      example: "Software Engineer"
                    relationship:
                      type: string
                      enum: [EMPLOYEE, FREELANCER, GIG_WORKER, AFFILIATE, CUSTOMER, FAMILY_MEMBER, FRIEND, SELF, OTHER, SUPPLIER, VENDOR, SERVICE_PROVIDER, MERCHANT, CONTRACTOR, SUBSIDIARY, PARENT_COMPANY, AFFILIATE_BUSINESS, BANK_ACCOUNT, BROKER, EXCHANGE, WALLET]
                      description: Relationship to the beneficiary
                    relationship_remarks:
                      type: string
                      description: Additional remarks for relationship (optional)
                      example: "Long-term contractor"
                    nationality:
                      type: string
                      description: Country code from catalog representing nationality
                      example: "USA"
                    govt_id_issuance_date:
                      type: string
                      format: date
                      description: Government ID issuance date in YYYY-MM-DD format
                      example: "2020-01-15"
                    govt_id_number:
                      type: string
                      description: Government ID number (required for some currencies)
                      example: "123456789"
                    govt_id_expiry_date:
                      type: string
                      format: date
                      description: Government ID expiry date in YYYY-MM-DD format
                      example: "2030-01-15"
                developer_fee:
                  type: object
                  required:
                    - fixed
                    - percentage
                  properties:
                    fixed:
                      type: number
                      description: Fixed fee amount
                      example: 5.00
                    percentage:
                      type: string
                      description: Percentage fee
                      example: "2.5"
                deposit_instruction:
                  type: object
                  required:
                    - currency
                    - rail
                  properties:
                    currency:
                      type: string
                      enum: [USDC, USDT]
                      description: Cryptocurrency for deposits
                    rail:
                      type: string
                      enum: [POLYGON, ETHEREUM]
                      description: Blockchain network
                refund_instruction:
                  type: object
                  required:
                    - wallet_address
                    - currency
                    - rail
                  properties:
                    wallet_address:
                      type: string
                      description: Wallet address for refunds
                      example: "0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb"
                    currency:
                      type: string
                      enum: [USDC]
                      description: Currency for refunds
                    rail:
                      type: string
                      enum: [POLYGON]
                      description: Blockchain network for refunds
                settlement_config:
                  type: object
                  required:
                    - auto_settlement
                  properties:
                    auto_settlement:
                      type: boolean
                      description: Enable automatic settlement
                      example: true
      responses:
        '200':
          description: Beneficiary created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the beneficiary
                        example: "ben_123456"
                      status:
                        type: string
                        description: Status of the beneficiary
                        example: "active"
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

