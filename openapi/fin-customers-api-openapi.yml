          - DRIVERS_LICENSE
          - RESIDENCE_PERMIT
          - PERMANENT_RESIDENCY_ID
          description: 'Type of government-issued identity document. At least one identifying

            document is required. Double-sided documents must include both front

            and back images.


            **USA residents**: all ID types are supported:

            - `PASSPORT`: Passport

            - `NATIONAL_ID`: National ID card

            - `DRIVERS_LICENSE`: Driver''s license

            - `PERMANENT_RESIDENCY_ID`: Permanent Residency / Green Card


            **Non-USA residents**: only the following are accepted:

            - `PASSPORT`: Passport

            - `NATIONAL_ID`: National ID card

            - `DRIVERS_LICENSE`: Driver''s license


            `PERMANENT_RESIDENCY_ID` is **not supported** for non-USA residents

            and will be rejected.

            '
          example: PASSPORT
        number:
          type: string
          description: Document number.
          example: A12345678
        country:
          $ref: '#/components/schemas/CountryCode'
        issue_date:
          type: string
          format: date
          description: Document issue date in YYYY-MM-DD format.
          example: '2020-01-15'
        expiry_date:
          type: string
          format: date
          description: Document expiry date in YYYY-MM-DD format. Must not be expired.
          example: '2030-01-15'
        files:
          type: array
          description: One or more file URIs from [Upload Document](https://developer.fin.com/api-reference/customers/upload-document) endpoint. For NATIONAL_ID and DRIVERS_LICENSE, provide both FRONT and BACK.
          minItems: 1
          items:
            type: object
            required:
            - uri
            properties:
              side:
                type: string
                enum:
                - FRONT
                - BACK
                description: Required for NATIONAL_ID and DRIVERS_LICENSE. Optional for PASSPORT and RESIDENCE_PERMIT.
                example: FRONT
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727637.pdf
    ProofOfAddressBusiness:
      type: object
      required:
      - type
      - country
      - files
      properties:
        type:
          type: string
          enum:
          - PASSPORT
          - NATIONAL_ID
          - DRIVERS_LICENSE
          - RESIDENCE_PERMIT
          - UTILITY_BILL
          - GOVERNMENT_LETTER
          - BANK_STATEMENT
          - COMPANY_DOC
          example: UTILITY_BILL
        country:
          $ref: '#/components/schemas/CountryCode'
        files:
          type: array
          items:
            type: object
            required:
            - uri
            properties:
              uri:
                type: string
                example: /AbAcQ4hn_0652746727638.pdf
    V2APBasicInfo:
      type: object
      required:
      - first_name
      - first_name_en
      - last_name
      - last_name_en
      - dob
      - email
      - phone
      - country_of_residence
      - primary_nationality
      - tax_info
      properties:
        first_name:
          type: string
          maxLength: 50
          description: First name.
          example: John
        first_name_en:
          type: string
          description: English transliteration of first name. Required if name contains non-ASCII characters.
          example: John
        middle_name:
          type: string
          description: Middle name(s). Optional.
          example: Michael
        middle_name_en:
          type: string
          description: English transliteration of middle name. Optional.
          example: Michael
        last_name:
          type: string
          maxLength: 50
          description: Last or family name.
          example: Doe
        last_name_en:
          type: string
          description: English transliteration of last name. Required if name contains non-ASCII characters.
          example: Doe
        dob:
          type: string
          format: date
          description: Date of birth in YYYY-MM-DD format. Party must be at least 18 years old.
          example: '1985-03-20'
        email:
          type: string
          format: email
          description: Personal email address. Must be unique across all associated parties in the same request.
          example: john.doe@acmecorp.com
        phone:
          type: string
          description: Personal phone number in E.164 format.
          example: '+14155551234'
        country_of_residence:
          $ref: '#/components/schemas/CountryCode'
        primary_nationality:
          $ref: '#/components/schemas/CountryCode'
        secondary_nationality:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
          description: Secondary nationality for dual citizens. Optional.
        tax_info:
          type: array
          description: Tax and identifying documents for this individual.  See all available individual tax ID document types at [Individual Tax ID documents](https://developer.fin.com/guides/compliance-and-regulatory/individual-tax-id-documents).
          items:
            $ref: '#/components/schemas/V2IndividualIdentifyingDocument'
  responses:
    AuthenticationError:
      description: Authentication failed due to invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Authentication failed
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource not found
    ValidationError:
      description: Failed due to a formatting error.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
              errors:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
  parameters:
    PerPageParam:
      name: per_page
      in: query
      description: Number of items to return per page
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 512
    CurrentPageParam:
      name: current_page
      in: query
      description: The page number to retrieve
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication. Obtain token from [Issue a Token](https://developer.fin.com/api-reference/authentication/issue-a-token) endpoint
