                - CERT_OF_INCORPORATION
                - MEMORANDUM_OF_ASSOCIATION
                example: CERT_OF_INCORPORATION
              files:
                type: array
                items:
                  type: object
                  required:
                  - uri
                  properties:
                    uri:
                      type: string
                      example: /AbAcQ4hn_0652746727640.pdf
        legal_presence:
          type: array
          items:
            type: object
            required:
            - type
            - files
            properties:
              type:
                type: string
                enum:
                - PROOF_OF_ADDRESS
                example: PROOF_OF_ADDRESS
              files:
                type: array
                items:
                  type: object
                  required:
                  - uri
                  properties:
                    uri:
                      type: string
                      example: /AbAcQ4hn_0652746727641.pdf
        tos_policies_value:
          type: string
