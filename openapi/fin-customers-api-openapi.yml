openapi: 3.2.0
info:
  title: Fin.com Customers API
  version: 1.0.0
  description: A simple API specification
servers:
- url: https://sandbox.api.fin.com
  description: Sandbox server
- url: https://api.fin.com
  description: Production server
tags:
- name: Customers
  description: Customer management and document upload operations
paths:
  /v1/customers:
    get:
      summary: List Customers
      description: Retrieve a list of customers filtered by type
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: type
        in: query
        description: Filter customers by type
        required: true
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      responses:
        '200':
          description: List of customers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 1
                          total:
                            type: integer
                            description: Total number of items
                            example: 2
                      customers:
                        type: array
                        items:
                          oneOf:
                          - type: object
                            properties:
                              customer_id:
                                type: string
                                format: uuid
                                description: Unique identifier for the customer
                                example: 56c41b8e-e650-4f55-94f6-26a888a9b64d
                              type:
                                type: string
                                enum:
                                - INDIVIDUAL
                                description: Customer type
                              first_name:
                                type: string
                                description: Customer's first name
                                example: Omran
                              last_name:
                                type: string
                                description: Customer's last name
                                example: Jamal
                              email:
                                type: string
                                format: email
                                description: Customer's email address
                                example: omran@omranjamal.me
                              phone:
                                type: string
                                description: Customer's phone number
                                example: '+14724480512'
                              country_of_residence:
                                type: string
                                description: Country of residence code
                                example: USA
                              customer_status:
                                type: string
                                description: Current status of the customer
                                example: INCOMPLETE
                              tos_policies_url:
                                type: string
                                format: uri
                                description: URL for Terms of Service policies
                                example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=56c41b8e-e650-4f55-94f6-26a888a9b64d&tos_policies_value=a93d34a1-fc39-48a1-afdb-fd5c4607c5df
                              created_at:
                                type: string
                                format: date-time
                                description: Timestamp when customer was created
                                example: '2025-12-22T06:41:18Z'
                              updated_at:
                                type: string
                                format: date-time
                                description: Timestamp when customer was last updated
                                example: '2025-12-22T06:41:28Z'
                          - type: object
                            properties:
                              customer_id:
                                type: string
                                format: uuid
                                description: Unique identifier for the customer
                                example: 94e6b847-4e19-49e3-b3ab-ffa95872eda9
                              type:
                                type: string
                                enum:
                                - BUSINESS
                                description: Customer type
                              business_name:
                                type: string
                                description: Business name
                                example: Rocy Pte Ltd Business c2
                              email:
                                type: string
                                format: email
                                description: Business email address
                                example: rocy@jane.com
                              phone:
                                type: string
                                description: Business phone number
                                example: '+8801912200000'
                              country_of_incorporation:
                                type: string
                                description: Country of incorporation code
                                example: BGD
                              customer_status:
                                type: string
                                description: Current status of the customer
                                example: INCOMPLETE
                              tos_policies_url:
                                type: string
                                format: uri
                                description: URL for Terms of Service policies
                                example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=94e6b847-4e19-49e3-b3ab-ffa95872eda9&tos_policies_value=ecbbfdf0-2138-4877-8a7d-280b2ee02008
                              created_at:
                                type: string
                                format: date-time
                                description: Timestamp when customer was created
                                example: '2025-12-24T07:55:42Z'
                              updated_at:
                                type: string
                                format: date-time
                                description: Timestamp when customer was last updated
                                example: '2025-12-24T07:55:43Z'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: getV1Customers
      x-operation-id-source: derived
  /v1/customers/{customer_id}:
    get:
      summary: Get Customer Details
      description: Retrieve detailed information for a specific customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the customer
        example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
      responses:
        '200':
          description: Customer details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                    - type: object
                      properties:
                        customer_id:
                          type: string
                          format: uuid
                          description: Unique identifier for the customer
                          example: 56c41b8e-e650-4f55-94f6-26a888a9b64d
                        type:
                          type: string
                          enum:
                          - INDIVIDUAL
                          description: Customer type
                        first_name:
                          type: string
                          description: Customer's first name
                          example: Omran
                        last_name:
                          type: string
                          description: Customer's last name
                          example: Jamal
                        email:
                          type: string
                          format: email
                          description: Customer's email address
                          example: omran@omranjamal.me
                        phone:
                          type: string
                          description: Customer's phone number
                          example: '+14724480512'
                        country_of_residence:
                          type: string
                          description: Country of residence code
                          example: USA
                        verification_type:
                          type: string
                          description: Type of verification
                          example: STANDARD
                        customer_status:
                          type: string
                          description: Current status of the customer
                          example: INCOMPLETE
                        tos_policies_url:
                          type: string
                          format: uri
                          description: URL for Terms of Service policies
                          example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=56c41b8e-e650-4f55-94f6-26a888a9b64d&tos_policies_value=a93d34a1-fc39-48a1-afdb-fd5c4607c5df
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when customer was created
                          example: '2025-12-22T06:41:18Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when customer was last updated
                          example: '2025-12-22T06:41:28Z'
                        capabilities:
                          type: object
                          properties:
                            on_ramp:
                              type: array
                              items:
                                type: object
                                properties:
                                  currency:
                                    type: string
                                    description: Currency code
                                    example: USD
                                  status:
                                    type: boolean
                                    description: Whether the capability is enabled
                                    example: false
                                  methods:
                                    type: array
                                    items:
                                      type: string
                                    description: Available methods
                                    example:
                                    - ACH
                                    - FEDWIRE
                                  reason:
                                    type: object
                                    properties:
                                      for_customer:
                                        type: string
                                        nullable: true
                                        description: Reason message for customer
                                      for_developer:
                                        type: string
                                        nullable: true
                                        description: Reason message for developer
                            off_ramp:
                              type: array
                              items:
                                type: object
                                properties:
                                  currency:
                                    type: string
                                    description: Currency code
                                    example: USD
                                  status:
                                    type: boolean
                                    description: Whether the capability is enabled
                                    example: false
                                  methods:
                                    type: array
                                    items:
                                      type: string
                                    description: Available methods
                                    example:
                                    - ACH
                                    - FEDWIRE
                                    - ACH_SAME_DAY
                                  reason:
                                    type: object
                                    properties:
                                      for_customer:
                                        type: string
                                        nullable: true
                                        description: Reason message for customer
                                      for_developer:
                                        type: string
                                        nullable: true
                                        description: Reason message for developer
                                        example: Complete verification
                    - type: object
                      properties:
                        customer_id:
                          type: string
                          format: uuid
                          description: Unique identifier for the customer
                          example: 94e6b847-4e19-49e3-b3ab-ffa95872eda9
                        type:
                          type: string
                          enum:
                          - BUSINESS
                          description: Customer type
                        business_name:
                          type: string
                          description: Business name
                          example: Rocy Pte Ltd Business c2
                        email:
                          type: string
                          format: email
                          description: Business email address
                          example: rocy@jane.com
                        phone:
                          type: string
                          description: Business phone number
                          example: '+8801912200000'
                        country_of_incorporation:
                          type: string
                          description: Country of incorporation code
                          example: BGD
                        verification_type:
                          type: string
                          description: Type of verification
                          example: STANDARD
                        customer_status:
                          type: string
                          description: Current status of the customer
                          example: INCOMPLETE
                        tos_policies_url:
                          type: string
                          format: uri
                          description: URL for Terms of Service policies
                          example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=94e6b847-4e19-49e3-b3ab-ffa95872eda9&tos_policies_value=ecbbfdf0-2138-4877-8a7d-280b2ee02008
                        associated_parties:
                          type: array
                          description: Array of associated parties for the business
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Unique identifier for the associated party
                                example: 42daffd3-09a0-4d48-8e73-2680a953d0e1
                              type:
                                type: string
                                description: Type of associated party
                                example: INDIVIDUAL
                              ownership_percent:
                                type: number
                                description: Ownership percentage
                                example: 10
                              email:
                                type: string
                                format: email
                                description: Associated party email
                                example: john.ubo.c1@jane.com
                              verification:
                                type: object
                                properties:
                                  status:
                                    type: string
                                    description: Verification status
                                    example: INITIATED
                                  reason:
                                    type: object
                                    properties:
                                      for_customer:
                                        type: string
                                        nullable: true
                                        description: Reason message for customer
                                      for_developer:
                                        type: string
                                        nullable: true
                                        description: Reason message for developer
                                  updated_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp when verification was last updated
                                    example: '2025-12-24T07:55:52Z'
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when customer was created
                          example: '2025-12-24T07:55:42Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when customer was last updated
                          example: '2025-12-24T07:55:43Z'
                        capabilities:
                          type: object
                          properties:
                            on_ramp:
                              type: array
                              items:
                                type: object
                                properties:
                                  currency:
                                    type: string
                                    description: Currency code
                                    example: USD
                                  status:
                                    type: boolean
                                    description: Whether the capability is enabled
                                    example: false
                                  methods:
                                    type: array
                                    items:
                                      type: string
                                    description: Available methods
                                    example:
                                    - ACH
                                    - FEDWIRE
                                  reason:
                                    type: object
                                    properties:
                                      for_customer:
                                        type: string
                                        nullable: true
                                        description: Reason message for customer
                                      for_developer:
                                        type: string
                                        nullable: true
                                        description: Reason message for developer
                            off_ramp:
                              type: array
                              items:
                                type: object
                                properties:
                                  currency:
                                    type: string
                                    description: Currency code
                                    example: USD
                                  status:
                                    type: boolean
                                    description: Whether the capability is enabled
                                    example: false
                                  methods:
                                    type: array
                                    items:
                                      type: string
                                    description: Available methods
                                    example:
                                    - ACH
                                    - FEDWIRE
                                    - ACH_SAME_DAY
                                  reason:
                                    type: object
                                    properties:
                                      for_customer:
                                        type: string
                                        nullable: true
                                        description: Reason message for customer
                                      for_developer:
                                        type: string
                                        nullable: true
                                        description: Reason message for developer
                                        example: Complete verification
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Customer not found
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: getV1CustomersByCustomerId
      x-operation-id-source: derived
  /v1/customers/individual:
    post:
      summary: Create Individual Customer
      description: Create a new individual customer with verification details
      x-mint:
        content: "<Note>\n  Only English (Latin) characters are allowed as inputs for all fields.\n</Note>\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndividualCustomerInput'
      responses:
        '200':
          description: Individual customer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        description: Unique identifier for the created customer
                        example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
                      tos_policies_url:
                        type: string
                        format: uri
                        description: URL for customer to accept Terms of Service policies
                        example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=55bd6b4e-c20a-4cc8-9535-91d5557a67d9&tos_policies_value=e9414388-fbdf-4407-b5c2-bc39eae3645b
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postV1CustomersIndividual
      x-operation-id-source: derived
  /v1/customers/upload:
    post:
      summary: Upload Document
      description: Upload customer documents using multipart/form-data. Files can be uploaded with arbitrary field names (e.g., file1, file2, file3, etc.)
      x-mint:
        content: "## Allowed File Types\n\n- `PDF`\n- `JPG` / `JPEG`\n- `PNG`\n\n<Note>\n  Files should be uploaded as separate form fields with arbitrary names.\n  You can use any field name for files (e.g., `file1`, `file2`, `document1`, etc.).\n</Note>\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Unique identifier for the customer
                  example: 659fd1e8-b7db-4276-8c0f-33b354fe68ef
                file1:
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
                file_foo:
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
                file_bar:
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
                '[what_ever_you_want]':
                  type: string
                  format: binary
                  description: Document files to upload (can use any field name)
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            type: string
                            description: File URI (useful for document attachment), keyed by the form field name used in upload
                          example:
                            file1: /AbAcQ4hn_0652746727637.pdf
                        description: Array of uploaded file information with field names as keys and server paths as values
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postV1CustomersUpload
      x-operation-id-source: derived
  /v1/customers/individual/attach:
    post:
      summary: Attach Documents to Individual Customer
      description: Attach proof of identity and proof of address documents to an existing individual customer
      x-mint:
        content: "<Note>\n  Before calling this endpoint, upload documents using the `/v1/customers/upload` endpoint\n  to obtain the URIs needed for the `files` arrays.\n</Note>\n\n<Note>\n  The `tos_policies_value` should be parsed from the `tos_policies_url` query parameter\n  returned from the Create Individual Customer endpoint.\n</Note>\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentForIndividualCustomerInput'
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        description: Unique identifier for the customer
                        example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postV1CustomersIndividualAttach
      x-operation-id-source: derived
  /v1/customers/associated-parties/individual/attach:
    post:
      summary: Attach Document To Associated Party
      description: Attach proof of identity and proof of address documents to associated parties of an existing customer
      x-mint:
        content: "<Note>\n  Before calling this endpoint, upload documents using the `/v1/customers/upload` endpoint\n  to obtain the URIs needed for the `files` arrays.\n</Note>\n\n<Note>\n  This endpoint allows attaching documents for multiple associated parties in a single request.\n</Note>\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentToAssociatedPartyInput'
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postV1CustomersAssociatedPartiesIndividualAttach
      x-operation-id-source: derived
  /v1/customers/business/attach:
    post:
      summary: Attach Documents to Business Customer
      description: Attach ownership structure, company details, and legal presence documents to an existing business customer
      x-mint:
        content: "<Note>\n  Before calling this endpoint, upload documents using the `/v1/customers/upload` endpoint\n  to obtain the URIs needed for the `files` arrays.\n</Note>\n\n<Note>\n  The `tos_policies_value` should be parsed from the `tos_policies_url` query parameter\n  returned from the Create Business Customer endpoint.\n</Note>\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentsToBusinessCustomerInput'
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postV1CustomersBusinessAttach
      x-operation-id-source: derived
  /v1/customers/enable-preference:
    post:
      summary: Enable USD Features
      description: Enable USD features for an existing customer
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Unique identifier for the customer
                  example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
      responses:
        '200':
          description: USD features enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postV1CustomersEnablePreference
      x-operation-id-source: derived
components:
  parameters:
    PerPageParam:
      name: per_page
      in: query
      description: Number of items to return per page
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 512
    CurrentPageParam:
      name: current_page
      in: query
      description: The page number to retrieve
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
  schemas:
    AttachDocumentsToBusinessCustomerInput:
      type: object
      required:
      - customer_id
      - ownership_structure
      - company_details
      - legal_presence
      - tos_policies_value
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
        ownership_structure:
          type: array
          description: Array of ownership structure documents
          items:
            type: object
            required:
            - type
            - files
            properties:
              type:
                type: string
                enum:
                - SHAREHOLDER_REGISTRY
                description: Type of ownership structure document
                example: SHAREHOLDER_REGISTRY
              files:
                type: array
                description: Array of document file URIs
                items:
                  type: object
                  required:
                  - uri
                  properties:
                    uri:
                      type: string
                      description: The URI received from the upload document endpoint
                      example: /AbAcQ4hn_0652746727639.pdf
        company_details:
          type: array
          description: Array of company detail documents
          items:
            type: object
            required:
            - type
            - files
            properties:
              type:
                type: string
                enum:
                - CERT_OF_INCORPORATION
                - MEMORANDUM_OF_ASSOCIATION
                description: Type of company detail document
                example: CERT_OF_INCORPORATION
              files:
                type: array
                description: Array of document file URIs
                items:
                  type: object
                  required:
                  - uri
                  properties:
                    uri:
                      type: string
                      description: The URI received from the upload document endpoint
                      example: /AbAcQ4hn_0652746727640.pdf
        legal_presence:
          type: array
          description: Array of legal presence documents
          items:
            type: object
            required:
            - type
            - files
            properties:
              type:
                type: string
                enum:
                - PROOF_OF_ADDRESS
                description: Type of legal presence document
                example: PROOF_OF_ADDRESS
              files:
                type: array
                description: Array of document file URIs
                items:
                  type: object
                  required:
                  - uri
                  properties:
                    uri:
                      type: string
                      description: The URI received from the upload document endpoint
                      example: /AbAcQ4hn_0652746727641.pdf
        tos_policies_value:
          type: string
          description: Terms of Service policies value parsed from the tos_policies_url query parameter returned from the Create Business Customer endpoint. Providing this signifies that the user was shown the policies and have accepted the terms.
          example: e9414388-fbdf-4407-b5c2-bc39eae3645b
    AttachDocumentToAssociatedPartyInput:
      type: object
      required:
      - customer_id
      - associated_party_attachments
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
        associated_party_attachments:
          type: array
          description: Array of document attachments for associated parties
          items:
            type: object
            required:
            - associated_party_id
            - proof_of_identity
            - proof_of_address
            properties:
              associated_party_id:
                type: string
                format: uuid
                description: Unique identifier for the associated party
                example: a7c3b4e2-d8f1-4a5c-9e7d-2f6b8c3a1e9f
              proof_of_identity:
                $ref: '#/components/schemas/ProofOfIdentity'
              proof_of_address:
                $ref: '#/components/schemas/ProofOfAddress'
    CreateIndividualCustomerInput:
      type: object
      required:
      - verification_type
      - basic_info
      - address
      - financial_profile
      properties:
        verification_type:
          type: string
          enum:
          - STANDARD
          - RELIANCE
          description: Type of verification to perform
          example: STANDARD
        basic_info:
          type: object
          required:
          - first_name
          - last_name
          - dob
          - email
          - phone
          - country_of_residence
          - nationality
          - tin
          properties:
            first_name:
              type: string
              description: Customer's first name
              example: John
            last_name:
              type: string
              description: Customer's last name
              example: Doe
            dob:
              type: string
              format: date
              description: Date of birth in YYYY-MM-DD format
              example: '1990-01-15'
            email:
              type: string
              format: email
              description: Customer's email address
              example: john.doe@example.com
            phone:
              type: string
              description: Phone number according to residence country
              example: '+1234567890'
            country_of_residence:
              $ref: '#/components/schemas/CountryCode'
            nationality:
              $ref: '#/components/schemas/CountryCode'
            tin:
              type: string
              description: Tax Identification Number. Must be SSN format for USA; for all other countries, the relevant document number format is acceptable.
              example: 123-45-6789
        address:
          type: object
          required:
          - street
          - city
          - state
          - postal_code
          - country
          properties:
            street:
              type: string
              description: Street address
              example: 123 Main St
            city:
              type: string
              description: City name
              example: New York
            state:
              type: string
              description: State or province subdivision code from the catalogue API (/v1/countries/{country_code}/subdivisions)
              example: US-NY
            postal_code:
              type: string
              description: Postal or ZIP code
              example: '10001'
            country:
              $ref: '#/components/schemas/CountryCode'
        financial_profile:
          type: object
          required:
          - occupation_id
          - source_of_fund_id
          - purpose_id
          - monthly_volume_usd
          properties:
            occupation_id:
              type: integer
              description: Unique identifier for occupation retrieved from the catalogue API (/v1/occupations)
              example: 1
            source_of_fund_id:
              type: integer
              description: Unique identifier for source of funds retrieved from the catalogue API (/v1/source-of-funds?type=INDIVIDUAL)
              example: 1
            purpose_id:
              type: integer
              description: Unique identifier for account purpose retrieved from the catalogue API (/v1/purposes?type=INDIVIDUAL)
              example: 1
            monthly_volume_usd:
              type: integer
              description: Expected monthly transaction volume in USD (not cents)
              example: 5000
        meta_data:
          type: object
          additionalProperties: true
          description: Additional custom metadata as key-value pairs
          example:
            customer_reference: REF-12345
            internal_notes: VIP customer
    ProofOfIdentity:
      type: object
      required:
      - type
      - number
      - country
      - issue_date
      - expiry_date
      - files
      properties:
        type:
          type: string
          enum:
          - PASSPORT
          - NATIONAL_ID
          - DRIVERS_LICENSE
          description: Type of identity document
          example: PASSPORT
        number:
          type: string
          description: Document number
          example: A12345678
        country:
          $ref: '#/components/schemas/CountryCode'
        issue_date:
          type: string
          format: date
          description: Document issue date in YYYY-MM-DD format
          example: '2020-01-15'
        expiry_date:
          type: string
          format: date
          description: Document expiry date in YYYY-MM-DD format
          example: '2030-01-15'
        files:
          type: array
          description: Array of document file URIs with sides
          items:
            type: object
            required:
            - uri
            additionalProperties: false
            properties:
              side:
                type: string
                enum:
                - FRONT
                - BACK
                description: Side of the document (optional for passport, required for other document types)
                example: FRONT
              uri:
                type: string
                description: The URI received from the upload document endpoint
                example: /AbAcQ4hn_0652746727637.pdf
    ProofOfAddress:
      type: object
      required:
      - type
      - country
      - files
      properties:
        type:
          type: string
          enum:
          - PASSPORT
          - NATIONAL_ID
          - DRIVERS_LICENSE
          - RESIDENCE_PERMIT
          - UTILITY_BILL
          - GOVERNMENT_LETTER
          - BANK_STATEMENT
          - COMPANY_DOC
          description: Type of address proof document
          example: UTILITY_BILL
        country:
          $ref: '#/components/schemas/CountryCode'
        files:
          type: array
          description: Array of document file URIs (no sides needed)
          items:
            type: object
            required:
            - uri
            additionalProperties: false
            properties:
              uri:
                type: string
                description: The URI received from the upload document endpoint
                example: /AbAcQ4hn_0652746727638.pdf
    AttachDocumentForIndividualCustomerInput:
      type: object
      required:
      - customer_id
      - proof_of_identity
      - proof_of_address
      - tos_policies_value
      properties:
        customer_id:
          type: string
          format: uuid
          description: Unique identifier for the customer
          example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
        proof_of_identity:
          $ref: '#/components/schemas/ProofOfIdentity'
        proof_of_address:
          $ref: '#/components/schemas/ProofOfAddress'
        tos_policies_value:
          type: string
          description: Terms of Service policies value parsed from the tos_policies_url query parameter returned from the Create Individual Customer endpoint. Providing this signifies that the user was shown the policies and have accepted the terms.
