  /v1/customers/business:
    post:
      summary: Create Business Customer
      description: Create a new business customer with verification details, addresses, and associated parties
      x-mint:
        content: "<Warning>\n  This endpoint was deprecated on May 20, 2026. Use [Create Business Customer V2](https://developer.fin.com/api-reference/customers/create-business-customer-v2) instead.\n</Warning>\n\n## Important Requirements\n\n- **Email Address**: Must be all lowercase or you will receive a validation error\n- **RELIANCE Verification**: If you attempt to use `RELIANCE` verification type but it's not enabled for your client, you will receive a 423 error with message: \"RELIANCE is not available for your client\"\n- **Third-party Fund Usage**: The `third_party_fund_usage` field indicates whether this customer will be moving other people's money\n- **Ownership Percentages**: The total ownership percentages of all associated parties must add up to more than 0 and less than 100\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessCustomerInput'
      responses:
        '200':
          description: Business customer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        description: Unique identifier for the created customer
                        example: 2d0a9df3-e1e5-4955-9759-ce0522e0ddc9
                      tos_policies_url:
                        type: string
                        format: uri
                        description: URL for customer to accept Terms of Service policies
                        example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=2d0a9df3-e1e5-4955-9759-ce0522e0ddc9&tos_policies_value=f11e77c6-8dc0-4d4b-a3f2-ed84c8ccfc69
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          description: Locked. RELIANCE verification is not available for your client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: RELIANCE is not available for your client
  /v1/customers/upload:
    post:
      summary: Upload Document
      description: Upload customer documents using multipart/form-data. Files can be uploaded with arbitrary field names (e.g., poa, poi, passport, file1, etc.)
      x-mint:
        content: "## Allowed File Types\n\n- `PDF`\n- `JPG` / `JPEG`\n- `PNG`\n\n<Note>\n  Files should be uploaded as separate form fields with arbitrary names.\n  You can use any field name for files (e.g., `passport`, `poa`, `poi`, `file1`, `document1`, etc.).\n  The field name you use will be returned as the key in the response.\n</Note>\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
                passport:
                  type: string
                  format: binary
                poa:
                  type: string
                  format: binary
                poi:
                  type: string
                  format: binary
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            type: string
                        example:
                        - passport: /CwW9PHhP_Germany-passport.jpg
                        - poa: /KVdLfqjR_germany-poa-green.jpg
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v2/customers/{customer_id}/individual/attach:
    post:
      summary: Attach Documents to Individual Customer V2
      description: Attach identifying and address documents to an existing v2 individual customer. Replaces the v1 proof_of_identity / proof_of_address structure with separate identifying_documents and address_documents arrays. Documents are processed asynchronously.
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the individual customer
        example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentsToIndividualCustomerV2Input'
            example:
              identifying_documents:
              - type: SELFIE
                files:
                - uri: /AbAcQ4hn_0652746727637.pdf
              - type: DRIVERS_LICENSE
                number: DL987654321
                country: USA
                state: US-CA
                issue_date: '2019-06-01'
                expiry_date: '2029-06-01'
                files:
                - side: FRONT
                  uri: /AbAcQ4hn_0652746727638.pdf
                - side: BACK
                  uri: /XyZ123mn_0652746727639.pdf
              address_documents:
              - type: BANK_STATEMENT
                country: USA
                files:
                - uri: /PoAdef45_0652746727640.pdf
              tos_policies_value: e9414388-fbdf-4407-b5c2-bc39eae3645b
      responses:
        '200':
          description: Request validated and queued for asynchronous processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
                  meta:
                    type: object
                    nullable: true
                    example: null
        '400':
          description: Malformed JSON or unparseable payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Malformed request body
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          description: Customer not owned by the client, wrong api_version, or not in an allowed status, or a file URI does not belong to the customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: forbidden
                      message:
                        type: string
                        example: Customer is not eligible for this operation
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Another attach for this customer is already in flight
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: conflict
                      message:
                        type: string
                        example: An attach request is already in progress for this customer
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Internal server error
