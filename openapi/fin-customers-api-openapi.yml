          description: On-ramp and off-ramp capabilities for the customer
          properties:
            on_ramp:
              type: array
              items:
                type: object
                properties:
                  currency:
                    type: string
                    example: USD
                  status:
                    type: boolean
                    example: false
                  methods:
                    type: array
                    items:
                      type: string
                    example:
                    - ACH
                    - FEDWIRE
                  reason:
                    type: object
                    properties:
                      for_customer:
                        type: string
                        nullable: true
                      for_developer:
                        type: string
                        nullable: true
            off_ramp:
              type: array
              items:
                type: object
                properties:
                  currency:
                    type: string
