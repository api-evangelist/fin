      properties:
        identifying_documents:
          type: array
          minItems: 1
          description: Government-issued identity documents. Include at most one non-SELFIE primary document (PASSPORT, NATIONAL_ID, DRIVERS_LICENSE, or RESIDENCE_PERMIT) plus an optional SELFIE entry. NATIONAL_ID, DRIVERS_LICENSE, and RESIDENCE_PERMIT require both FRONT and BACK files.
          items:
            $ref: '#/components/schemas/V2IndividualAttachIdentifyingDocument'
        address_documents:
          type: array
          minItems: 1
          maxItems: 1
          description: Proof of address. Exactly one entry is required.
          items:
            $ref: '#/components/schemas/V2IndividualAddressDocument'
        tos_policies_value:
          type: string
          description: Parsed from the tos_policies_value query parameter in the tos_policies_url returned by POST /v2/customers/individual. Signifies the customer has accepted the Terms of Service.
          example: e9414388-fbdf-4407-b5c2-bc39eae3645b
    V2CorporateShareholder:
      type: object
      required:
      - entity_name
      - entity_name_en
      - registration_country_code
      - ownership_percentage
      properties:
        entity_name:
          type: string
          description: Corporate shareholder's legal name.
          example: Acme Ventures LLC
        entity_name_en:
          type: string
          description: English translation of entity name. Required if entity_name contains non-ASCII characters.
          example: Acme Ventures LLC
        registration_country_code:
          $ref: '#/components/schemas/CountryCode'
        ownership_percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Ownership stake as a percentage (0 to 100).
          example: 60
        registration_number:
          type: string
          description: Entity registration number. Optional.
          example: 98-7654321
        entity_type:
          type: string
          enum:
          - LIMITED_LIABILITY_COMPANY
          - PUBLICLY_LISTED_COMPANY
          - SOLE_PROPRIETOR
          - PARTNERSHIP
          - CORPORATION
          - TRUST
          - PRIVATE_FOUNDATION
          - CHARITY
          - NONPROFIT_ORGANIZATION
          - PUBLIC_AGENCY_OR_AUTHORITY
          description: Legal entity type of the corporate shareholder. Optional.
          example: LIMITED_LIABILITY_COMPANY
        incorporation_date:
          type: string
          format: date
          description: Incorporation date in YYYY-MM-DD format. Optional.
          example: '2015-03-01'
    V2CustomerRiskSplit:
      type: object
      description: Breakdown of customer risk classifications. Percentages must sum to 100.
      required:
      - low_risk
      - medium_risk
      - high_risk
      properties:
        low_risk:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of low-risk customers.
          example: 70
        medium_risk:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of medium-risk customers.
          example: 25
        high_risk:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of high-risk customers.
          example: 5
    AttachDocumentsToBusinessCustomerInput:
      type: object
