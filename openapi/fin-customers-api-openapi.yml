  /v2/customers/{customer_id}/wallets:
    post:
      summary: Create Customer Wallets
      description: Provisions one or more crypto wallets for a customer across supported chains and tokens.
      x-mint:
        content: "<Note>\n  Fin.com issued crypto wallets require pre-configuration. Contact support to learn more.\n</Note>\n\nWallets start with a status of `PENDING`. They move to `ACTIVE` (or\n`INACTIVE`) asynchronously once the wallet address has been issued,\nso creation is not synchronous. Poll [Get Customer\nWallets](/api-reference/crypto-orchestration/get-customer-wallets)\nto check on status.\n\nSupported rails and currencies:\n\n| Rail     | Currency |\n| -------- | -------- |\n| POLYGON  | USDC     |\n| ETHEREUM | USDC     |\n| SOLANA   | USDC     |\n\nIf any requested wallet (same `rail` + `currency` pair) already\nexists for the customer, the request fails with a `409` and lists\nthe colliding pairs; none of the requested wallets are created.\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
        example: 765d498e-a267-4154-9d2f-9e411a0b50dd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallets
              properties:
                wallets:
                  type: array
                  minItems: 1
                  description: Wallets to provision, one entry per rail.
                  items:
                    type: object
                    required:
                    - rail
                    - currency
                    properties:
                      rail:
                        type: string
                        description: Blockchain network to provision the wallet(s) on.
                        example: SOLANA
                      currency:
                        type: array
                        minItems: 1
                        description: Token(s) to provision a wallet for on this rail.
                        items:
                          type: string
                        example:
                        - USDC
            example:
              wallets:
              - rail: SOLANA
                currency:
                - USDC
              - rail: ETHEREUM
                currency:
                - USDC
      responses:
        '200':
          description: 'Wallet creation request accepted for processing. Note the nested `data`: the outer envelope wraps a `message` plus the inner `data` array of wallets being provisioned.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Request is being processed
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerWallet'
              example:
                data:
                  message: Request is being processed
                  data:
                  - id: b1e2c3d4-4d5e-6f70-8a90-1b2c3d4e5f60
                    rail: SOLANA
                    currency: USDC
                    status: PENDING
                  - id: d3a4e5f6-4d5e-6f70-8a90-1b2c3d4e5f62
                    rail: ETHEREUM
                    currency: USDC
                    status: PENDING
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '409':
          description: One or more of the requested wallets already exist for this customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: one or more wallets already exist for this customer
                  collisions:
                    type: array
                    items:
                      type: object
                      properties:
                        rail:
                          type: string
                          example: SOLANA
                        currency:
                          type: string
                          example: USDC
              example:
                message: one or more wallets already exist for this customer
                collisions:
                - rail: SOLANA
                  currency: USDC
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      summary: Get Customer Wallets
      description: Returns all crypto wallets linked to a customer across supported chains and tokens.
      x-mint:
        content: "<Note>\n  Fin.com issued crypto wallets require pre-configuration. Contact support to learn more.\n</Note>\n\nUpon approval, the customer is provisioned wallet addresses for the following rails and currencies:\n\n| Rail     | Currency |\n| -------- | -------- |\n| POLYGON  | USDC     |\n| ETHEREUM | USDC     |\n| SOLANA   | USDC     |\n\n`address` is `null` until the wallet finishes provisioning (see\n`status` on [Create Customer Wallets](/api-reference/crypto-orchestration/create-customer-wallets)).\n"
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
        example: 765d498e-a267-4154-9d2f-9e411a0b50dd
      responses:
        '200':
          description: Customer wallets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerWallet'
              example:
                data:
                - id: 27dbc0f2-e5ae-444b-b4ab-0764252aedf6
                  status: ACTIVE
                  currency: USDC
                  rail: ETHEREUM
                  address: '0xc42a5f7083c7e8f1d9820c7660867277289cd998'
                  balance: 10.000001
                - id: e1dcce59-0309-43de-ab6c-a0bd3497b9c3
                  status: ACTIVE
                  currency: USDC
                  rail: SOLANA
                  address: BCSZEokfpVsSpUuuZJMScLiUpYjvvUmrrAJkNbrTTnng
                  balance: 25.000001
                - id: c92dfe1d-220e-4446-a5e4-cd7d46031ba5
                  status: PENDING
                  currency: USDC
                  rail: POLYGON
                  address: null
                  balance: 0
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
