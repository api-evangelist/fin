    V2OwnershipInfo:
      type: object
      description: Required when roles includes ubo.
      required:
      - designation
      - percentage_of_ownership
      - relationship_establishment_date
      - has_control
      - is_signer
      - is_director
      properties:
        designation:
          type: string
          maxLength: 100
          description: Title or position in the company (e.g., CEO, CFO, Founder).
          example: CEO
        percentage_of_ownership:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Ownership stake as a percentage (0 to 100). Individual parties may have 0% ownership. Total across all parties must be < 100%.
          example: 75
        relationship_establishment_date:
          type: string
          format: date
          description: 'Date when the relationship with the business began. Format: YYYY-MM-DD. Cannot be a future date.'
          example: '2018-06-15'
        has_control:
          type: boolean
          description: Whether this party has significant control over the entity.
          example: true
        is_signer:
          type: boolean
          description: Whether this party is an authorized signatory.
          example: true
        is_director:
          type: boolean
          description: Whether this party serves as a director.
          example: true
    BusinessCustomerDetailV2:
      title: Business
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          example: ed54db74-7dbe-47d2-8ea0-c2bf2a9dda06
        type:
          type: string
          enum:
          - BUSINESS
        business_name:
          type: string
          example: Fin.com
        email:
          type: string
          format: email
          example: m@tech.com
        phone:
          type: string
          example: '+8801529876543'
        country_of_incorporation:
          type: string
          example: BGD
        verification_type:
          type: string
          example: STANDARD
        customer_status:
          type: string
          description: 'The following statuses have been changed from V1.

            QUEUED (V1) → PROCESSING (V2). ON_HOLD (V1) → IN_COMPLIANCE (V2). REINITIATE (V1) → ACTION_REQUIRED (V2).'
          enum:
          - INCOMPLETE
          - PROCESSING
          - REVIEWING
          - APPROVED
          - ASSOCIATED_PARTIES_REMAINING
          - IN_COMPLIANCE
          - ACTION_REQUIRED
          - REJECTED
          example: IN_COMPLIANCE
        tos_policies_url:
          type: string
          format: uri
        associated_parties:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: f6b13e01-044a-4f74-a70b-d5f66b6449af
              type:
                type: string
                example: INDIVIDUAL
              ownership_percent:
                type: number
                example: 60
              email:
                type: string
                format: email
                example: fatima.rahman22@acmecorp.com.bd
              verification:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - INITIATED
                    - REVIEWING
                    - APPROVED
                    - REJECTED
                    example: APPROVED
                  reason:
                    type: object
                    properties:
                      for_customer:
                        type: string
                        nullable: true
                      for_developer:
                        type: string
                        nullable: true
                  updated_at:
                    type: string
                    format: date-time
                    example: '2026-04-13T11:40:49Z'
        created_at:
          type: string
          format: date-time
          example: '2026-04-01T12:03:03Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-04-01T12:03:03Z'
        rejection_reason:
          type: object
          nullable: true
          description: Populated when customer_status is REJECTED or ACTION_REQUIRED. Contains applicant-level, document-level, and associated party-level rejection details. Null when no rejection exists.
          properties:
            applicant:
              type: object
              nullable: true
              description: Applicant-level rejection reason.
              properties:
                moderation_comment:
                  type: string
                  example: If you're a sole entrepreneur, upload corporate documents confirming your company's legal status.
                reject_labels:
                  type: array
                  items:
                    type: string
                  example:
                  - DOCUMENT_MISSING
            documents:
              type: array
              description: Document-level rejection reasons.
              items:
                type: object
                properties:
                  uri:
                    type: string
                    example: /7zlLPvlx_testdoc6.jpg
                  category:
                    type: string
                    example: SUPPORTING_DOCUMENTS
                  moderation_comment:
                    type: string
                    example: This document is not accepted. The document should be of good quality.
                  reject_labels:
                    type: array
                    items:
                      type: string
                    example:
                    - LOW_QUALITY
            associated_parties:
              type: array
              description: Associated party-level rejection reasons.
              items:
                type: object
          example: null
        request_for_information:
          type: array
          description: List of open requests for additional information. Populated when customer_status is ACTION_REQUIRED. Same structure as customer.rfi webhook payload.
          items:
            type: object
            properties:
              section:
                type: string
                example: ownership_documents
              categories:
                type: array
                items:
                  type: object
                  properties:
                    document_type:
                      type: string
                      example: SHAREHOLDER_REGISTRY
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          field_name:
                            type: string
                            example: files
                          data_type:
                            type: string
                            enum:
                            - URI
                            - DATE
                            - TEXT
                            - ENUM
                            example: URI
                          status:
                            type: string
                            enum:
                            - MISSING
                            - EXPIRED
                            - INVALID
                            example: INVALID
                          reason:
                            type: string
                            nullable: true
                            example: Unacceptable document.
          example: []
    V2VerificationMethod:
