          format: uuid
        description: Unique identifier for the business customer
        example: ed54db74-7dbe-47d2-8ea0-c2bf2a9dda06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentsToAssociatedPartyV2Input'
            example:
              associated_party_attachments:
              - associated_party_id: f6b13e01-044a-4f74-a70b-d5f66b6449af
                identifying_documents:
                - type: PASSPORT
                  number: A12345678
                  country: USA
                  issue_date: '2020-01-15'
                  expiry_date: '2030-01-15'
                  files:
                  - uri: /AbAcQ4hn_0652746727637.pdf
                - type: DRIVERS_LICENSE
                  number: DL987654321
                  country: USA
                  issue_date: '2019-06-01'
                  expiry_date: '2029-06-01'
                  files:
                  - side: FRONT
                    uri: /AbAcQ4hn_0652746727645.pdf
                  - side: BACK
                    uri: /AbAcQ4hn_0652746727646.pdf
                address_documents:
                - type: BANK_STATEMENT
                  files:
                  - uri: /AbAcQ4hn_0652746727638.pdf
                supporting_documents: []
              - associated_party_id: f71dc19f-b9a0-49fb-bd2d-5add3c01626e
                identifying_documents:
                - type: NATIONAL_ID
                  number: NID-987654
                  country: USA
                  issue_date: '2021-03-10'
                  expiry_date: '2031-03-10'
                  files:
                  - side: FRONT
                    uri: /XyZ123mn_0652746727650.pdf
                  - side: BACK
                    uri: /XyZ123mn_0652746727651.pdf
                address_documents:
                - type: UTILITY_BILL
                  files:
                  - uri: /XyZ123mn_0652746727652.pdf
      responses:
        '200':
          description: Documents attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Generic response object
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Validation failed
                  data:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  schemas:
    V2Addresses:
      type: object
      required:
      - is_incorporated_address_same
      - incorporated_address
      properties:
        is_incorporated_address_same:
          type: boolean
          description: Whether the physical operating address is the same as the incorporated address. If false, physical_address is required.
          example: false
        incorporated_address:
          $ref: '#/components/schemas/V2Address'
        physical_address:
          allOf:
          - $ref: '#/components/schemas/V2Address'
          description: Physical operating address. Required when is_incorporated_address_same is false.
    CreateIndividualCustomerInput:
      type: object
      required:
      - verification_type
      - basic_info
      - address
      - financial_profile
      properties:
        verification_type:
          type: string
          enum:
          - STANDARD
          - RELIANCE
          example: STANDARD
        basic_info:
          type: object
          required:
          - first_name
          - last_name
          - dob
          - email
          - phone
          - country_of_residence
          - nationality
          - tin
          properties:
            first_name:
              type: string
              example: John
            last_name:
              type: string
              example: Doe
            dob:
              type: string
              format: date
              example: '1990-01-15'
            email:
              type: string
              format: email
              example: john.doe@example.com
            phone:
              type: string
              example: '+14155551234'
            country_of_residence:
              $ref: '#/components/schemas/CountryCode'
            nationality:
              $ref: '#/components/schemas/CountryCode'
            tin:
              type: string
              example: 123-45-6789
        address:
          type: object
          required:
          - street
          - city
          - state
          - postal_code
          - country
          properties:
            street:
              type: string
              example: 123 Main St
            city:
              type: string
              example: New York
            state:
              type: string
              description: State or province. Required. Must be an ISO 3166-2 subdivision code (e.g. US-CA, BD-13).
              example: US-NY
            postal_code:
              type: string
              example: '10001'
            country:
              $ref: '#/components/schemas/CountryCode'
        financial_profile:
          type: object
          required:
          - occupation_id
          - source_of_fund_id
          - purpose_id
          - monthly_volume_usd
          properties:
            occupation_id:
              type: integer
              example: 1
            source_of_fund_id:
              type: integer
              example: 1
            purpose_id:
              type: integer
              example: 1
            monthly_volume_usd:
              type: integer
              minimum: 0
              example: 5000
        meta_data:
          type: object
          additionalProperties: true
          example:
            customer_reference: REF-12345
    V2Compliance:
      type: object
      properties:
        operates_in_prohibited_countries:
          type: boolean
          description: Whether the business operates in OFAC/sanctioned countries.
          example: false
        additional_description_for_compliance_screening:
          type: string
          description: Free-text compliance notes for manual review.
          example: We do not operate in any OFAC-sanctioned jurisdictions.
        risk_profile:
          $ref: '#/components/schemas/V2RiskProfile'
        regulated_activity:
          $ref: '#/components/schemas/V2RegulatedActivity'
        aml:
          $ref: '#/components/schemas/V2AML'
    V2RiskProfile:
      type: object
      properties:
        high_risk_activities:
          type: array
          description: High-risk activities the business engages in. If non-empty, high_risk_activities_explanation is required.
          items:
            type: string
            enum:
            - adult_entertainment
            - crypto_exchange
            - gambling
            - cannabis
            - weapons
            - money_services
            - cross_border_payments
          example:
          - cross_border_payments
        high_risk_activities_explanation:
          type: string
          description: Explanation of declared high-risk activities. Required when high_risk_activities is non-empty.
          example: We facilitate cross-border B2B payments, subject to enhanced due diligence procedures.
        conducts_money_services:
          type: boolean
          description: Whether the business provides money services.
          example: true
        conducts_money_services_via_fin:
          type: boolean
          description: Whether money services are provided via financial intermediaries.
          example: false
        conducts_money_services_description:
          type: string
          description: Details about the money services offered.
          example: Licensed money transmitter providing international wire transfer services.
    AttachDocumentForIndividualCustomerInput:
      type: object
      required:
      - customer_id
      - proof_of_identity
      - proof_of_address
      - tos_policies_value
      properties:
        customer_id:
          type: string
          format: uuid
          example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
        proof_of_identity:
          $ref: '#/components/schemas/ProofOfIdentity'
        proof_of_address:
          $ref: '#/components/schemas/ProofOfAddressIndividual'
        tos_policies_value:
          type: string
          example: e9414388-fbdf-4407-b5c2-bc39eae3645b
    CustomerWallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique wallet identifier.
          example: 27dbc0f2-e5ae-444b-b4ab-0764252aedf6
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - INACTIVE
          description: Wallet provisioning status. Wallets start PENDING and move to ACTIVE (or INACTIVE) asynchronously once the wallet address has been issued; creation is not synchronous.
          example: ACTIVE
        currency:
          type: string
          description: Token held in this wallet.
          example: USDC
        rail:
          type: string
          description: Blockchain network for this wallet.
          example: ETHEREUM
        address:
          type: string
          nullable: true
          description: On-chain wallet address. Null until the wallet is provisioned.
          example: '0xc42a5f7083c7e8f1d9820c7660867277289cd998'
        balance:
          type: number
          description: Current wallet balance.
          example: 10.000001
    V2AddressDocumentAttachment:
      type: object
      required:
      - type
      - files
      properties:
        type:
          type: string
          enum:
          - UTILITY_BILL
          - GOVERNMENT_LETTER
          - BANK_STATEMENT
          - PROOF_OF_TAX_IDENTIFICATION
          - COURT_DOCUMENT
          - INSURANCE_STATEMENT
          description: Type of address proof document. Must be within the last 90 days.
          example: BANK_STATEMENT
        files:
          type: array
          description: One or more file URIs from [Upload Document](https://developer.fin.com/api-reference/customers/upload-document) endpoint.
          minItems: 1
          items:
            type: object
            required:
            - uri
            properties:
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727638.pdf
    V2IndividualAddressDocument:
      type: object
      required:
      - type
      - country
      - files
      properties:
        type:
          type: string
          enum:
          - UTILITY_BILL
          - GOVERNMENT_LETTER
          - BANK_STATEMENT
          description: Type of address proof document.
          example: BANK_STATEMENT
        country:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
          description: Country the address document was issued in. Must match the customer's country_of_residence.
        issue_date:
          type: string
          format: date
          description: Optional issue date in YYYY-MM-DD format.
          example: '2024-06-15'
        files:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one file URI from the [Upload Document](https://developer.fin.com/api-reference/customers/upload-document) endpoint.
          items:
            type: object
            required:
            - uri
            properties:
              side:
                type: string
                enum:
                - FRONT
                - BACK
                description: Optional.
                example: FRONT
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /XyZ123mn_0652746727639.pdf
    V2FinancialProfile:
      type: object
      required:
      - purpose_id
      - source_of_fund_ids
      - source_of_wealth_ids
      - estimated_annual_revenue_usd
      - expected_monthly_deposits_usd
      - expected_monthly_withdrawals_usd
      - third_party_fund_usage
      properties:
        purpose_id:
          type: integer
          description: Account purpose. Foreign key to purposes reference table. Fetch valid values from [List Account Purposes](https://developer.fin.com/api-reference/catalogue/list-account-purposes) endpoint.
          example: 3
        purpose_remarks:
          type: string
          description: Additional context for the account purpose. Required if purpose represents "Other".
          example: Cross-border B2B payments for international suppliers
        source_of_fund_ids:
          type: array
          description: Source(s) of business funds. FK array to source_of_funds reference table. Min 1 item. Fetch valid values from [List Source of Funds](https://developer.fin.com/api-reference/catalogue/list-source-of-funds). Order items from the largest to smallest contributor. The ID representing the primary source of funds must come first, followed by secondary sources in descending order.
          minItems: 1
          items:
            type: integer
          example:
          - 1
          - 4
        source_of_funds_description:
          type: string
          description: Additional context for source of funds.
          example: Revenue from software licensing and SaaS subscriptions
        source_of_wealth_ids:
          type: array
          description: Source(s) of owner's wealth. FK array to source_of_wealth reference table. Min 1 item. Fetch valid values from [List Source of Wealth](https://developer.fin.com/api-reference/catalogue/list-source-of-wealth). Order items from the largest to smallest contributor. The primary source must come first.
          minItems: 1
          items:
            type: integer
          example:
          - 2
        estimated_annual_revenue_usd:
          type: integer
          minimum: 0
          description: Estimated annual revenue in USD (not cents). Must be >= 0.
          example: 5000000
        expected_monthly_deposits_usd:
          type: integer
          minimum: 0
          description: Expected monthly deposit volume in USD (not cents). Must be >= 0.
          example: 400000
        expected_monthly_withdrawals_usd:
          type: integer
          minimum: 0
          description: Expected monthly withdrawal volume in USD (not cents). Must be >= 0.
          example: 350000
        expected_transaction_value_usd:
          type: integer
          minimum: 0
          description: Typical single transaction value in USD (not cents). Optional.
          example: 50000
        expected_monthly_transaction_count:
          type: integer
          minimum: 0
          description: Expected number of transactions per month. Optional.
          example: 20
        third_party_fund_usage:
          type: boolean
          description: Whether this business will process, hold, or move funds on behalf of other parties. Set to true only for MSBs and payment processors. Triggers enhanced compliance review.
          example: false
    V2BasicInfo:
      type: object
      required:
      - legal_name
      - legal_name_en
      - trade_name
      - description
      - entity_type
      - email
      - phone
      - incorporation_date
      - country_of_incorporation
      - registration_number
      - tax_info
      - websites
      properties:
        legal_name:
          type: string
          maxLength: 255
          description: Official registered business name. Must match incorporation documents.
          example: Fin.com
        legal_name_en:
          type: string
          description: English translation of the legal name. Required if legal_name contains non-ASCII characters.
          example: Fin.com
        trade_name:
          type: string
          description: Common operating name or DBA (Doing Business As).
          example: Toronggo
        trade_name_en:
          type: string
          description: English translation of the trade name.
          example: Toronggo
        description:
          type: string
          maxLength: 500
          description: Description of the company's business activities and purpose.
          example: Bangladesh-based technology company providing cross-border B2B payment and financial technology services
        entity_type:
          type: string
          enum:
          - LIMITED_LIABILITY_COMPANY
          - PUBLICLY_LISTED_COMPANY
          - SOLE_PROPRIETOR
          - PARTNERSHIP
          - CORPORATION
          - TRUST
          - PRIVATE_FOUNDATION
          - CHARITY
          - NONPROFIT_ORGANIZATION
          - PUBLIC_AGENCY_OR_AUTHORITY
          description: Legal entity type of the business.
          example: LIMITED_LIABILITY_COMPANY
        email:
          type: string
          format: email
          description: Business email address. Must be all lowercase.
          example: m@tech.com
        phone:
          type: string
          description: Business phone number in E.164 format.
          example: '+8801529876543'
        incorporation_date:
          type: string
          format: date
          description: Date of incorporation in YYYY-MM-DD format. Cannot be a future date.
          example: '2018-06-15'
        country_of_incorporation:
          $ref: '#/components/schemas/CountryCode'
        registration_number:
          type: string
          description: Business registration or company number. Required.
          example: 12-3456789
        legal_entity_identifier:
          type: string
          minLength: 20
          maxLength: 20
          description: LEI code (20-character alphanumeric). Optional.
          example: 549300EXAMPLE0001X23
        is_dao:
          type: boolean
          description: Whether the entity is a Decentralized Autonomous Organization.
          example: false
        tax_info:
          type: array
          description: Tax and identifying documents for the business. Min 1 item.
          minItems: 1
          items:
            $ref: '#/components/schemas/V2IdentifyingDocument'
        websites:
          type: array
          description: Business website URLs. Min 1 item.
          minItems: 1
          items:
            type: string
            format: uri
          example:
          - https://fin.com
    BusinessCustomerDetail:
      type: object
      title: Business
      properties:
        customer_id:
          type: string
          format: uuid
          example: 94e6b847-4e19-49e3-b3ab-ffa95872eda9
        type:
          type: string
          enum:
          - BUSINESS
        business_name:
          type: string
          example: Fin.com
        email:
          type: string
          format: email
          example: contact@fin.com
        phone:
          type: string
          example: '+6591234567'
        country_of_incorporation:
          type: string
          example: SGP
        verification_type:
          type: string
          example: STANDARD
        customer_status:
          type: string
          example: APPROVED
        tos_policies_url:
          type: string
          format: uri
          example: https://orchestration.fin.com/orchestration-customer-tos?customer_id=94e6b847-4e19-49e3-b3ab-ffa95872eda9&tos_policies_value=6955e70b-f9f3-4076-b1ce-5c897085dd24
        associated_parties:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: 42daffd3-09a0-4d48-8e73-2680a953d0e1
              type:
                type: string
                example: INDIVIDUAL
              ownership_percent:
                type: number
                example: 10
              email:
                type: string
                format: email
                example: john.doe@fin.com
              verification:
                type: object
                properties:
                  status:
                    type: string
                    example: APPROVED
                  reason:
                    type: object
                    properties:
                      for_customer:
                        type: string
                        nullable: true
                      for_developer:
                        type: string
                        nullable: true
                  updated_at:
                    type: string
                    format: date-time
                    example: '2026-04-15T11:29:08Z'
        created_at:
          type: string
          format: date-time
          example: '2026-04-15T11:26:12Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-04-15T11:31:18Z'
        last_status_updated_at:
          type: string
          format: date-time
          example: '2026-04-15T11:29:09Z'
        capabilities:
          type: object
          description: On-ramp and off-ramp capabilities for the customer
          properties:
            on_ramp:
              type: array
              items:
                type: object
                properties:
                  currency:
                    type: string
                    example: USD
                  status:
                    type: boolean
                    example: false
                  methods:
                    type: array
                    items:
                      type: string
                    example:
                    - ACH
                    - FEDWIRE
                  reason:
                    type: object
                    properties:
                      for_customer:
                        type: string
                        nullable: true
                      for_developer:
                        type: string
                        nullable: true
            off_ramp:
              type: array
              items:
                type: object
                properties:
                  currency:
                    type: string
                    example: USD
                  status:
                    type: boolean
                    example: true
                  methods:
                    type: array
                    items:
                      type: string
                    example:
                    - BANK
                  reason:
                    type: object
                    properties:
                      for_customer:
                        type: string
                        nullable: true
                      for_developer:
                        type: string
                        nullable: true
        rejection_reason:
          type: object
          nullable: true
          description: Populated when customer_status is REJECTED. Null otherwise.
        request_for_information:
          type: array
          description: List of pending information requests. Empty when none are outstanding.
          items:
            type: object
    V2AssociatedPartySupportingDocumentAttachment:
      type: object
      required:
      - type
      - files
      properties:
        type:
          type: string
          enum:
          - MILITARY_ID
          - MATRICULATE_ID
          - STATE_OR_PROVINCIAL_ID
          - VISA
          - OTHER
          description: Type of additional supporting document for the associated party.
          example: MILITARY_ID
        files:
          type: array
          description: One or more file URIs from [Upload Document](https://developer.fin.com/api-reference/customers/upload-document) endpoint.
          minItems: 1
          items:
            type: object
            required:
            - uri
            properties:
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727638.pdf
    V2IndividualAttachIdentifyingDocument:
      type: object
      required:
      - type
      - files
      allOf:
      - if:
          properties:
            type:
              const: DRIVERS_LICENSE
            country:
              const: USA
          required:
          - type
          - country
        then:
          required:
          - state
      properties:
        type:
          type: string
          enum:
          - PASSPORT
          - NATIONAL_ID
          - DRIVERS_LICENSE
          - RESIDENCE_PERMIT
          - SELFIE
          description: Type of identity document. At most one non-SELFIE document may be included per request. A SELFIE entry carries only `type` and `files`; all other fields are ignored for SELFIE.
          example: PASSPORT
        number:
          type: string
          description: Document number. Required for all types except SELFIE.
          example: A12345678
        country:
          $ref: '#/components/schemas/CountryCode'
        state:
          type: string
          maxLength: 64
          description: Document issuing state. Max 64 characters. Required when the type is DRIVERS_LICENSE and country is USA.
          example: US-CA
        issue_date:
          type: string
          format: date
          description: Optional issue date in YYYY-MM-DD format. When provided together with expiry_date, expiry_date must be strictly later.
          example: '2020-01-15'
        expiry_date:
          type: string
          format: date
          description: Expiry date in YYYY-MM-DD format. Required for all types except SELFIE. Must be in the future.
          example: '2030-01-15'
        files:
          type: array
          minItems: 1
          description: File URIs from the [Upload Document](https://developer.fin.com/api-reference/customers/upload-document) endpoint. PASSPORT and SELFIE take a single file; NATIONAL_ID, DRIVERS_LICENSE, and RESIDENCE_PERMIT require one FRONT and one BACK file. File URIs must be unique across the entire request (SELFIE files excluded).
          items:
            type: object
            required:
            - uri
            properties:
              side:
                type: string
                enum:
                - FRONT
                - BACK
                description: Required for NATIONAL_ID, DRIVERS_LICENSE, and RESIDENCE_PERMIT. Optional for PASSPORT and SELFIE.
                example: FRONT
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727637.pdf
    CreateBusinessCustomerInput:
      type: object
      required:
      - basic_info
      - financial_profile
      - addresses
      - associated_parties
      properties:
        verification_type:
          type: string
          enum:
          - STANDARD
          - RELIANCE
          description: Type of verification to perform (optional, defaults to STANDARD). Note that RELIANCE verification must be enabled for your client, or you will receive a 423 error.
          example: RELIANCE
        basic_info:
          type: object
          required:
          - business_name
          - description
          - entity_type
          - website
          - email
          - incorporation_date
          - phone
          - country_of_incorporation
          - registration_number
          - tax_id
          properties:
            business_name:
              type: string
              description: Legal name of the business
              example: Acme Corp Ltd
            business_trade_name:
              type: string
              description: Trading name or DBA (Doing Business As) name
              example: Acme
            description:
              type: string
              description: Description of the company's business
              example: International software and payments company
            entity_type:
              type: string
              enum:
              - LIMITED_LIABILITY_COMPANY
              - PUBLICLY_LISTED_COMPANY
              - SOLE_PROPRIETOR
              - PARTNERSHIP
              - CORPORATION
              - TRUST
              - PRIVATE_FOUNDATION
              - CHARITY
              - NONPROFIT_ORGANIZATION
              - PUBLIC_AGENCY_OR_AUTHORITY
              - PRIVATE_LIMITED
              description: Legal entity type of the business
              example: LIMITED_LIABILITY_COMPANY
            website:
              type: string
              format: uri
              description: Company website URL
              example: https://fin.com
            email:
              type: string
              format: email
              description: Business email address. Must be all lowercase or a validation error will occur.
              example: contact@acmecorp.com
            incorporation_date:
              type: string
              format: date
              description: Date of incorporation in YYYY-MM-DD format
              example: '2018-06-15'
            phone:
              type: string
              description: Business phone number
              example: '+14155552671'
            country_of_incorporation:
              $ref: '#/components/schemas/CountryCode'
            registration_number:
              type: string
              description: Business registration number
              example: 12-3456789
            tax_id:
              type: string
              description: Tax identification number or EIN (must be EIN for USA)
              example: 12-3456789
        financial_profile:
          type: object
          required:
          - purpose_id
          - business_industry_id
          - monthly_volume
          - source_of_fund_id
          - third_party_fund_usage
          properties:
            purpose_id:
              type: integer
              description: Unique identifier for account purpose retrieved from the catalogue API [List Account Purposes](https://developer.fin.com/api-reference/catalogue/list-account-purposes).
              example: 10
            other_purpose:
              type: string
              description: Custom purpose description (only when purpose_id represents "Other")
              example: custom other purpose
            business_industry_id:
              type: integer
              description: Unique identifier for business industry retrieved from the catalogue API [List Industries](https://developer.fin.com/api-reference/catalogue/list-industries)
              example: 1
            monthly_volume:
              type: integer
              minimum: 0
              description: Expected monthly transaction volume in USD (not cents)
              example: 100000
            source_of_fund_id:
              type: integer
              description: Unique identifier for source of funds retrieved from the catalogue API [List Source of Funds](https://developer.fin.com/api-reference/catalogue/list-source-of-funds)
              example: 13
            third_party_fund_usage:
              type: boolean
              description: Indicates whether this customer will be moving other people's money (third-party funds)
              example: false
        addresses:
          type: object
          required:
          - is_incorporated_address_same
          - incorporated_address
          properties:
            is_incorporated_address_same:
              type: boolean
              description: Whether the physical address is the same as the incorporated address
              example: true
            incorporated_address:
              type: object
              required:
              - street
              - city
              - state
              - postal_code
              - country
              properties:
                street:
                  type: string
                  description: Street address
                  example: '10 Anson Road #26-04 International Plaza'
                city:
                  type: string
                  description: City name
                  example: Singapore
                state:
                  type: string
                  description: State or province. Required. Must be an ISO 3166-2 subdivision code (e.g. US-CA, BD-13).
                  example: SG-01
                postal_code:
                  type: string
                  description: Postal or ZIP code
                  example: 079903
                country:
                  $ref: '#/components/schemas/CountryCode'
            physical_address:
              type: object
              description: Physical operating address (required only if is_incorporated_address_same is false)
              required:
              - street
              - city
              - state
              - postal_code
              - country
              properties:
                street:
                  type: string
                  example: 456 Market Street Floor 3
                city:
                  type: string
                  example: San Francisco
                state:
                  type: string
                  description: State or province. Required. Must be an ISO 3166-2 subdivision code (e.g. US-CA, BD-13).
                  example: US-CA
                postal_code:
                  type: string
                  example: '94103'
                country:
                  $ref: '#/components/schemas/CountryCode'
        associated_parties:
          type: array
          description: Array of associated parties (UBOs, directors, shareholders, etc.)
          minItems: 1
          items:
            type: object
            required:
            - basic_info
            - address
            - ownership_info
            properties:
              basic_info:
                type: object
                required:
                - first_name
                - last_name
                - dob
                - email
                - phone
                - country_of_residence
                - nationality
                - tin
                properties:
                  first_name:
                    type: string
                    example: John
                  last_name:
                    type: string
                    example: Doe
                  dob:
                    type: string
                    format: date
                    example: '1985-03-20'
                  email:
                    type: string
                    format: email
                    example: john.doe@acmecorp.com
                  phone:
                    type: string
                    example: '+14155551234'
                  country_of_residence:
                    $ref: '#/components/schemas/CountryCode'
                  nationality:
                    $ref: '#/components/schemas/CountryCode'
                  tin:
                    type: string
                    description: Tax Identification Number
                    example: 123-45-6789
              address:
                type: object
                required:
                - street
                - city
                - state
                - postal_code
                - country
                properties:
                  street:
                    type: string
                    example: 456 Oak Avenue
                  city:
                    type: string
                    example: San Francisco
                  state:
                    type: string
                    description: State or province. Required. Must be an ISO 3166-2 subdivision code (e.g. US-CA, BD-13).
                    example: US-CA
                  postal_code:
                    type: string
                    example: '94102'
                  country:
                    $ref: '#/components/schemas/CountryCode'
              ownership_info:
                type: object
                required:
                - designation
                - percentage_of_ownership
                - relationship_establishment_date
                properties:
                  designation:
                    type: string
                    description: Role or position in the company (e.g., CEO, Director, UBO)
                    example: CEO
                  percentage_of_ownership:
                    type: number
                    format: float
                    minimum: 0
                    description: Percentage of ownership in the business. Total must be < 100.
                    example: 75
                  relationship_establishment_date:
                    type: string
                    format: date
                    description: Date when the relationship was established in YYYY-MM-DD format
                    example: '2018-06-15'
        meta_data:
          type: object
          additionalProperties: true
          description: Additional custom metadata as key-value pairs
          example:
            reference: ref-20250910-XYZ
    V2RegulatedActivity:
      type: object
      required:
      - description
      - primary_authority_country_code
      - primary_authority_name
      - license_number
      properties:
        description:
          type: string
          description: Description of the regulated activity.
          example: Licensed money transmitter operating under FinCEN registration and state-level MSB licenses
        primary_authority_country_code:
          $ref: '#/components/schemas/CountryCode'
        primary_authority_name:
          type: string
          description: Name of the primary regulatory authority.
          example: FinCEN
        license_number:
          type: string
          description: Regulatory license or registration number.
          example: MSB-12345678
    V2AssociatedParty:
      type: object
      required:
      - basic_info
      - address
      - roles
      properties:
        ref:
          type: string
          description: Client-defined reference identifier for this party. Used for internal tracking only.
          example: owner-001
        basic_info:
          $ref: '#/components/schemas/V2APBasicInfo'
        address:
          $ref: '#/components/schemas/V2Address'
        roles:
          type: array
          description: Roles held by this party. At least one role is required. A party may hold both roles simultaneously. At least one party must hold both shareholder and ubo.
          minItems: 1
          items:
            type: string
            enum:
            - shareholder
            - ubo
          example:
          - shareholder
          - ubo
        ownership_info:
          $ref: '#/components/schemas/V2OwnershipInfo'
    V2FormationDocumentItem:
      type: object
      required:
      - files
      properties:
        type:
          type: string
          enum:
          - REGISTRATION_DOCUMENT
          - CONSTITUTIONAL_DOCUMENT
          - FORMATION_DOCUMENT
          - PROOF_OF_TAX_IDENTIFICATION
          - EVIDENCE_OF_DIRECTORS_AND_CONTROLLERS
          description: Formation document type.
          example: REGISTRATION_DOCUMENT
        description:
          type: string
          description: Optional human-readable description of this specific document.
          example: Certificate of Incorporation
        files:
          type: array
          description: One or more file URIs obtained from [Upload Document](https://developer.fin.com/api-reference/customers/upload-document) endpoint.
          minItems: 1
          items:
            type: object
            required:
            - uri
            properties:
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727639.pdf
    CreateBusinessCustomerV2Input:
      type: object
      required:
      - verification_type
      - industry_codes
      - basic_info
      - financial_profile
      - addresses
      - associated_parties
      properties:
        verification_type:
          type: string
          enum:
          - STANDARD
          - RELIANCE
          description: Verification level. Defaults to STANDARD if omitted. RELIANCE must be explicitly enabled for your client.
          example: STANDARD
        industry_codes:
          type: array
          description: NAICS 2022 6-digit industry codes. Min 1 item. See the full list at [Business-industry-codes](https://developer.fin.com/business-industry-codes).
          minItems: 1
          items:
            type: string
          example:
          - '523130'
        basic_info:
          $ref: '#/components/schemas/V2BasicInfo'
        financial_profile:
          $ref: '#/components/schemas/V2FinancialProfile'
        addresses:
          $ref: '#/components/schemas/V2Addresses'
        associated_parties:
          type: array
          description: UBOs (≥25% ownership), directors, and authorized signatories. Min 1 item required.
          minItems: 1
          items:
            $ref: '#/components/schemas/V2AssociatedParty'
        holding_structure:
          $ref: '#/components/schemas/V2HoldingStructure'
        public_listings:
          type: array
          description: Stock exchange listings. Required for publicly traded companies.
          items:
            $ref: '#/components/schemas/V2PublicListing'
        compliance:
          $ref: '#/components/schemas/V2Compliance'
        meta_data:
          type: object
          description: Client-defined key-value metadata for internal tracking.
          properties:
            reference:
              type: string
              description: Client-defined external reference identifier.
              example: REF-20250123-ACME
          additionalProperties: true
    V2IndividualIdentifyingDocument:
      type: object
      required:
      - country_code
      - document_type
      - document_id
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        document_type:
          type: string
          description: Individual tax ID document type, validated per country. See all available types at [Individual Tax ID documents](https://developer.fin.com/guides/compliance-and-regulatory/individual-tax-id-documents).
          example: TIN
        document_id:
          type: string
          description: The document ID or number. Format validated per country and document type.
          example: '1234567890123'
    ProofOfAddressIndividual:
      type: object
      description: The proof of address document must not be older than three months.
      required:
      - type
      - country
      - files
      properties:
        type:
          type: string
          enum:
          - PASSPORT
          - NATIONAL_ID
          - DRIVERS_LICENSE
          - RESIDENCE_PERMIT
          - UTILITY_BILL
          - GOVERNMENT_LETTER
          - BANK_STATEMENT
          example: UTILITY_BILL
        country:
          $ref: '#/components/schemas/CountryCode'
        files:
          type: array
          items:
            type: object
            required:
            - uri
            properties:
              uri:
                type: string
                example: /AbAcQ4hn_0652746727638.pdf
    CreateIndividualCustomerV2Input:
      type: object
      required:
      - verification_type
      - basic_info
      - address
      - financial_profile
      properties:
        verification_type:
          type: string
          enum:
          - STANDARD
          - RELIANCE
          example: STANDARD
        basic_info:
          type: object
          required:
          - first_name
          - last_name
          - dob
          - email
          - phone
          - country_of_residence
          - primary_nationality
          - tax_info
          properties:
            first_name:
              type: string
              example: Maria
            first_name_en:
              type: string
              description: English transliteration. Required if first_name contains non-ASCII characters.
              example: Maria
            middle_name:
              type: string
              example: Elena
            middle_name_en:
              type: string
              description: English transliteration. Required if middle_name contains non-ASCII characters.
              example: Elena
            last_name:
              type: string
              example: Garcia
            last_name_en:
              type: string
              description: English transliteration. Required if last_name contains non-ASCII characters.
              example: Garcia
            dob:
              type: string
              format: date
              description: Date of birth in YYYY-MM-DD format. Age must be between 18 and 120 years.
              example: '1990-04-15'
            email:
              type: string
              format: email
              description: Must be all lowercase.
              example: maria.garcia@example.com
            phone:
              type: string
              description: E.164 format.
              example: '+14155552671'
            country_of_residence:
              $ref: '#/components/schemas/CountryCode'
            primary_nationality:
              $ref: '#/components/schemas/CountryCode'
            secondary_nationality:
              $ref: '#/components/schemas/CountryCode'
            gender:
              type: string
              enum:
              - MALE
              - FEMALE
              example: FEMALE
            tax_info:
              type: array
              minItems: 1
              description: Tax identification documents. Each entry must have a unique document_id.
              items:
                type: object
                required:
                - country_code
                - document_type
                - document_id
                properties:
                  country_code:
                    $ref: '#/components/schemas/CountryCode'
                  document_type:
                    type: string
                    description: Tax document type (e.g. SSN, TIN).
                    example: SSN
                  document_id:
                    type: string
                    example: 123-45-6789
        address:
          type: object
          required:
          - street_line_1
          - city
          - subdivision_code
          - postal_code
          - country
          properties:
            street_line_1:
              type: string
              example: 123 Market Street
            street_line_1_en:
              type: string
              description: English transliteration. Required if street_line_1 contains non-ASCII characters.
              example: 123 Market Street
            street_line_2:
              type: string
              example: Apt 4B
            street_line_2_en:
              type: string
              description: English transliteration. Required if street_line_2 contains non-ASCII characters.
              example: Apt 4B
            city:
              type: string
              example: San Francisco
            subdivision_code:
              type: string
              description: ISO 3166-2 subdivision code (e.g. US-CA).
              example: US-CA
            postal_code:
              type: string
              example: '94103'
            country:
              $ref: '#/components/schemas/CountryCode'
        financial_profile:
          type: object
          required:
          - employment_status
          - occupation_id
          - purpose_id
          - source_of_fund_ids
          - monthly_volume_usd
          properties:
            employment_status:
              type: string
              enum:
              - EMPLOYED
              - SELF_EMPLOYED
              - RETIRED
              - STUDENT
              - UNEMPLOYED
              description: Employment status of the individual.
              example: EMPLOYED
            occupation_id:
              type: integer
              description: Occupation. FK to occupations reference table. Fetch valid values from GET /v1/occupations?type=INDIVIDUAL.
              example: 42
            purpose_id:
              type: integer
              description: Account purpose. FK to purposes reference table. Fetch valid values from GET /v1/purposes?type=INDIVIDUAL.
              example: 3
            purpose_remarks:
              type: string
              example: Personal remittances to family
            source_of_fund_ids:
              type: array
              minItems: 1
              items:
                type: integer
              description: Source(s) of funds. FK array to source_of_funds reference table. Fetch valid values from GET /v1/source-of-funds?type=INDIVIDUAL.
              example:
              - 1
              - 5
            source_of_funds_description:
              type: string
              example: Monthly salary from employment
            monthly_volume_usd:
              type: integer
              minimum: 0
              example: 5000
        meta_data:
          type: object
          additionalProperties: true
          example:
            reference: client-ref-abc-001
    V2Address:
      type: object
      required:
      - street_line_1
      - street_line_1_en
      - city
      - state
      - subdivision_code
      - postal_code
      - country
      properties:
        street_line_1:
          type: string
          description: Primary street address. P.O. Box addresses are not accepted.
          example: 123 Main Street
        street_line_1_en:
          type: string
          description: English translation of street_line_1. Required if address contains non-ASCII characters.
          example: 123 Main Street
        street_line_2:
          type: string
          description: Secondary address (suite, floor, unit, etc.). Optional.
          example: Suite 400
        street_line_2_en:
          type: string
          description: English translation of street_line_2. Optional.
          example: Suite 400
        city:
          type: string
          maxLength: 100
          description: City or municipality name.
          example: San Francisco
        state:
          type: string
          description: State or province. Required. Must be an ISO 3166-2 subdivision code (e.g. US-CA, BD-13).
          example: US-CA
        subdivision_code:
          type: string
          description: State/province code from [List Subdivisions](https://developer.fin.com/api-reference/catalogue/list-subdivisions). Same value as state field.
          example: US-CA
        postal_code:
          type: string
          description: ZIP or postal code. Format validated per country.
          example: '94105'
        country:
          $ref: '#/components/schemas/CountryCode'
    AttachDocumentsToBusinessCustomerV2Input:
      type: object
      required:
      - tos_policies_value
      properties:
        formation_documents:
          type: array
          description: Documents proving the legal existence of the business (e.g., Certificate of Incorporation, Articles of Incorporation, Trust Agreement, Tax registration certificate).
          items:
            $ref: '#/components/schemas/V2FormationDocumentItem'
        ownership_documents:
          type: array
          description: Documents proving who controls and owns the business (e.g., Shareholder Register, Org Chart, Power of Attorney, Directors Registry).
          items:
            $ref: '#/components/schemas/V2OwnershipDocumentItem'
        supporting_documents:
          type: array
          description: Additional compliance and operational documents (e.g., Proof of Address, Proof of Source of Funds, AML Comfort Letter, Marketing Materials).
          items:
            $ref: '#/components/schemas/V2SupportingDocumentItem'
        tos_policies_value:
          type: string
          description: Parsed from the tos_policies_value query parameter in the tos_policies_url returned by POST /v2/customers/business. Signifies the customer has accepted the Terms of Service.
          example: f11e77c6-8dc0-4d4b-a3f2-ed84c8ccfc69
    IndividualCustomerDetail:
      type: object
      title: Individual
      properties:
        customer_id:
          type: string
          format: uuid
          example: 56c41b8e-e650-4f55-94f6-26a888a9b64d
        type:
          type: string
          enum:
          - INDIVIDUAL
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@fin.com
        phone:
          type: string
          example: '+14724480512'
        country_of_residence:
          type: string
          example: USA
        verification_type:
          type: string
          example: STANDARD
        customer_status:
          type: string
          example: ON_HOLD
        tos_policies_url:
          type: string
