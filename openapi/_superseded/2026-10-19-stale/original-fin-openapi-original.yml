    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        access_token_ttl:
          type: string
          format: date-time
          example: '2025-12-28 10:34:45+00'
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token_ttl:
          type: string
          format: date-time
          example: '2025-12-28 10:34:45+00'
        current_time:
          type: string
          format: date-time
          example: '2025-12-21 10:34:45+00'
    CreateBusinessCustomerV2Input:
      type: object
      required:
        - verification_type
        - industry_codes
        - basic_info
        - financial_profile
        - addresses
        - associated_parties
      properties:
        verification_type:
          type: string
          enum:
            - STANDARD
            - RELIANCE
          description: >-
            Verification level. Defaults to STANDARD if omitted. RELIANCE must
            be explicitly enabled for your client.
          example: STANDARD
        industry_codes:
          type: array
          description: >-
            NAICS 2022 6-digit industry codes. Min 1 item. See the full list at
            [Business-industry-codes](https://developer.fin.com/business-industry-codes).
          minItems: 1
          items:
            type: string
          example:
            - '523130'
        basic_info:
          $ref: '#/components/schemas/V2BasicInfo'
        financial_profile:
          $ref: '#/components/schemas/V2FinancialProfile'
        addresses:
          $ref: '#/components/schemas/V2Addresses'
        associated_parties:
          type: array
          description: >-
            UBOs (≥25% ownership), directors, and authorized signatories. Min 1
            item required.
          minItems: 1
          items:
            $ref: '#/components/schemas/V2AssociatedParty'
        holding_structure:
          $ref: '#/components/schemas/V2HoldingStructure'
        public_listings:
          type: array
          description: Stock exchange listings. Required for publicly traded companies.
          items:
            $ref: '#/components/schemas/V2PublicListing'
        compliance:
          $ref: '#/components/schemas/V2Compliance'
        meta_data:
          type: object
          description: Client-defined key-value metadata for internal tracking.
          properties:
            reference:
              type: string
              description: Client-defined external reference identifier.
              example: REF-20250123-ACME
          additionalProperties: true
    V2BasicInfo:
      type: object
      required:
        - legal_name
        - legal_name_en
        - trade_name
        - description
        - entity_type
        - email
        - phone
        - incorporation_date
        - country_of_incorporation
        - registration_number
        - tax_info
        - websites
      properties:
        legal_name:
          type: string
          maxLength: 255
          description: >-
            Official registered business name. Must match incorporation
            documents.
          example: Fin.com
        legal_name_en:
          type: string
          description: >-
            English translation of the legal name. Required if legal_name
            contains non-ASCII characters.
          example: Fin.com
        trade_name:
          type: string
          description: Common operating name or DBA (Doing Business As).
          example: Toronggo
        trade_name_en:
          type: string
          description: English translation of the trade name.
          example: Toronggo
        description:
          type: string
          maxLength: 500
          description: Description of the company's business activities and purpose.
          example: >-
            Bangladesh-based technology company providing cross-border B2B
            payment and financial technology services
        entity_type:
          type: string
          enum:
            - LIMITED_LIABILITY_COMPANY
            - PUBLICLY_LISTED_COMPANY
            - SOLE_PROPRIETOR
            - PARTNERSHIP
            - CORPORATION
            - TRUST
            - PRIVATE_FOUNDATION
            - CHARITY
            - NONPROFIT_ORGANIZATION
            - PUBLIC_AGENCY_OR_AUTHORITY
          description: Legal entity type of the business.
          example: LIMITED_LIABILITY_COMPANY
        email:
          type: string
          format: email
          description: Business email address. Must be all lowercase.
          example: m@tech.com
        phone:
          type: string
          description: Business phone number in E.164 format.
          example: '+8801529876543'
        incorporation_date:
          type: string
          format: date
          description: Date of incorporation in YYYY-MM-DD format. Cannot be a future date.
          example: '2018-06-15'
        country_of_incorporation:
          $ref: '#/components/schemas/CountryCode'
        registration_number:
          type: string
          description: Business registration or company number. Required.
          example: 12-3456789
        legal_entity_identifier:
          type: string
          minLength: 20
          maxLength: 20
          description: LEI code (20-character alphanumeric). Optional.
          example: 549300EXAMPLE0001X23
        is_dao:
          type: boolean
          description: Whether the entity is a Decentralized Autonomous Organization.
          example: false
        tax_info:
          type: array
          description: Tax and identifying documents for the business. Min 1 item.
          minItems: 1
          items:
            $ref: '#/components/schemas/V2IdentifyingDocument'
        websites:
          type: array
          description: Business website URLs. Min 1 item.
          minItems: 1
          items:
            type: string
            format: uri
          example:
            - https://fin.com
    V2IdentifyingDocument:
      type: object
      required:
        - country_code
        - document_type
        - document_id
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        document_type:
          type: string
          description: >-
            Business tax ID document type, validated per country. Examples: EIN,
            TIN, VAT_ID, TAX_ID, etc. See all available types at [Business tax
            id documents by
            region](https://developer.fin.com/business-tax-id-documents-by-region).
          example: EIN
        document_id:
          type: string
          description: >-
            The document ID or number. Format validated per country and document
            type.
          example: 12-3456789
    V2IndividualIdentifyingDocument:
      type: object
      required:
        - country_code
        - document_type
        - document_id
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        document_type:
          type: string
          description: >-
            Individual tax ID document type, validated per country. See all
            available types at [Individual Tax ID
            documents](https://developer.fin.com/guides/compliance-and-regulatory/individual-tax-id-documents).
          example: TIN
        document_id:
          type: string
          description: >-
            The document ID or number. Format validated per country and document
            type.
          example: '1234567890123'
    V2FinancialProfile:
      type: object
      required:
        - purpose_id
        - source_of_fund_ids
        - source_of_wealth_ids
        - estimated_annual_revenue_usd
        - expected_monthly_deposits_usd
        - expected_monthly_withdrawals_usd
        - third_party_fund_usage
      properties:
        purpose_id:
          type: integer
          description: >-
            Account purpose. Foreign key to purposes reference table. Fetch
            valid values from [List Account
            Purposes](https://developer.fin.com/api-reference/catalogue/list-account-purposes)
            endpoint.
          example: 3
        purpose_remarks:
          type: string
          description: >-
            Additional context for the account purpose. Required if purpose
            represents "Other".
          example: Cross-border B2B payments for international suppliers
        source_of_fund_ids:
          type: array
          description: >-
            Source(s) of business funds. FK array to source_of_funds reference
            table. Min 1 item. Fetch valid values from [List Source of
            Funds](https://developer.fin.com/api-reference/catalogue/list-source-of-funds).
            Order items from the largest to smallest contributor. The ID
            representing the primary source of funds must come first, followed
            by secondary sources in descending order.
          minItems: 1
          items:
            type: integer
          example:
            - 1
            - 4
        source_of_funds_description:
          type: string
          description: Additional context for source of funds.
          example: Revenue from software licensing and SaaS subscriptions
        source_of_wealth_ids:
          type: array
          description: >-
            Source(s) of owner's wealth. FK array to source_of_wealth reference
            table. Min 1 item. Fetch valid values from [List Source of
            Wealth](https://developer.fin.com/api-reference/catalogue/list-source-of-wealth).
            Order items from the largest to smallest contributor. The primary
            source must come first.
          minItems: 1
          items:
            type: integer
          example:
            - 2
        estimated_annual_revenue_usd:
          type: integer
          minimum: 0
          description: Estimated annual revenue in USD (not cents). Must be >= 0.
          example: 5000000
        expected_monthly_deposits_usd:
          type: integer
          minimum: 0
          description: Expected monthly deposit volume in USD (not cents). Must be >= 0.
          example: 400000
        expected_monthly_withdrawals_usd:
          type: integer
          minimum: 0
          description: Expected monthly withdrawal volume in USD (not cents). Must be >= 0.
          example: 350000
        expected_transaction_value_usd:
          type: integer
          minimum: 0
          description: Typical single transaction value in USD (not cents). Optional.
          example: 50000
        expected_monthly_transaction_count:
          type: integer
          minimum: 0
          description: Expected number of transactions per month. Optional.
          example: 20
        third_party_fund_usage:
          type: boolean
          description: >-
            Whether this business will process, hold, or move funds on behalf of
            other parties. Set to true only for MSBs and payment processors.
            Triggers enhanced compliance review.
          example: false
    V2Addresses:
      type: object
      required:
        - is_incorporated_address_same
        - incorporated_address
      properties:
        is_incorporated_address_same:
          type: boolean
          description: >-
            Whether the physical operating address is the same as the
            incorporated address. If false, physical_address is required.
          example: false
        incorporated_address:
          $ref: '#/components/schemas/V2Address'
        physical_address:
          allOf:
            - $ref: '#/components/schemas/V2Address'
          description: >-
            Physical operating address. Required when
            is_incorporated_address_same is false.
    V2Address:
      type: object
      required:
        - street_line_1
        - street_line_1_en
        - city
        - state
        - subdivision_code
        - postal_code
        - country
      properties:
        street_line_1:
          type: string
          description: Primary street address. P.O. Box addresses are not accepted.
          example: 123 Main Street
        street_line_1_en:
          type: string
          description: >-
            English translation of street_line_1. Required if address contains
            non-ASCII characters.
          example: 123 Main Street
        street_line_2:
          type: string
          description: Secondary address (suite, floor, unit, etc.). Optional.
          example: Suite 400
        street_line_2_en:
          type: string
          description: English translation of street_line_2. Optional.
          example: Suite 400
        city:
          type: string
          maxLength: 100
          description: City or municipality name.
          example: San Francisco
        state:
          type: string
          description: >-
            State or province. Required. Must be an ISO 3166-2 subdivision code
            (e.g. US-CA, BD-13).
          example: US-CA
        subdivision_code:
          type: string
          description: >-
            State/province code from [List
            Subdivisions](https://developer.fin.com/api-reference/catalogue/list-subdivisions).
            Same value as state field.
          example: US-CA
        postal_code:
          type: string
          description: ZIP or postal code. Format validated per country.
          example: '94105'
        country:
          $ref: '#/components/schemas/CountryCode'
    V2AssociatedParty:
      type: object
      required:
        - basic_info
        - address
        - roles
      properties:
        ref:
          type: string
          description: >-
            Client-defined reference identifier for this party. Used for
            internal tracking only.
          example: owner-001
        basic_info:
          $ref: '#/components/schemas/V2APBasicInfo'
        address:
          $ref: '#/components/schemas/V2Address'
        roles:
          type: array
          description: >-
            Roles held by this party. At least one role is required. A party may
            hold both roles simultaneously. At least one party must hold both
            shareholder and ubo.
          minItems: 1
          items:
            type: string
            enum:
              - shareholder
              - ubo
          example:
            - shareholder
            - ubo
        ownership_info:
          $ref: '#/components/schemas/V2OwnershipInfo'
    V2APBasicInfo:
      type: object
      required:
        - first_name
        - first_name_en
        - last_name
        - last_name_en
        - dob
        - email
        - phone
        - country_of_residence
        - primary_nationality
        - tax_info
      properties:
        first_name:
          type: string
          maxLength: 50
          description: First name.
          example: John
        first_name_en:
          type: string
          description: >-
            English transliteration of first name. Required if name contains
            non-ASCII characters.
          example: John
        middle_name:
          type: string
          description: Middle name(s). Optional.
          example: Michael
        middle_name_en:
          type: string
          description: English transliteration of middle name. Optional.
          example: Michael
        last_name:
          type: string
          maxLength: 50
          description: Last or family name.
          example: Doe
        last_name_en:
          type: string
          description: >-
            English transliteration of last name. Required if name contains
            non-ASCII characters.
          example: Doe
        dob:
          type: string
          format: date
          description: >-
            Date of birth in YYYY-MM-DD format. Party must be at least 18 years
            old.
          example: '1985-03-20'
        email:
          type: string
          format: email
          description: >-
            Personal email address. Must be unique across all associated parties
            in the same request.
          example: john.doe@acmecorp.com
        phone:
          type: string
          description: Personal phone number in E.164 format.
          example: '+14155551234'
        country_of_residence:
          $ref: '#/components/schemas/CountryCode'
        primary_nationality:
          $ref: '#/components/schemas/CountryCode'
        secondary_nationality:
          allOf:
            - $ref: '#/components/schemas/CountryCode'
          description: Secondary nationality for dual citizens. Optional.
        tax_info:
          type: array
          description: >-
            Tax and identifying documents for this individual.  See all
            available individual tax ID document types at [Individual Tax ID
            documents](https://developer.fin.com/guides/compliance-and-regulatory/individual-tax-id-documents).
          items:
            $ref: '#/components/schemas/V2IndividualIdentifyingDocument'
    V2OwnershipInfo:
      type: object
      description: Required when roles includes ubo.
      required:
        - designation
        - percentage_of_ownership
        - relationship_establishment_date
        - has_control
        - is_signer
        - is_director
      properties:
        designation:
          type: string
          maxLength: 100
          description: Title or position in the company (e.g., CEO, CFO, Founder).
          example: CEO
        percentage_of_ownership:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: >-
            Ownership stake as a percentage (0 to 100). Individual parties may
            have 0% ownership. Total across all parties must be < 100%.
          example: 75
        relationship_establishment_date:
          type: string
          format: date
          description: >-
            Date when the relationship with the business began. Format:
            YYYY-MM-DD. Cannot be a future date.
          example: '2018-06-15'
        has_control:
          type: boolean
          description: Whether this party has significant control over the entity.
          example: true
        is_signer:
          type: boolean
          description: Whether this party is an authorized signatory.
          example: true
        is_director:
          type: boolean
          description: Whether this party serves as a director.
          example: true
    V2PublicListing:
      type: object
      properties:
        mic:
          type: string
          description: ISO 10383 Market Identifier Code (e.g., XNAS for NASDAQ).
          example: XNAS
        isin:
          type: string
          minLength: 12
          maxLength: 12
          description: International Securities Identification Number (12 chars).
          example: US0231351067
        ticker_symbol:
          type: string
          description: Stock exchange ticker symbol.
          example: ACME
    V2HoldingStructure:
      type: object
      properties:
        has_material_intermediary_ownership:
          type: boolean
          description: Whether any intermediary holds a material ownership stake.
          example: true
        corporate_shareholders:
          type: array
          description: List of corporate (non-individual) shareholders.
          items:
            $ref: '#/components/schemas/V2CorporateShareholder'
        foreign_branches:
          type: array
          description: List of foreign branch registrations.
          items:
            $ref: '#/components/schemas/V2ForeignBranch'
    V2CorporateShareholder:
      type: object
      required:
        - entity_name
        - entity_name_en
        - registration_country_code
        - ownership_percentage
      properties:
        entity_name:
          type: string
          description: Corporate shareholder's legal name.
          example: Acme Ventures LLC
        entity_name_en:
          type: string
          description: >-
            English translation of entity name. Required if entity_name contains
            non-ASCII characters.
          example: Acme Ventures LLC
        registration_country_code:
          $ref: '#/components/schemas/CountryCode'
        ownership_percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Ownership stake as a percentage (0 to 100).
          example: 60
        registration_number:
          type: string
          description: Entity registration number. Optional.
          example: 98-7654321
        entity_type:
          type: string
          enum:
            - LIMITED_LIABILITY_COMPANY
            - PUBLICLY_LISTED_COMPANY
            - SOLE_PROPRIETOR
            - PARTNERSHIP
            - CORPORATION
            - TRUST
            - PRIVATE_FOUNDATION
            - CHARITY
            - NONPROFIT_ORGANIZATION
            - PUBLIC_AGENCY_OR_AUTHORITY
          description: Legal entity type of the corporate shareholder. Optional.
          example: LIMITED_LIABILITY_COMPANY
        incorporation_date:
          type: string
          format: date
          description: Incorporation date in YYYY-MM-DD format. Optional.
          example: '2015-03-01'
    V2ForeignBranch:
      type: object
      required:
        - registration_country_code
      properties:
        registration_country_code:
          $ref: '#/components/schemas/CountryCode'
        name:
          type: string
          description: Branch name. Optional.
          example: Acme Corp UK Branch
        registration_number:
          type: string
          description: Branch registration number. Optional.
          example: BR000123
    V2Compliance:
      type: object
      properties:
        operates_in_prohibited_countries:
          type: boolean
          description: Whether the business operates in OFAC/sanctioned countries.
          example: false
        additional_description_for_compliance_screening:
          type: string
          description: Free-text compliance notes for manual review.
          example: We do not operate in any OFAC-sanctioned jurisdictions.
        risk_profile:
          $ref: '#/components/schemas/V2RiskProfile'
        regulated_activity:
          $ref: '#/components/schemas/V2RegulatedActivity'
        aml:
          $ref: '#/components/schemas/V2AML'
    V2RiskProfile:
      type: object
      properties:
        high_risk_activities:
          type: array
          description: >-
            High-risk activities the business engages in. If non-empty,
            high_risk_activities_explanation is required.
          items:
            type: string
            enum:
              - adult_entertainment
              - crypto_exchange
              - gambling
              - cannabis
              - weapons
              - money_services
              - cross_border_payments
          example:
            - cross_border_payments
        high_risk_activities_explanation:
          type: string
          description: >-
            Explanation of declared high-risk activities. Required when
            high_risk_activities is non-empty.
          example: >-
            We facilitate cross-border B2B payments, subject to enhanced due
            diligence procedures.
        conducts_money_services:
          type: boolean
          description: Whether the business provides money services.
          example: true
        conducts_money_services_via_fin:
          type: boolean
          description: Whether money services are provided via financial intermediaries.
          example: false
        conducts_money_services_description:
          type: string
          description: Details about the money services offered.
          example: >-
            Licensed money transmitter providing international wire transfer
            services.
    V2RegulatedActivity:
      type: object
      required:
        - description
        - primary_authority_country_code
        - primary_authority_name
        - license_number
      properties:
        description:
          type: string
          description: Description of the regulated activity.
          example: >-
            Licensed money transmitter operating under FinCEN registration and
            state-level MSB licenses
        primary_authority_country_code:
          $ref: '#/components/schemas/CountryCode'
        primary_authority_name:
          type: string
          description: Name of the primary regulatory authority.
          example: FinCEN
        license_number:
          type: string
          description: Regulatory license or registration number.
          example: MSB-12345678
    V2AML:
      type: object
      properties:
        supervisory_authority_name:
          type: string
          description: Name of the AML supervisory authority.
          example: FinCEN
        license_number:
          type: string
          description: AML license number.
          example: MSB-12345678
        has_appointed_mlro:
          type: boolean
          description: Whether a Money Laundering Reporting Officer has been appointed.
          example: true
        customer_risk_split:
          $ref: '#/components/schemas/V2CustomerRiskSplit'
        prohibits_anonymous_or_fictitious_accounts:
          type: boolean
          description: Policy on anonymous or fictitious accounts.
          example: true
        prohibits_accounts_for_unlicensed_or_shell_customers:
          type: boolean
          description: Policy on unlicensed or shell customers.
          example: true
        customer_identity_verification:
          $ref: '#/components/schemas/V2VerificationMethod'
        pep_and_sanctions_screening:
          $ref: '#/components/schemas/V2VerificationMethod'
        sanction_lists:
          type: array
          description: Names of sanction lists screened against.
          items:
            type: string
          example:
            - OFAC
            - EU
            - UN
            - HMT
        customer_risk_classification_from_due_diligence:
          type: boolean
          example: true
        enhanced_due_diligence_process:
          type: boolean
          example: true
        transaction_monitoring:
          $ref: '#/components/schemas/V2VerificationMethod'
        procedures_for_transaction_monitoring:
          type: boolean
          example: true
        subject_to_ml_or_tf_investigation:
          type: string
          description: Current ML/TF investigation status.
          example: none
        subject_to_regulatory_enforcement_past_2_years:
          type: string
          description: Regulatory enforcement history over the last 2 years.
          example: none
        confirms_no_service_to_sanctioned_countries:
          type: boolean
          example: true
        client_funds_accessibility:
          type: string
          description: Policy on client fund accessibility.
          example: closed_loop
        aml_ctf_audit_completed:
          type: boolean
          example: true
        planned_audit_date:
          type: string
          format: date
          description: Planned next audit date in YYYY-MM-DD format.
          example: '2026-12-01'
    V2CustomerRiskSplit:
      type: object
      description: Breakdown of customer risk classifications. Percentages must sum to 100.
      required:
        - low_risk
        - medium_risk
        - high_risk
      properties:
        low_risk:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of low-risk customers.
          example: 70
        medium_risk:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of medium-risk customers.
          example: 25
        high_risk:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of high-risk customers.
          example: 5
    V2VerificationMethod:
      type: object
      description: >-
        Used for customer_identity_verification, pep_and_sanctions_screening,
        and transaction_monitoring.
      required:
        - method
        - system
      properties:
        method:
          type: string
          description: Verification method (e.g., automated, manual, third_party).
          example: automated
        system:
          type: string
          description: System or vendor used (e.g., Jumio, Onfido, Internal).
          example: Jumio
    CreateBusinessCustomerInput:
      type: object
      required:
        - basic_info
        - financial_profile
        - addresses
        - associated_parties
      properties:
        verification_type:
          type: string
          enum:
            - STANDARD
            - RELIANCE
          description: >-
            Type of verification to perform (optional, defaults to STANDARD).
            Note that RELIANCE verification must be enabled for your client, or
            you will receive a 423 error.
          example: RELIANCE
        basic_info:
          type: object
          required:
            - business_name
            - description
            - entity_type
            - website
            - email
            - incorporation_date
            - phone
            - country_of_incorporation
            - registration_number
            - tax_id
          properties:
            business_name:
              type: string
              description: Legal name of the business
              example: Acme Corp Ltd
            business_trade_name:
              type: string
              description: Trading name or DBA (Doing Business As) name
              example: Acme
            description:
              type: string
              description: Description of the company's business
              example: International software and payments company
            entity_type:
              type: string
              enum:
                - LIMITED_LIABILITY_COMPANY
                - PUBLICLY_LISTED_COMPANY
                - SOLE_PROPRIETOR
                - PARTNERSHIP
                - CORPORATION
                - TRUST
                - PRIVATE_FOUNDATION
                - CHARITY
                - NONPROFIT_ORGANIZATION
                - PUBLIC_AGENCY_OR_AUTHORITY
                - PRIVATE_LIMITED
              description: Legal entity type of the business
              example: LIMITED_LIABILITY_COMPANY
            website:
              type: string
              format: uri
              description: Company website URL
              example: https://fin.com
            email:
              type: string
              format: email
              description: >-
                Business email address. Must be all lowercase or a validation
                error will occur.
              example: contact@acmecorp.com
            incorporation_date:
              type: string
              format: date
              description: Date of incorporation in YYYY-MM-DD format
              example: '2018-06-15'
            phone:
              type: string
              description: Business phone number
              example: '+14155552671'
            country_of_incorporation:
              $ref: '#/components/schemas/CountryCode'
            registration_number:
              type: string
              description: Business registration number
              example: 12-3456789
            tax_id:
              type: string
              description: Tax identification number or EIN (must be EIN for USA)
              example: 12-3456789
        financial_profile:
          type: object
          required:
            - purpose_id
            - business_industry_id
            - monthly_volume
            - source_of_fund_id
            - third_party_fund_usage
          properties:
            purpose_id:
              type: integer
              description: >-
                Unique identifier for account purpose retrieved from the
                catalogue API [List Account
                Purposes](https://developer.fin.com/api-reference/catalogue/list-account-purposes).
              example: 10
            other_purpose:
              type: string
              description: >-
                Custom purpose description (only when purpose_id represents
                "Other")
              example: custom other purpose
            business_industry_id:
              type: integer
              description: >-
                Unique identifier for business industry retrieved from the
                catalogue API [List
                Industries](https://developer.fin.com/api-reference/catalogue/list-industries)
              example: 1
            monthly_volume:
              type: integer
              minimum: 0
              description: Expected monthly transaction volume in USD (not cents)
              example: 100000
            source_of_fund_id:
              type: integer
              description: >-
                Unique identifier for source of funds retrieved from the
                catalogue API [List Source of
                Funds](https://developer.fin.com/api-reference/catalogue/list-source-of-funds)
              example: 13
            third_party_fund_usage:
              type: boolean
              description: >-
                Indicates whether this customer will be moving other people's
                money (third-party funds)
              example: false
        addresses:
          type: object
          required:
            - is_incorporated_address_same
            - incorporated_address
          properties:
            is_incorporated_address_same:
              type: boolean
              description: >-
                Whether the physical address is the same as the incorporated
                address
              example: true
            incorporated_address:
              type: object
              required:
                - street
                - city
                - state
                - postal_code
                - country
              properties:
                street:
                  type: string
                  description: Street address
                  example: '10 Anson Road #26-04 International Plaza'
                city:
                  type: string
                  description: City name
                  example: Singapore
                state:
                  type: string
                  description: >-
                    State or province. Required. Must be an ISO 3166-2
                    subdivision code (e.g. US-CA, BD-13).
                  example: SG-01
                postal_code:
                  type: string
                  description: Postal or ZIP code
                  example: '079903'
                country:
                  $ref: '#/components/schemas/CountryCode'
            physical_address:
              type: object
              description: >-
                Physical operating address (required only if
                is_incorporated_address_same is false)
              required:
                - street
                - city
                - state
                - postal_code
                - country
              properties:
                street:
                  type: string
                  example: 456 Market Street Floor 3
                city:
                  type: string
                  example: San Francisco
                state:
                  type: string
                  description: >-
                    State or province. Required. Must be an ISO 3166-2
                    subdivision code (e.g. US-CA, BD-13).
                  example: US-CA
                postal_code:
                  type: string
                  example: '94103'
                country:
                  $ref: '#/components/schemas/CountryCode'
        associated_parties:
          type: array
          description: Array of associated parties (UBOs, directors, shareholders, etc.)
          minItems: 1
          items:
            type: object
            required:
              - basic_info
              - address
              - ownership_info
            properties:
              basic_info:
                type: object
                required:
                  - first_name
                  - last_name
                  - dob
                  - email
                  - phone
                  - country_of_residence
                  - nationality
                  - tin
                properties:
                  first_name:
                    type: string
                    example: John
                  last_name:
                    type: string
                    example: Doe
                  dob:
                    type: string
                    format: date
                    example: '1985-03-20'
                  email:
                    type: string
                    format: email
                    example: john.doe@acmecorp.com
                  phone:
                    type: string
                    example: '+14155551234'
                  country_of_residence:
                    $ref: '#/components/schemas/CountryCode'
                  nationality:
                    $ref: '#/components/schemas/CountryCode'
                  tin:
                    type: string
                    description: Tax Identification Number
                    example: 123-45-6789
              address:
                type: object
                required:
                  - street
                  - city
                  - state
                  - postal_code
                  - country
                properties:
                  street:
                    type: string
                    example: 456 Oak Avenue
                  city:
                    type: string
                    example: San Francisco
                  state:
                    type: string
                    description: >-
                      State or province. Required. Must be an ISO 3166-2
                      subdivision code (e.g. US-CA, BD-13).
                    example: US-CA
                  postal_code:
                    type: string
                    example: '94102'
                  country:
                    $ref: '#/components/schemas/CountryCode'
              ownership_info:
                type: object
                required:
                  - designation
                  - percentage_of_ownership
                  - relationship_establishment_date
                properties:
                  designation:
                    type: string
                    description: Role or position in the company (e.g., CEO, Director, UBO)
                    example: CEO
                  percentage_of_ownership:
                    type: number
                    format: float
                    minimum: 0
                    description: >-
                      Percentage of ownership in the business. Total must be <
                      100.
                    example: 75
                  relationship_establishment_date:
                    type: string
                    format: date
                    description: >-
                      Date when the relationship was established in YYYY-MM-DD
                      format
                    example: '2018-06-15'
        meta_data:
          type: object
          additionalProperties: true
          description: Additional custom metadata as key-value pairs
          example:
            reference: ref-20250910-XYZ
    CreateIndividualCustomerV2Input:
      type: object
      required:
        - verification_type
        - basic_info
        - address
        - financial_profile
      properties:
        verification_type:
          type: string
          enum:
            - STANDARD
            - RELIANCE
          example: STANDARD
        basic_info:
          type: object
          required:
            - first_name
            - last_name
            - dob
            - email
            - phone
            - country_of_residence
            - primary_nationality
            - tax_info
          properties:
            first_name:
              type: string
              example: Maria
            first_name_en:
              type: string
              description: >-
                English transliteration. Required if first_name contains
                non-ASCII characters.
              example: Maria
            middle_name:
              type: string
              example: Elena
            middle_name_en:
              type: string
              description: >-
                English transliteration. Required if middle_name contains
                non-ASCII characters.
              example: Elena
            last_name:
              type: string
              example: Garcia
            last_name_en:
              type: string
              description: >-
                English transliteration. Required if last_name contains
                non-ASCII characters.
              example: Garcia
            dob:
              type: string
              format: date
              description: >-
                Date of birth in YYYY-MM-DD format. Age must be between 18 and
                120 years.
              example: '1990-04-15'
            email:
              type: string
              format: email
              description: Must be all lowercase.
              example: maria.garcia@example.com
            phone:
              type: string
              description: E.164 format.
              example: '+14155552671'
            country_of_residence:
              $ref: '#/components/schemas/CountryCode'
            primary_nationality:
              $ref: '#/components/schemas/CountryCode'
            secondary_nationality:
              $ref: '#/components/schemas/CountryCode'
            gender:
              type: string
              enum:
                - MALE
                - FEMALE
              example: FEMALE
            tax_info:
              type: array
              minItems: 1
              description: >-
                Tax identification documents. Each entry must have a unique
                document_id.
              items:
                type: object
                required:
                  - country_code
                  - document_type
                  - document_id
                properties:
                  country_code:
                    $ref: '#/components/schemas/CountryCode'
                  document_type:
                    type: string
                    description: Tax document type (e.g. SSN, TIN).
                    example: SSN
                  document_id:
                    type: string
                    example: 123-45-6789
        address:
          type: object
          required:
            - street_line_1
            - city
            - subdivision_code
            - postal_code
            - country
          properties:
            street_line_1:
              type: string
              example: 123 Market Street
            street_line_1_en:
              type: string
              description: >-
                English transliteration. Required if street_line_1 contains
                non-ASCII characters.
              example: 123 Market Street
            street_line_2:
              type: string
              example: Apt 4B
            street_line_2_en:
              type: string
              description: >-
                English transliteration. Required if street_line_2 contains
                non-ASCII characters.
              example: Apt 4B
            city:
              type: string
              example: San Francisco
            subdivision_code:
              type: string
              description: ISO 3166-2 subdivision code (e.g. US-CA).
              example: US-CA
            postal_code:
              type: string
              example: '94103'
            country:
              $ref: '#/components/schemas/CountryCode'
        financial_profile:
          type: object
          required:
            - employment_status
            - occupation_id
            - purpose_id
            - source_of_fund_ids
            - monthly_volume_usd
          properties:
            employment_status:
              type: string
              enum:
                - EMPLOYED
                - SELF_EMPLOYED
                - RETIRED
                - STUDENT
                - UNEMPLOYED
              description: Employment status of the individual.
              example: EMPLOYED
            occupation_id:
              type: integer
              description: >-
                Occupation. FK to occupations reference table. Fetch valid
                values from GET /v1/occupations?type=INDIVIDUAL.
              example: 42
            purpose_id:
              type: integer
              description: >-
                Account purpose. FK to purposes reference table. Fetch valid
                values from GET /v1/purposes?type=INDIVIDUAL.
              example: 3
            purpose_remarks:
              type: string
              example: Personal remittances to family
            source_of_fund_ids:
              type: array
              minItems: 1
              items:
                type: integer
              description: >-
                Source(s) of funds. FK array to source_of_funds reference table.
                Fetch valid values from GET /v1/source-of-funds?type=INDIVIDUAL.
              example:
                - 1
                - 5
            source_of_funds_description:
              type: string
              example: Monthly salary from employment
            monthly_volume_usd:
              type: integer
              minimum: 0
              example: 5000
        meta_data:
          type: object
          additionalProperties: true
          example:
            reference: client-ref-abc-001
