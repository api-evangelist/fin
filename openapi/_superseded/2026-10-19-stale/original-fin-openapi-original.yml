                          properties:
                            wallet_address:
                              type: string
                              description: Destination wallet address.
                              example: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
                            currency:
                              type: string
                              enum:
                                - USDC
                              description: USDC only for OKX (milestone-1).
                              example: USDC
                            rail:
                              type: string
                              enum:
                                - SOLANA
                              description: SOLANA only for OKX (milestone-1).
                              example: SOLANA
                    developer_fee:
                      type: object
                      nullable: true
                      description: >-
