    patch:
      summary: Update Customer
      description: >-
        Submit an RFI response for an individual or business customer. You must
        pass only the fields and documents specified in the RFI. Submitting data
        that was not requested will trigger an error.
      x-mint:
        content: |
          <Note>
            Only submit the fields explicitly listed in the RFI. Sending unrequested
            fields will result in an error.
          </Note>

          The request body accepts the same fields as the following endpoints:

          - Attach Documents to Individual Customer
          - Attach Documents to Business Customer
          - Attach Documents to Business Customer V2
          - Attach Document To Associated Party
          - Attach Document To Associated Party V2
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the customer to update
          example: ed54db74-7dbe-47d2-8ea0-c2bf2a9dda06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Individual Customer
                  type: object
                  properties:
                    proof_of_identity:
                      type: object
                      properties:
                        type:
                          type: string
                          example: PASSPORT
                        number:
                          type: string
                          example: A12345678
                        country:
                          type: string
                          example: USA
                        issue_date:
                          type: string
                          format: date
                          example: '2020-01-15'
                        expiry_date:
                          type: string
                          format: date
                          example: '2030-01-15'
                        files:
                          type: array
                          items:
                            type: object
                            properties:
                              uri:
                                type: string
                                example: /AbAcQ4hn_0652746727637.pdf
                              side:
                                type: string
                                enum:
                                  - FRONT
                                  - BACK
                                example: FRONT
                    proof_of_address:
                      type: object
                      description: >-
                        The proof of address document must not be older than
                        three months.
                      properties:
                        type:
                          type: string
                          example: UTILITY_BILL
                        country:
                          type: string
                          example: USA
                        files:
                          type: array
                          items:
                            type: object
                            properties:
                              uri:
                                type: string
                                example: /AbAcQ4hn_0652746727638.pdf
                - title: Business Customer
                  type: object
                  properties:
                    ownership_documents:
                      type: array
                      description: >-
                        Ownership documents for the business customer (e.g.
                        shareholder registry, proof of signatory authority)
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            example: PROOF_OF_SIGNATORY_AUTHORITY
                          description:
                            type: string
                            example: Shareholder Registry
                          files:
                            type: array
                            items:
                              type: object
                              properties:
                                uri:
                                  type: string
                                  example: /AbAcQ4hn_0652746727639.pdf
                    formation_documents:
                      type: array
                      description: >-
                        Formation documents for the business customer (e.g.
                        certificate of incorporation, registration document)
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            example: REGISTRATION_DOCUMENT
                          description:
                            type: string
                            example: Certificate of Incorporation
                          files:
                            type: array
                            items:
                              type: object
                              properties:
                                uri:
                                  type: string
                                  example: /AbAcQ4hn_0652746727637.pdf
                    supporting_documents:
                      type: array
                      description: Supporting documents for the customer
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            example: PROOF_OF_SOURCE_OF_FUNDS
                          description:
                            type: string
                            example: Proof of source of funds doc
                          files:
                            type: array
                            items:
                              type: object
                              properties:
                                uri:
                                  type: string
                                  example: /PoAdef45_0652746727640.pdf
                    associated_party_attachments:
                      type: array
                      description: >-
                        Document attachments for associated parties of a
                        business customer
                      items:
                        type: object
                        properties:
                          associated_party_id:
                            type: string
                            format: uuid
                            description: ID of the associated party
                            example: f6b13e01-044a-4f74-a70b-d5f66b6449af
                          identifying_documents:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - PASSPORT
                                    - NATIONAL_ID
                                    - DRIVERS_LICENSE
                                    - RESIDENCE_PERMIT
                                number:
                                  type: string
                                country:
                                  type: string
                                issue_date:
                                  type: string
                                  format: date
                                expiry_date:
                                  type: string
                                  format: date
                                files:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      side:
                                        type: string
                                        enum:
                                          - FRONT
                                          - BACK
                                      uri:
                                        type: string
                          address_documents:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                files:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      uri:
                                        type: string
                          supporting_documents:
                            type: array
                            items:
                              type: object
            examples:
              Business Customer:
                value:
                  ownership_documents:
                    - type: PROOF_OF_SIGNATORY_AUTHORITY
                      description: Shareholder Registry
                      files:
                        - uri: /AbAcQ4hn_0652746727639.pdf
                  formation_documents:
                    - type: REGISTRATION_DOCUMENT
                      description: Certificate of Incorporation
                      files:
                        - uri: /AbAcQ4hn_0652746727637.pdf
                  supporting_documents:
                    - type: PROOF_OF_SOURCE_OF_FUNDS
                      description: Proof of source of funds doc
                      files:
                        - uri: /PoAdef45_0652746727640.pdf
                  associated_party_attachments:
                    - associated_party_id: f6b13e01-044a-4f74-a70b-d5f66b6449af
                      identifying_documents:
                        - type: PASSPORT
                          number: A12345678
                          country: USA
                          issue_date: '2020-01-15'
                          expiry_date: '2030-01-15'
                          files:
                            - uri: /AbAcQ4hn_0652746727637.pdf
                        - type: DRIVERS_LICENSE
                          number: DL987654321
                          country: USA
                          issue_date: '2019-06-01'
                          expiry_date: '2029-06-01'
                          files:
                            - side: FRONT
                              uri: /AbAcQ4hn_0652746727645.pdf
                            - side: BACK
                              uri: /AbAcQ4hn_0652746727646.pdf
                      address_documents:
                        - type: BANK_STATEMENT
                          files:
                            - uri: /AbAcQ4hn_0652746727638.pdf
                      supporting_documents: []
                    - associated_party_id: f71dc19f-b9a0-49fb-bd2d-5add3c01626e
                      identifying_documents:
                        - type: NATIONAL_ID
                          number: NID-987654
                          country: USA
                          issue_date: '2021-03-10'
                          expiry_date: '2031-03-10'
                          files:
                            - side: FRONT
                              uri: /XyZ123mn_0652746727650.pdf
                            - side: BACK
                              uri: /XyZ123mn_0652746727651.pdf
                      address_documents:
                        - type: UTILITY_BILL
                          files:
                            - uri: /XyZ123mn_0652746727652.pdf
              Individual Customer:
                value:
                  proof_of_identity:
                    type: PASSPORT
                    number: A12345678
                    country: USA
                    issue_date: '2020-01-15'
                    expiry_date: '2030-01-15'
                    files:
                      - uri: /AbAcQ4hn_0652746727637.pdf
                        side: FRONT
                  proof_of_address:
                    type: UTILITY_BILL
                    country: USA
                    files:
                      - uri: /AbAcQ4hn_0652746727638.pdf
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        example: ed54db74-7dbe-47d2-8ea0-c2bf2a9dda06
              example:
                data:
                  customer_id: ed54db74-7dbe-47d2-8ea0-c2bf2a9dda06
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Validation failed
                  data:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v2/customers/{customer_id}/wallets:
    post:
      summary: Create Customer Wallets
      description: >-
        Provisions one or more crypto wallets for a customer across supported
        chains and tokens.
      x-mint:
        content: |
          <Note>
            Fin.com issued crypto wallets require pre-configuration. Contact support to learn more.
          </Note>

          Wallets start with a status of `PENDING`. They move to `ACTIVE` (or
          `INACTIVE`) asynchronously once the wallet address has been issued,
          so creation is not synchronous. Poll [Get Customer
          Wallets](/api-reference/crypto-orchestration/get-customer-wallets)
          to check on status.

          Supported rails and currencies:

          | Rail     | Currency |
          | -------- | -------- |
          | POLYGON  | USDC     |
          | ETHEREUM | USDC     |
          | SOLANA   | USDC     |

          If any requested wallet (same `rail` + `currency` pair) already
          exists for the customer, the request fails with a `409` and lists
          the colliding pairs; none of the requested wallets are created.
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
          example: 765d498e-a267-4154-9d2f-9e411a0b50dd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wallets
              properties:
                wallets:
                  type: array
                  minItems: 1
                  description: Wallets to provision, one entry per rail.
                  items:
                    type: object
                    required:
                      - rail
                      - currency
                    properties:
                      rail:
                        type: string
                        description: Blockchain network to provision the wallet(s) on.
                        example: SOLANA
                      currency:
                        type: array
                        minItems: 1
                        description: Token(s) to provision a wallet for on this rail.
                        items:
                          type: string
                        example:
                          - USDC
            example:
              wallets:
                - rail: SOLANA
                  currency:
                    - USDC
                - rail: ETHEREUM
                  currency:
                    - USDC
      responses:
        '200':
          description: >-
            Wallet creation request accepted for processing. Note the nested
            `data`: the outer envelope wraps a `message` plus the inner `data`
            array of wallets being provisioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Request is being processed
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerWallet'
              example:
                data:
                  message: Request is being processed
                  data:
                    - id: b1e2c3d4-4d5e-6f70-8a90-1b2c3d4e5f60
                      rail: SOLANA
                      currency: USDC
                      status: PENDING
                    - id: d3a4e5f6-4d5e-6f70-8a90-1b2c3d4e5f62
                      rail: ETHEREUM
                      currency: USDC
                      status: PENDING
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '409':
          description: >-
            One or more of the requested wallets already exist for this
            customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: one or more wallets already exist for this customer
                  collisions:
                    type: array
                    items:
                      type: object
                      properties:
                        rail:
                          type: string
                          example: SOLANA
                        currency:
                          type: string
                          example: USDC
              example:
                message: one or more wallets already exist for this customer
                collisions:
                  - rail: SOLANA
                    currency: USDC
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      summary: Get Customer Wallets
      description: >-
        Returns all crypto wallets linked to a customer across supported chains
        and tokens.
      x-mint:
        content: >
          <Note>
            Fin.com issued crypto wallets require pre-configuration. Contact support to learn more.
          </Note>


          Upon approval, the customer is provisioned wallet addresses for the
          following rails and currencies:


          | Rail     | Currency |

          | -------- | -------- |

          | POLYGON  | USDC     |

          | ETHEREUM | USDC     |

          | SOLANA   | USDC     |


          `address` is `null` until the wallet finishes provisioning (see

          `status` on [Create Customer
          Wallets](/api-reference/crypto-orchestration/create-customer-wallets)).
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
          example: 765d498e-a267-4154-9d2f-9e411a0b50dd
      responses:
        '200':
          description: Customer wallets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerWallet'
              example:
                data:
                  - id: 27dbc0f2-e5ae-444b-b4ab-0764252aedf6
                    status: ACTIVE
                    currency: USDC
                    rail: ETHEREUM
                    address: '0xc42a5f7083c7e8f1d9820c7660867277289cd998'
                    balance: 10.000001
                  - id: e1dcce59-0309-43de-ab6c-a0bd3497b9c3
                    status: ACTIVE
                    currency: USDC
                    rail: SOLANA
                    address: BCSZEokfpVsSpUuuZJMScLiUpYjvvUmrrAJkNbrTTnng
                    balance: 25.000001
                  - id: c92dfe1d-220e-4446-a5e4-cd7d46031ba5
                    status: PENDING
                    currency: USDC
                    rail: POLYGON
                    address: null
                    balance: 0
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
