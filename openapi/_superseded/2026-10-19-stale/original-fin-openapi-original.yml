        filtered by transaction type.
      x-mint:
        content: >
          ```

          GET
          /v2/transactions?customer_id=765d498e-a267-4154-9d2f-9e411a0b50dd&type=CRYPTO_WITHDRAWAL&current_page=1&per_page=10

