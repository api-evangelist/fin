  /v1/batch/transactions/commit:
    post:
      summary: Execute Batch Transfer
      description: Execute multiple transfer payouts in a single batch operation.
      x-mint:
        content: >
          <Note>
            This endpoint can only be used with beneficiaries created with `auto_settlement` set to `true`.
          </Note>


          **Amount Specification:**

          - Each transaction must include exactly one of `source_amount` or
          `destination_amount` (not both)

          - `source_amount`: Minimum 500 cents (e.g. 500 = $5.00)

          - Only `PREFUNDED_BALANCE` transactions are eligible for refunds if
          they fail
      tags:
        - Transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - beneficiary_id
                  - source_currency
                  - deduct_from
                properties:
                  beneficiary_id:
                    type: string
                    format: uuid
                    example: d6ae4ea6-0482-47ab-a895-02e50ea6358b
                  source_amount:
                    type: number
                    minimum: 500
                    description: Amount in cents (e.g. 530 = $5.30). Minimum 500 cents.
                    example: 530
                  destination_amount:
                    type: number
                    example: 62000
                  source_currency:
                    type: string
                    example: USD
                  deduct_from:
                    type: string
                    enum:
                      - PREFUNDED_BALANCE
                      - LIQUIDATION_ADDRESS
                  remarks:
                    type: string
                    example: Monthly salary payment
            examples:
              With source amount:
                value:
                  - beneficiary_id: d6ae4ea6-0482-47ab-a895-02e50ea6358b
                    source_amount: 530
                    source_currency: USD
                    deduct_from: PREFUNDED_BALANCE
                    remarks: Monthly salary payment
              With destination amount:
                value:
                  - beneficiary_id: d6ae4ea6-0482-47ab-a895-02e50ea6358b
                    destination_amount: 62000
                    source_currency: USD
                    deduct_from: PREFUNDED_BALANCE
                    remarks: Monthly salary payment
      responses:
        '201':
          description: Batch created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 3b1d73c0-0000-0000-0000-51aa2461f1
              examples:
                With source amount:
                  value:
                    data:
                      id: 3b1d73c0-0000-0000-0000-51aa2461f1
                With destination amount:
                  value:
                    data:
                      id: 3b1d73c0-0000-0000-0000-51aa2461f1
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
