  /v1/countries:
    get:
      summary: List Generic Country Codes
      description: >-
        Retrieve a list of country specific codes following ISO 3166-1 alpha-3
        standard
      tags:
        - Catalogue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CurrentPageParam'
      responses:
        '200':
          description: List of countries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: BLR
                            name:
                              type: string
                              example: Belarus
                            currency_code:
                              type: string
                              example: BYN
                            phone_code:
                              type: string
                              example: '+375'
                            flag_url:
                              type: string
                              format: uri
                              example: https://flagcdn.com/by.svg
                            postal_code:
                              type: object
                              properties:
                                required:
                                  type: boolean
                                  example: true
                                regex:
                                  type: string
                                  nullable: true
                                  example: \A\d{6}\Z
              example:
                data:
                  pagination:
                    current_page: 1
                    per_page: 20
                    total_page: 13
                    total: 248
                  countries:
                    - code: AFG
                      name: Afghanistan
                      currency_code: AFN
                      phone_code: '+93'
                      flag_url: https://flagcdn.com/af.svg
                      postal_code:
                        required: true
                        regex: \A\d{4}\Z
                    - code: ALA
                      name: Åland Islands
                      currency_code: EUR
                      phone_code: '+358'
                      flag_url: https://flagcdn.com/ax.svg
                      postal_code:
                        required: true
                        regex: \A22\d{3}\Z
                    - code: ALB
                      name: Albania
                      currency_code: ALL
                      phone_code: '+355'
                      flag_url: https://flagcdn.com/al.svg
                      postal_code:
                        required: true
                        regex: \A\d{4}\Z
                    - code: DZA
                      name: Algeria
                      currency_code: DZD
                      phone_code: '+213'
                      flag_url: https://flagcdn.com/dz.svg
                      postal_code:
                        required: true
                        regex: \A\d{5}\Z
                    - code: ASM
                      name: American Samoa
                      currency_code: USD
                      phone_code: +1-684
                      flag_url: https://flagcdn.com/as.svg
                      postal_code:
                        required: true
                        regex: \A(96799)(?:[ \-](\d{4}))?\Z
                    - code: AND
                      name: Andorra
                      currency_code: EUR
                      phone_code: '+376'
                      flag_url: https://flagcdn.com/ad.svg
                      postal_code:
                        required: true
                        regex: \AAD[1-7]0\d\Z
                    - code: AGO
                      name: Angola
                      currency_code: AOA
                      phone_code: '+244'
                      flag_url: https://flagcdn.com/ao.svg
                      postal_code:
                        required: false
