  /v1/transit/quote:
    post:
      summary: Create a crypto payment quote
      description: Generate a fee estimation quote for a transit payment
      x-mint:
        content: >
          <Note>
            The quote has a limited validity period indicated by `expire_at`. Request a new quote if it has expired.
          </Note>


          See the **Quote Request by Integration** tabs on this page for
          per-integration request examples (Bybit, Kraken, Pass Through).
      tags:
        - Crypto Orchestration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Bybit
                  type: object
                  required:
                    - order_amount
                    - integration_type
                    - settlement_config
                  properties:
                    order_amount:
                      type: string
                      description: Order amount in USD.
                      example: '100.00'
                    integration_type:
                      type: string
                      enum:
                        - BYBIT
                      example: BYBIT
                    settlement_config:
                      type: object
                      required:
                        - settlement_via
                        - rebalance_fee
                        - destination_details
                      properties:
                        settlement_via:
                          type: string
                          enum:
                            - MARKET_ORDER
                            - ONE_TO_ONE
                          example: MARKET_ORDER
                        rebalance_fee:
                          type: boolean
                          description: >-
                            When true, fees are absorbed and total_order_amount
                            equals order_amount. When false, settlement_amount
                            equals order_amount minus total_fee.
                          example: true
                        destination_details:
                          type: object
                          required:
                            - wallet_address
                            - currency
                            - rail
                          properties:
                            wallet_address:
                              type: string
                              description: Destination wallet address.
                              example: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
                            currency:
                              type: string
                              enum:
                                - USDC
                                - PYUSD
                              description: >-
                                Destination currency. See [supported chains and
                                currencies](https://developer.fin.com/crypto-orchestration/integration-types/bybit#chains-rails-and-constraints)
                                for valid currency and rail combinations.
                              example: USDC
                            rail:
                              type: string
                              enum:
                                - SOLANA
                                - ETHEREUM
                                - BASE
                              example: SOLANA
                - title: Kraken
                  type: object
                  required:
                    - order_amount
                    - integration_type
                    - settlement_config
                  properties:
                    order_amount:
                      type: string
                      description: Order amount in USD.
                      example: '100.00'
                    integration_type:
                      type: string
                      enum:
                        - KRAKEN
                      example: KRAKEN
                    settlement_config:
                      type: object
                      required:
                        - settlement_via
                        - rebalance_fee
                        - destination_details
                      properties:
                        settlement_via:
                          type: string
                          enum:
                            - ONE_TO_ONE
                          example: ONE_TO_ONE
                        rebalance_fee:
                          type: boolean
                          description: >-
                            When true, fees are absorbed and total_order_amount
                            equals order_amount. When false, settlement_amount
                            equals order_amount minus total_fee.
                          example: false
                        destination_details:
                          type: object
                          required:
                            - wallet_address
                            - currency
                            - rail
                          properties:
                            wallet_address:
                              type: string
                              description: Destination wallet address.
                              example: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
                            currency:
                              type: string
                              enum:
                                - USDC
                                - PYUSD
                              example: PYUSD
                            rail:
                              type: string
                              enum:
                                - SOLANA
                              example: SOLANA
                    developer_fee:
                      type: object
                      nullable: true
                      description: >-
                        Developer fee configuration. Nullable. Both fields
                        default to 0.
                      properties:
                        fixed:
                          type: string
                          description: Fixed fee in USD per transaction. Defaults to 0.
                          example: '0.15'
                        percentage:
                          type: string
                          description: >-
                            Percentage fee applied to order_amount. Defaults to
                            0.
                          example: '2.5'
                - title: Pass Through
                  type: object
                  required:
                    - order_amount
                    - integration_type
                    - settlement_config
                  properties:
                    order_amount:
                      type: string
                      description: Order amount in USD.
                      example: '100.00'
                    integration_type:
                      type: string
                      enum:
                        - PASS_THROUGH
                      example: PASS_THROUGH
                    settlement_config:
                      type: object
                      required:
                        - settlement_via
                        - rebalance_fee
                        - destination_details
                      properties:
                        settlement_via:
                          type: string
                          enum:
                            - FEE_RETENTION
                          example: FEE_RETENTION
                        rebalance_fee:
                          type: boolean
                          description: >-
                            Only false is supported for PASS_THROUGH. Passing
                            true returns an error.
                          example: false
                        destination_details:
                          type: object
                          required:
                            - wallet_address
                            - currency
                            - rail
                          properties:
                            wallet_address:
                              type: string
                              description: Destination wallet address.
