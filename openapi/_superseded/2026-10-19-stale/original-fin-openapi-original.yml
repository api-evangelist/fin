  customer.rfi:
    post:
      summary: Customer RFI
      description: >-
        Triggered when the compliance team requests additional information or
        documents from a customer. Sets the customer status to ACTION_REQUIRED.
        The payload includes a structured list of what is missing, invalid, or
        expired, scoped to either the customer or a specific associated party.
      x-mint:
        metadata:
          title: customer.rfi
        content: >
          ### When This Fires

          This webhook fires when compliance flags one or more documents or
          fields

          as missing, expired, or invalid. The customer status will be set to

          `ACTION_REQUIRED`.


          <Note>
            An RFI can also be triggered after a customer is already `APPROVED`. In that case the customer status remains unchanged. Only the `rrequest_for_information` object in the payload will contain data and this webhook will be received.
          </Note>


          ### RFI Available Scope

          - **CUSTOMER**: The issue is with the customer's own documents or data

          - **ASSOCIATED PARTY**: The issue is with a specific associated party
          (identified by `associated_party_id`)


          ### Field Status Values

          - **MISSING**: Document or field was not provided

          - **EXPIRED**: Document has passed its expiry date

          - **INVALID**: Document or field value does not meet requirements (see
          `reason`)


          ### Section Values by Customer Type


          | Customer Type | Sections |

          |---------------|----------|

          | Individual | `proof_of_identity`, `proof_of_address`,
          `tos_policies_value` |

          | Business V1 | `company_details`, `ownership_structure`,
          `legal_presence` |

          | Business V2 | `formation_documents`, `ownership_documents`,
          `supporting_documents` |

          | Associated Party (V1) | `proof_of_identity`, `proof_of_address` |

          | Associated Party (V2) | `identifying_documents`, `tax_info`,
          `address_documents` |


          <Note>
            All webhook requests include HMAC signatures for verification.
          </Note>
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  $ref: '#/components/schemas/WebhookEventEnvelope'
                data:
                  type: object
                  required:
                    - customer_id
                    - request_for_information
                  properties:
                    customer_id:
                      type: string
                      format: uuid
                      description: The customer for whom information is requested.
                      example: cust-uuid-1234
                    request_for_information:
                      type: array
                      description: List of document or field issues that must be resolved.
                      items:
                        type: object
                        required:
                          - section
                          - categories
                        properties:
                          section:
                            type: string
                            description: >-
                              The document section with the issue. Individual:
                              proof_of_identity, proof_of_address,
                              tos_policies_value. Business V1: company_details,
                              ownership_structure, legal_presence. Business V2:
                              formation_documents, ownership_documents,
                              supporting_documents. Associated Party V1:
                              proof_of_identity, proof_of_address. Associated
                              Party V2: identifying_documents, tax_info,
                              address_documents.
                            example: proof_of_identity
                          categories:
                            type: array
                            items:
                              type: object
                              required:
                                - document_type
                                - fields
                              properties:
                                document_type:
                                  type: string
                                  description: The type of document with the issue.
                                  example: GOVERNMENT_ID
                                fields:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - field_name
                                      - data_type
                                      - status
                                    properties:
                                      field_name:
                                        type: string
                                        description: The specific field with the issue.
                                        example: files
                                      data_type:
                                        type: string
                                        enum:
                                          - URI
                                          - DATE
                                          - TEXT
                                          - ENUM
                                        description: The data type of the field.
                                        example: URI
                                      status:
                                        type: string
                                        enum:
                                          - MISSING
                                          - EXPIRED
                                          - INVALID
                                        description: The nature of the issue.
                                        example: EXPIRED
                                      side:
                                        type: string
                                        enum:
                                          - FRONT
                                          - BACK
                                        nullable: true
                                        description: >-
                                          For file fields only. Indicates which
                                          side of the document is affected. Null
                                          for non-file fields.
                                        example: FRONT
                                      reason:
                                        type: string
                                        nullable: true
                                        description: >-
                                          Human-readable explanation. Null when
                                          status is MISSING.
                                        example: Document has expired
            examples:
              individual:
                summary: Individual Customer RFI
                value:
                  event:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    event_reference_id: cust-uuid-1234
                    type: customer.rfi
                    created_at: '2026-04-04T10:00:00.000000Z'
