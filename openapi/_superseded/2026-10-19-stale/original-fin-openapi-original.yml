    post:
      operationId: createVirtualAccountV2
      summary: Create Virtual Account V2
      description: >-
        Create a virtual bank account for a specific customer to convert fiat
        deposits to crypto. The `customer_id` path parameter identifies the
        customer for whom the virtual account is being created.
      tags:
        - Virtual Accounts
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the customer to create the virtual account for.
          example: ed54db74-7dbe-47d2-8ea0-c2bf2a9dda06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination
                - source
                - developer_fee
              properties:
                destination:
                  type: object
                  required:
                    - wallet
                    - currency
                    - rail
                  properties:
                    wallet:
                      type: string
                      description: Destination wallet address in hexadecimal format (0x...)
                      example: '0x6e41e83d406185b358bd72111ab1206cb82eb67f'
                    currency:
                      type: string
                      enum:
                        - USDC
                      example: USDC
                    rail:
                      type: string
                      enum:
                        - POLYGON
                      example: POLYGON
                source:
                  type: object
                  required:
                    - currency
                    - rail
                  properties:
                    currency:
                      type: string
                      enum:
                        - USD
                        - EUR
                        - MXN
                      example: USD
                    rail:
                      type: string
                      enum:
                        - ACH
                        - SWIFT
                        - FEDWIRE
                        - FEDNOW
                        - SEPA
                        - SPEI
                      example: FEDWIRE
                developer_fee:
                  type: object
                  required:
                    - percentage
                    - fixed
                  properties:
                    percentage:
                      type: number
                      example: 0.1
                    fixed:
                      type: number
                      example: 0.1
            example:
              destination:
                wallet: '0x6e41e83d406185b358bd72111ab1206cb82eb67f'
                currency: USDC
                rail: POLYGON
              source:
                currency: USD
                rail: FEDWIRE
              developer_fee:
                percentage: 0.1
                fixed: 0.1
      responses:
        '200':
          description: Virtual account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 024e784b-bc27-4a4c-82ee-80000fbf53c5
                      status:
                        type: string
                        enum:
                          - PROCESSING
                          - IN_COMPLIANCE
                          - REQUEST_FOR_INFORMATION
                          - ACTIVE
                          - INACTIVE
                          - DECLINED
                        example: PROCESSING
                      customer_id:
                        type: string
                        format: uuid
                        example: 0fb72092-22a8-4df8-a6d9-1a28f86b7d44
                      created_at:
                        type: string
                        format: date-time
                        example: '2026-04-04T11:05:20.963676Z'
                      rfi:
                        type: object
                        nullable: true
                        example: null
              examples:
                OK:
                  summary: OK
                  value:
                    data:
                      id: 024e784b-bc27-4a4c-82ee-80000fbf53c5
                      status: PROCESSING
                      customer_id: 0fb72092-22a8-4df8-a6d9-1a28f86b7d44
                      created_at: '2026-04-04T11:05:20.963676Z'
                      rfi: null
