  /v1/customers/upload:
    post:
      summary: Upload Document
      description: >-
        Upload customer documents using multipart/form-data. Files can be
        uploaded with arbitrary field names (e.g., poa, poi, passport, file1,
        etc.)
      x-mint:
        content: |
          ## Allowed File Types

          - `PDF`
          - `JPG` / `JPEG`
          - `PNG`

          <Note>
            Files should be uploaded as separate form fields with arbitrary names.
            You can use any field name for files (e.g., `passport`, `poa`, `poi`, `file1`, `document1`, etc.).
            The field name you use will be returned as the key in the response.
          </Note>
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
                passport:
                  type: string
                  format: binary
                poa:
                  type: string
                  format: binary
                poi:
                  type: string
                  format: binary
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          additionalProperties:
                            type: string
                        example:
                          - passport: /CwW9PHhP_Germany-passport.jpg
                          - poa: /KVdLfqjR_germany-poa-green.jpg
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v2/customers/{customer_id}/individual/attach:
    post:
      summary: Attach Documents to Individual Customer V2
      description: >-
        Attach identifying and address documents to an existing v2 individual
        customer. Replaces the v1 proof_of_identity / proof_of_address structure
        with separate identifying_documents and address_documents arrays.
        Documents are processed asynchronously.
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier for the individual customer
          example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDocumentsToIndividualCustomerV2Input'
            example:
              identifying_documents:
                - type: SELFIE
                  files:
                    - uri: /AbAcQ4hn_0652746727637.pdf
                - type: DRIVERS_LICENSE
                  number: DL987654321
                  country: USA
                  state: US-CA
                  issue_date: '2019-06-01'
                  expiry_date: '2029-06-01'
                  files:
                    - side: FRONT
                      uri: /AbAcQ4hn_0652746727638.pdf
                    - side: BACK
                      uri: /XyZ123mn_0652746727639.pdf
              address_documents:
                - type: BANK_STATEMENT
                  country: USA
                  files:
                    - uri: /PoAdef45_0652746727640.pdf
              tos_policies_value: e9414388-fbdf-4407-b5c2-bc39eae3645b
      responses:
        '200':
          description: Request validated and queued for asynchronous processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                        format: uuid
                        example: 55bd6b4e-c20a-4cc8-9535-91d5557a67d9
                  meta:
                    type: object
                    nullable: true
                    example: null
        '400':
          description: Malformed JSON or unparseable payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Malformed request body
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          description: >-
            Customer not owned by the client, wrong api_version, or not in an
            allowed status, or a file URI does not belong to the customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: forbidden
                      message:
                        type: string
                        example: Customer is not eligible for this operation
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Another attach for this customer is already in flight
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: conflict
                      message:
                        type: string
                        example: >-
                          An attach request is already in progress for this
                          customer
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Internal server error
