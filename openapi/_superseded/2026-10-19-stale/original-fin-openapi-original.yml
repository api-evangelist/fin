    V2AssociatedPartyAttachment:
      type: object
      required:
        - associated_party_id
      properties:
        associated_party_id:
          type: string
          format: uuid
          description: >-
            Unique identifier for the associated party, returned in GET
            /v2/customers/:customer-id.
          example: f6b13e01-044a-4f74-a70b-d5f66b6449af
        identifying_documents:
          type: array
          description: >-
            Government-issued identity documents for this party. Multiple
            documents may be provided (e.g., passport + driver license).
            NATIONAL_ID and DRIVERS_LICENSE require both FRONT and BACK sides.
          items:
            $ref: '#/components/schemas/V2IdentifyingDocumentAttachment'
        address_documents:
          type: array
          description: Proof of address documents. Must be issued within the last 90 days.
          items:
            $ref: '#/components/schemas/V2AddressDocumentAttachment'
        supporting_documents:
          type: array
          description: >-
            Any additional supporting documents for this party. Optional. Pass
            empty array if not applicable.
          items:
            $ref: '#/components/schemas/V2AssociatedPartySupportingDocumentAttachment'
    V2IdentifyingDocumentAttachment:
      type: object
      required:
        - type
        - number
        - country
        - issue_date
        - expiry_date
        - files
      properties:
        type:
          type: string
          enum:
            - PASSPORT
            - NATIONAL_ID
            - DRIVERS_LICENSE
            - RESIDENCE_PERMIT
            - PERMANENT_RESIDENCY_ID
          description: >
            Type of government-issued identity document. At least one
            identifying

            document is required. Double-sided documents must include both front

            and back images.


            **USA residents**: all ID types are supported:

            - `PASSPORT`: Passport

            - `NATIONAL_ID`: National ID card

            - `DRIVERS_LICENSE`: Driver's license

            - `PERMANENT_RESIDENCY_ID`: Permanent Residency / Green Card


            **Non-USA residents**: only the following are accepted:

            - `PASSPORT`: Passport

            - `NATIONAL_ID`: National ID card

            - `DRIVERS_LICENSE`: Driver's license


            `PERMANENT_RESIDENCY_ID` is **not supported** for non-USA residents

            and will be rejected.
          example: PASSPORT
        number:
          type: string
          description: Document number.
          example: A12345678
        country:
          $ref: '#/components/schemas/CountryCode'
        issue_date:
          type: string
          format: date
          description: Document issue date in YYYY-MM-DD format.
          example: '2020-01-15'
        expiry_date:
          type: string
          format: date
          description: Document expiry date in YYYY-MM-DD format. Must not be expired.
          example: '2030-01-15'
        files:
          type: array
          description: >-
            One or more file URIs from [Upload
            Document](https://developer.fin.com/api-reference/customers/upload-document)
            endpoint. For NATIONAL_ID and DRIVERS_LICENSE, provide both FRONT
            and BACK.
          minItems: 1
          items:
            type: object
            required:
              - uri
            properties:
              side:
                type: string
                enum:
                  - FRONT
                  - BACK
                description: >-
                  Required for NATIONAL_ID and DRIVERS_LICENSE. Optional for
                  PASSPORT and RESIDENCE_PERMIT.
                example: FRONT
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727637.pdf
    V2AssociatedPartySupportingDocumentAttachment:
      type: object
      required:
        - type
        - files
      properties:
        type:
          type: string
          enum:
            - MILITARY_ID
            - MATRICULATE_ID
            - STATE_OR_PROVINCIAL_ID
            - VISA
            - OTHER
          description: Type of additional supporting document for the associated party.
          example: MILITARY_ID
        files:
          type: array
          description: >-
            One or more file URIs from [Upload
            Document](https://developer.fin.com/api-reference/customers/upload-document)
            endpoint.
          minItems: 1
          items:
            type: object
            required:
              - uri
            properties:
              uri:
                type: string
                description: File URI returned by the upload endpoint.
                example: /AbAcQ4hn_0652746727638.pdf
    V2AddressDocumentAttachment:
