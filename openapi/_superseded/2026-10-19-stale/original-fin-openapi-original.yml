            - GOVERNMENT_LETTER
            - BANK_STATEMENT
            - PROOF_OF_TAX_IDENTIFICATION
            - COURT_DOCUMENT
            - INSURANCE_STATEMENT
          description: Type of address proof document. Must be within the last 90 days.
          example: BANK_STATEMENT
        files:
