  /v2/customers/business:
    post:
      summary: Create Business Customer V2
      description: >-
        Create a new business customer with full KYB profile, associated parties
        (UBOs/directors), compliance data, and optionally holding structure and
        public listing details.
      x-mint:
        content: >
          ## Important Requirements


          - **Email Address**: Must be all lowercase or you will receive a
          validation error

          - **RELIANCE Verification**: If you attempt to use `RELIANCE`
          verification type but it's not enabled for your client, you will
          receive a 423 error with message: "RELIANCE is not available for your
          client"

          - **Non-ASCII characters**: If any input field contains non-ASCII
          characters, you must provide a transliterated (Latin) value in the
          corresponding `_en` field (e.g., `legal_name_en`, `street_line_1_en`,
          `first_name_en`)

          - **Third-party Fund Usage**: The `third_party_fund_usage` field
          indicates whether this customer will be moving other people's money

          - **Ownership Percentages**: The total ownership percentages of all
          associated parties must add up to more than 0 and less than 100

          - **Reference Data**: `purpose_id`, `source_of_fund_ids` and
          `source_of_wealth_ids` are integer foreign keys. Fetch valid values
          from [List Account
          Purposes](https://developer.fin.com/api-reference/catalogue/list-account-purposes)
          , [List Source of
          Funds](https://developer.fin.com/api-reference/catalogue/list-source-of-funds)
          and [List Source of
          Wealth](https://developer.fin.com/api-reference/catalogue/list-source-of-wealth)

          - **subdivision_code**: Pass the ISO 3166-2 code. For example for CA,
          pass US-CA.
