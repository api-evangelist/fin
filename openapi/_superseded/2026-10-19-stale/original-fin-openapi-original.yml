  /v2/beneficiaries:
    post:
      summary: Create Beneficiary
      description: Create a new beneficiary account for payments and transfers
      x-mint:
        content: >
          <Warning>
            This endpoint was deprecated on May 20, 2026. Use [Create Beneficiary V3](https://developer.fin.com/api-reference/beneficiaries/create-beneficiary-v3) instead.
          </Warning>


          ## Rules


          - Beneficiary creation requires the customer to be in the `APPROVED`
          status.

          - Two beneficiaries with the same destination are not allowed.


          ## De-Duplication Logic


          For _bank accounts_, the system checks: `bank_account.scheme`,
          `bank_account.number`, `bank_routing.scheme`, `bank_routing.number`.

          For _e-wallets_: `e_wallet.scheme`, `e_wallet.number`.


          ## Country-Specific Validation


          ### GBR (United Kingdom)

          - **Bank account number**: Must match `^[0-9]{4,9}$` for both `LOCAL`
          and `SWIFT` schemes.
      tags:
        - Beneficiaries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - customer_id
                    - country
                    - currency
                    - account_holder
                    - account_holder_address
                    - receiver_meta_data
                    - developer_fee
                    - deposit_instruction
                    - refund_instruction
                  properties:
                    customer_id:
                      type: string
                      example: cust_123456
                    country:
                      type: string
                      example: USA
                      pattern: ^[A-Z]{3}$
                    currency:
                      type: string
                      example: USD
                    counter_party:
                      type: string
                      enum:
                        - FIRST_PARTY
                        - THIRD_PARTY
                      description: >-
                        Indicates whether the beneficiary is a first-party or
                        third-party account. Optional.
                      example: FIRST_PARTY
                    account_holder:
                      oneOf:
                        - title: Individual
                          type: object
                          required:
                            - type
                            - first_name
                            - last_name
                            - email
                            - phone
                          properties:
                            type:
                              type: string
                              enum:
                                - INDIVIDUAL
                            first_name:
                              type: string
                              example: John
                            last_name:
                              type: string
                              example: Doe
                            email:
                              type: string
                              format: email
                              example: john.doe@example.com
                            phone:
                              type: string
                              example: '+1234567890'
                        - title: Business
                          type: object
                          required:
                            - type
                            - business_name
                            - email
                            - phone
                          properties:
                            type:
                              type: string
                              enum:
                                - BUSINESS
                            business_name:
                              type: string
                              example: Acme Corp
                            email:
                              type: string
                              format: email
                              example: contact@acmecorp.com
                            phone:
                              type: string
                              example: '+1234567890'
                    account_holder_address:
                      type: object
                      required:
                        - street_line_1
                        - city
                        - state
                        - postcode
                        - country
                      properties:
                        street_line_1:
                          type: string
                          example: 456 Main Street
                        street_line_2:
                          type: string
                          example: Apt 5B
                        city:
                          type: string
                          example: Brooklyn
                        state:
                          type: string
                          description: >-
                            State or province. Required. Must be an ISO 3166-2
                            subdivision code (e.g. US-CA, BD-13).
                          example: US-NY
                        postcode:
                          type: string
                          example: '11201'
                        country:
                          type: string
                          example: USA
                          pattern: ^[A-Z]{3}$
                    receiver_meta_data:
                      type: object
                      required:
                        - transaction_purpose_id
                        - occupation_remarks
                        - relationship
                        - nationality
                      properties:
                        transaction_purpose_id:
                          type: integer
                          example: 1
                        transaction_purpose_remarks:
                          type: string
                          example: Monthly salary payment
                        occupation_id:
                          type: integer
                          example: 5
                        occupation_remarks:
                          type: string
                          example: Software Engineer
                        relationship:
                          type: string
                          enum:
                            - EMPLOYEE
                            - FREELANCER
                            - GIG_WORKER
                            - AFFILIATE
                            - CUSTOMER
                            - FAMILY_MEMBER
                            - FRIEND
                            - SELF
                            - OTHER
                            - SUPPLIER
                            - VENDOR
                            - SERVICE_PROVIDER
                            - MERCHANT
                            - CONTRACTOR
                            - SUBSIDIARY
                            - PARENT_COMPANY
                            - AFFILIATE_BUSINESS
                            - BANK_ACCOUNT
                            - BROKER
                            - EXCHANGE
                            - WALLET
                        relationship_remarks:
                          type: string
                          example: Long-term contractor
                        nationality:
                          type: string
                          example: USA
                          pattern: ^[A-Z]{3}$
                        govt_id_number:
                          type: string
                          example: JG1121316A
                        govt_id_issue_date:
                          type: string
                          format: date
                          example: '2024-12-30'
                        govt_id_expire_date:
                          type: string
                          format: date
                          example: '2027-12-30'
                    developer_fee:
                      type: object
                      required:
                        - fixed
                        - percentage
                      properties:
                        fixed:
                          type: number
                          example: 5
                        percentage:
                          type: number
                          example: 2.5
                    deposit_instruction:
                      type: object
                      required:
                        - currency
                        - rail
                      properties:
                        currency:
                          type: string
                          enum:
                            - USDC
                        rail:
                          type: string
                          enum:
                            - POLYGON
                    refund_instruction:
                      type: object
                      required:
                        - wallet_address
                        - currency
                        - rail
                      properties:
                        wallet_address:
                          type: string
                          example: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb'
                        currency:
                          type: string
                          enum:
                            - USDC
                        rail:
                          type: string
                          enum:
                            - POLYGON
                    settlement_config:
                      type: object
                      required:
                        - auto_settlement
                      properties:
                        auto_settlement:
                          type: boolean
                          example: true
                - oneOf:
                    - title: Bank Account
                      type: object
                      required:
                        - bank_account
                        - bank_routing
                        - bank_address
                      properties:
                        bank_account:
                          type: object
                          required:
                            - bank_name
                            - number
                            - scheme
                            - type
                          properties:
                            bank_name:
                              type: string
                              example: Chase Bank
                            number:
                              type: string
                              example: '1234567890'
                            scheme:
                              type: string
                              enum:
                                - LOCAL
                                - SWIFT
                            type:
                              type: string
                              enum:
                                - CHECKING
                                - SAVINGS
                                - CURRENT
                        bank_routing:
                          type: array
                          items:
                            type: object
                            required:
                              - scheme
                              - number
                            properties:
                              scheme:
                                type: string
                                enum:
                                  - ACH
                                  - BANK_CODE
                                  - BANK_IDENTIFIER
                                  - BRANCH_CODE
                                  - BRANCH_IDENTIFIER
                                  - BSB
                                  - IBAN
                                  - IFSC
                                  - SWIFT
                                  - TRANSIT_NUMBER
                                  - WIRE
                              number:
                                oneOf:
                                  - type: string
                                  - type: integer
                                example: '021000021'
                        bank_address:
                          type: object
                          required:
                            - street_line_1
                            - city
                            - state
                            - postcode
                            - country
                          properties:
                            street_line_1:
                              type: string
                              example: 123 Bank Street
                            street_line_2:
                              type: string
                              example: Suite 100
                            city:
                              type: string
                              example: New York
                            state:
                              type: string
                              description: >-
                                State or province. Required. Must be an ISO
                                3166-2 subdivision code (e.g. US-CA, BD-13).
                              example: US-NY
                            postcode:
                              type: string
                              example: '10001'
                            country:
                              type: string
                              example: USA
                              pattern: ^[A-Z]{3}$
                    - title: E Wallet
                      type: object
                      required:
                        - e_wallet
                      properties:
                        e_wallet:
                          type: object
                          required:
                            - scheme
                            - number
                          properties:
                            scheme:
                              type: string
                              example: BKASH
                            number:
                              type: string
                              example: '+8801688502814'
      responses:
        '200':
          description: Beneficiary created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
