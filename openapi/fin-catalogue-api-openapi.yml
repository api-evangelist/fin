openapi: 3.2.0
info:
  title: Fin.com Catalogue API
  version: 1.0.0
  description: A simple API specification
servers:
- url: https://sandbox.api.fin.com
  description: Sandbox server
- url: https://api.fin.com
  description: Production server
tags:
- name: Catalogue
  description: 'A set of endpoint to retrieve contextual data to assemble requests

    to fin.com''s API'
paths:
  /v1/fx-rate:
    get:
      summary: Fetch Exchange Rates
      description: Retrieve exchange rates for a specific country
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - name: country_code
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CountryCode'
        description: ISO 3166-1 alpha-3 country code
      responses:
        '200':
          description: Exchange rates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from_currency:
                        type: string
                        description: Source currency code
                        example: USD
                      to_currency:
                        type: string
                        description: Target currency code
                        example: BDT
                      exchange_rate:
                        type: number
                        format: float
                        description: Exchange rate from source to target currency
                        example: 117.19
                      country:
                        type: string
                        description: ISO 3166-1 alpha-3 country code
                        example: BGD
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1FxRate
      x-operation-id-source: derived
  /v1/industries:
    get:
      summary: List Industries
      description: Retrieve a list of available industries
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      responses:
        '200':
          description: List of industries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 104
                          total:
                            type: integer
                            description: Total number of items
                            example: 1040
                      industries:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the industry
                              example: 1
                            title:
                              type: string
                              description: Name of the industry
                              example: Oilseed Except Soybean Farming
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1Industries
      x-operation-id-source: derived
  /v1/occupations:
    get:
      summary: List Occupations
      description: Retrieve a list of available occupations
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      responses:
        '200':
          description: List of occupations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 87
                          total:
                            type: integer
                            description: Total number of items
                            example: 870
                      occupations:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the occupation
                              example: 1
                            title:
                              type: string
                              description: Name of the occupation
                              example: Software Engineer
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1Occupations
      x-operation-id-source: derived
  /v1/source-of-funds:
    get:
      summary: List Source of Funds
      description: Retrieve a list of available source of funds
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      - name: type
        in: query
        description: Filter source of funds by type
        required: true
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
      responses:
        '200':
          description: List of source of funds retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 5
                          total:
                            type: integer
                            description: Total number of items
                            example: 50
                      source_of_funds:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the source of funds
                              example: 1
                            title:
                              type: string
                              description: Name of the source of funds
                              example: Employment Income
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1SourceOfFunds
      x-operation-id-source: derived
  /v1/purposes:
    get:
      summary: List Account Purposes
      description: Retrieve a list of available account purposes
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      - name: type
        in: query
        description: Filter account purposes by type
        required: true
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
      responses:
        '200':
          description: List of account purposes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 3
                          total:
                            type: integer
                            description: Total number of items
                            example: 30
                      purposes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the account purpose
                              example: 1
                            title:
                              type: string
                              description: Name of the account purpose
                              example: Personal Savings
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1Purposes
      x-operation-id-source: derived
  /v1/countries:
    get:
      summary: List Generic Country Codes — ISO 3166-1 alpha-3
      description: Retrieve a list of country codes following ISO 3166-1 alpha-3 standard
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      responses:
        '200':
          description: List of countries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 25
                          total:
                            type: integer
                            description: Total number of items
                            example: 246
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: ISO 3166-1 alpha-3 country code
                              example: AFG
                            name:
                              type: string
                              description: Country name
                              example: Afghanistan
                            currency_code:
                              type: string
                              description: Currency code for the country
                              example: AFN
                            phone_code:
                              type: string
                              description: International phone dialing code
                              example: '+93'
                            flag_url:
                              type: string
                              format: uri
                              description: URL to the country's flag image
                              example: https://flagcdn.com/af.svg
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1Countries
      x-operation-id-source: derived
  /v1/countries/{country_code}/subdivisions:
    get:
      summary: List Subdivision Codes — ISO 3166-1 alpha-2
      description: Retrieve a list of subdivision codes for a specific country following ISO 3166-2 standard
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CountryCodeParam'
      responses:
        '200':
          description: List of subdivisions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subdivisions:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Name of the subdivision
                              example: Bandarban
                            code:
                              type: string
                              description: ISO 3166-2 subdivision code
                              example: BD-01
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1CountriesByCountryCodeSubdivisions
      x-operation-id-source: derived
  /v1/transaction-purposes:
    get:
      summary: List Transaction Purposes
      description: Retrieve a list of available transaction purposes
      tags:
      - Catalogue
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PerPageParam'
      - $ref: '#/components/parameters/CurrentPageParam'
      - name: type
        in: query
        description: Filter transaction purposes by type
        required: true
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
      responses:
        '200':
          description: List of transaction purposes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            description: The current page number
                            example: 1
                          per_page:
                            type: integer
                            description: Number of items per page
                            example: 10
                          total_page:
                            type: integer
                            description: Total number of pages
                            example: 5
                          total:
                            type: integer
                            description: Total number of items
                            example: 50
                      transaction_purposes:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the transaction purpose
                              example: 1
                            title:
                              type: string
                              description: Name of the transaction purpose
                              example: Personal Transfer
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1TransactionPurposes
      x-operation-id-source: derived
