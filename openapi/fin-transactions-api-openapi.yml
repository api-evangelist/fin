  /v1/transactions/{transaction_id}:
    get:
      operationId: getTransactionById
      summary: Fetch Transaction Details V1
      description: Returns full details for a transaction by ID, including status, amounts, fees, and settlement data. The populated fields vary based on the transaction type.
      x-mint:
        content: "<Warning>\n  For **CRYPTO_DEPOSIT** and **CRYPTO_WITHDRAWAL** transaction types, you must use [Fetch Transaction Details V2](/api-reference/transactions/fetch-transaction-details-v2). We also recommend migrating all transaction detail lookups to V2, as V1 will be deprecated soon.\n</Warning>\n"
      tags:
      - Transactions
      security:
      - bearerAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 7f0124cd-6845-47d3-8b39-43f80cd50274
      responses:
        '200':
          description: Transaction details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 7f0124cd-6845-47d3-8b39-43f80cd50274
                      transaction_type:
                        type: string
                        enum:
                        - ONRAMP
                        - OFFRAMP
                        - CRYPTO_WITHDRAWAL
                        - CRYPTO_DEPOSIT
                        example: OFFRAMP
                      customer_id:
                        type: string
                        format: uuid
                        nullable: true
                        example: null
                      beneficiary_id:
                        type: string
                        format: uuid
                        example: e6200609-1ebb-41bb-a4d3-fd9e3bae8419
                      hash:
                        type: string
                        example: 796b21c4412f1208918cf744e38b62c95aa55674baf62a0a3b8b189c212d0b7e
                      transaction_ref_id:
                        type: string
                        nullable: true
                        example: 7f0124cd-6845-47d3-8b39-43f80cd50274
                      status:
                        type: string
                        enum:
                        - PENDING
                        - PROCESSING
                        - COMPLETED
                        - FAILED
                        - REFUNDED
                        example: COMPLETED
                      batch_info:
                        type: object
                        nullable: true
                        example: null
                      from_amount:
                        type: number
                        example: 1.1
                      payout_amount:
                        type: number
                        example: 94.919
                      processing_amount:
                        type: number
                        example: 1.1
                      from_currency:
                        type: string
                        example: USD
                      payout_currency:
                        type: string
                        example: INR
                      fx_rate:
                        type: number
                        example: 86.29
                      developer_fee:
                        type: number
                        example: 1.25495
                      developer_fee_percentage:
