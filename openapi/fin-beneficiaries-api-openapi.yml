openapi: 3.2.0
info:
  title: Fin.com Beneficiaries API
  version: 1.0.0
  description: A simple API specification
servers:
- url: https://sandbox.api.fin.com
  description: Sandbox server
- url: https://api.fin.com
  description: Production server
tags:
- name: Beneficiaries
  description: Manage beneficiary accounts for payments and transfers
paths:
  /v1/beneficiaries/dynamic-required-fields:
    get:
      summary: List Required Information For Beneficiaries
      description: Retrieve dynamic list of required fields and validation rules for creating a beneficiary based on country, currency, and payment method
      tags:
      - Beneficiaries
      security:
      - bearerAuth: []
      parameters:
      - name: customer_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: Customer ID of a verified customer
        example: 5a6f47f7-7326-409f-a4da-90e409133fb8
      - name: beneficiary_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - INDIVIDUAL
          - BUSINESS
        description: Beneficiary type
      - name: country_code
        in: query
        required: true
        schema:
          type: string
        description: ISO Alpha-3 country code of any supported country from the 'Get countries' list
        example: USA
      - name: currency_code
        in: query
        required: true
        schema:
          type: string
        description: Currency code of the supported country
        example: USD
      - name: method
        in: query
        required: true
        schema:
          type: string
        description: Available method for a particular country (e.g., BANK, E_WALLET)
        example: BANK
      - name: method_id
        in: query
        required: true
        schema:
          type: string
        description: Available method ID of a particular country
        example: '1'
      - name: branch_id
        in: query
        required: false
        schema:
          type: string
        description: (Optional) Required if method contains branches
        example: '100'
      responses:
        '200':
          description: Required fields retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        info:
                          type: string
                          description: Human-readable description of the field
                          example: Customer ID of our system
                        key:
                          type: string
                          description: Field key name
                          example: customer_id
                        validation_rule:
                          type: object
                          description: Validation rules for this field
                          properties:
                            type:
                              type: string
                              description: Data type for the field
                              enum:
                              - UUID
                              - TEXT
                              - NUMBER
                              - DECIMAL
                              example: UUID
                            max_length:
                              type: integer
                              description: Maximum length for text fields
                              example: 36
                            min_length:
                              type: integer
                              description: Minimum length for text fields
                              example: 36
                            min:
                              type: number
                              description: Minimum value for number/decimal fields
                              example: 0
                            allowed_values:
                              type: array
                              description: List of allowed values (for enum-like fields)
                              items:
                                type: string
                              example:
                              - POLYGON
              examples:
                OK:
                  summary: OK
                  value:
                    data:
                    - info: Customer ID of our system
                      key: customer_id
                      validation_rule:
                        max_length: 36
                        min_length: 36
                        type: UUID
                    - info: Refund Wallet Address
                      key: refund_wallet_address
                      validation_rule:
                        max_length: 42
                        min_length: 42
                        type: TEXT
                    - info: Bank branch id
                      key: receiver_destination_branch_id
                      validation_rule:
                        min: 1
                        type: NUMBER
                    - info: Wallet ID
                      key: receiver_destination_account_number
                      validation_rule:
                        max_length: 20
                        min_length: 1
                        type: TEXT
                    - info: Name of the blockchain network (e.g., Ethereum, Polygon)
                      key: source_chain_name
                      validation_rule:
                        allowed_values:
                        - POLYGON
                        type: TEXT
                    - info: Payment Mode
                      key: receiver_destination_method
                      validation_rule:
                        allowed_values:
                        - BANK
                        - E_WALLET
                        max_length: 50
                        type: TEXT
                    - info: Enter Dev Fee (Fixed)
                      key: developer_fee_fixed
                      validation_rule:
                        min: 0
                        type: DECIMAL
                    - info: Can be a bank or e_wallet id
                      key: receiver_destination_method_id
                      validation_rule:
                        min: 1
                        type: NUMBER
                    - info: Id of the crypto token (e.g., USDC, USDT)
                      key: source_token_id
                      validation_rule:
                        allowed_values:
                        - USDC
                        - USDT
                        type: TEXT
                    - info: Receiver First Name
                      key: receiver_first_name
                      validation_rule:
                        max_length: 100
                        min_length: 1
                        type: TEXT
                    - info: Enter Dev Fee (Percentage)
                      key: developer_fee_percentage
                      validation_rule:
                        min: 0
                        type: DECIMAL
                    - info: Enter Beneficiary Type
                      key: beneficiary_type
                      validation_rule:
                        allowed_values:
                        - INDIVIDUAL
                        - BUSINESS
                        type: TEXT
                    - info: Receiver Country
                      key: receiver_country_code
                      validation_rule:
                        max_length: 3
                        min_length: 3
                        type: TEXT
                    - info: Purpose Of Remittance
                      key: purpose_of_remittance
                      validation_rule:
                        max_length: 2
                        min_length: 2
                        type: TEXT
                    - info: Receiver Last Name
                      key: receiver_last_name
                      validation_rule:
                        max_length: 100
                        min_length: 1
                        type: TEXT
        '401':
          $ref: '#/components/responses/AuthenticationError'
      operationId: getV1BeneficiariesDynamicRequiredFields
      x-operation-id-source: derived
  /v1/beneficiaries/countries:
    get:
      summary: List Available Countries
      description: Retrieve a list of countries supported for beneficiary creation with available payment methods and phone validation rules
