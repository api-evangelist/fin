                          example: 4
                        code:
                          type: string
                          description: ISO Alpha-3 country code
                          example: AUS
                        name:
                          type: string
                          description: Country name
                          example: Australia
                        currency_code:
                          type: string
                          description: Currency code for the country
                          example: AUD
                        phone:
                          type: object
                          description: Phone validation rules for the country
                          properties:
                            code:
                              type: string
                              description: International phone dialing code
                              example: '+61'
                            max_length:
                              type: integer
                              description: Maximum phone number length
                              example: 9
                            min_length:
                              type: integer
                              description: Minimum phone number length
                              example: 9
                        available_methods:
                          type: array
                          description: Available payment methods for the country
                          items:
                            type: string
                            enum:
                            - BANK
                            - E_WALLET
                          example:
                          - BANK
                        flag:
                          type: string
                          format: uri
                          description: URL to the country's flag image
