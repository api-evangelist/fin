  /v1/beneficiaries/methods:
    get:
      summary: List Bank Identifiers
      description: Retrieve a list of available banks or e-wallet providers for a specific country and method type
      tags:
      - Beneficiaries
      security:
      - bearerAuth: []
      parameters:
      - name: country_code
        in: query
        required: true
        schema:
          type: string
        description: ISO Alpha-3 country code based on available countries to offramp
        example: BGD
      - name: method
        in: query
        required: true
        schema:
          type: string
          enum:
          - BANK
          - E_WALLET
        description: Payment method based on available methods in a particular country
      responses:
        '200':
          description: Bank/method identifiers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the bank or e-wallet
                          example: 1461
                        name:
                          type: string
                          description: Name of the bank or e-wallet provider
                          example: AB BANK LTD.
                        method:
                          type: string
                          enum:
