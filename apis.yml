aid: fin
name: Fin
description: >-
  Fin (fin.com) is a global cross-border payments infrastructure company that moves
  money internationally over stablecoin rails and direct liquidity networks instead
  of traditional correspondent banking, settling in minutes rather than days. Its
  Orchestration API lets businesses onboard individual and business customers
  (KYC/KYB), create beneficiaries, quote FX and fees, send transfer and batch
  payouts, provision multi-currency virtual accounts that convert fiat deposits to
  crypto (e.g. USD to USDC), and run crypto orchestration across exchanges. Founded
  by ex-Citadel engineers, Fin raised a $17M Series A to bring its stablecoin-powered
  high-value payments product to market. This profile was enriched from the public
  developer surface at developer.fin.com.
